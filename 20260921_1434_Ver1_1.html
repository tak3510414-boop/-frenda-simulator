<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frenda Battle Prototype</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f4f6f7}
*{box-sizing:border-box} body{margin:0;padding:16px;max-width:900px;margin:auto}
h1{font-size:22px;margin:4px 0 14px}.note{font-size:12px;color:#667}
.card{background:white;border:1px solid #d5d8dc;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:#566573;display:block;margin-top:7px}
input,select,button{font:inherit} input,select{width:100%;padding:9px;border:1px solid #ccd1d1;border-radius:9px;background:white}
button{padding:10px 14px;border:0;border-radius:10px;background:#273746;color:white;font-weight:650}
button.secondary{background:#5d6d7e}button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.hpwrap{height:18px;background:#e5e7e9;border-radius:9px;overflow:hidden;margin:7px 0}.hp{height:100%;background:#58d68d;width:100%;transition:width .25s}
.battleName{font-size:20px;font-weight:750}.stats{font-size:13px;color:#566573}
.log{min-height:160px;max-height:300px;overflow:auto;background:#111;color:#eee;border-radius:10px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2f3;font-size:12px;margin-right:4px}
.hidden{display:none}.sectionTitle{font-weight:750;margin-bottom:8px}
</style>
</head>
<body>
<h1>フレンダ風 家庭用バトル・試作品 Ver1.1</h1>
<div class="note">写真登録 → パラメータ修正 → 保存 → 1vs1バトルを試せる最小版。画像OCRは次段階。</div>

<div class="card">
 <div class="sectionTitle">① ピック登録</div>
 <label>写真</label><input id="photo" type="file" accept="image/*" capture="environment">
 <div class="grid">
  <div><label>名前</label><input id="name" value="ピカチュウ"></div>
  <div><label>グレード</label><select id="grade"><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div>
  <div><label>タイプ</label><select id="type"></select></div>
  <div><label>HP</label><input id="hp" type="number" value="110"></div>
  <div><label>こうげき</label><input id="atk" type="number" value="95"></div>
  <div><label>ぼうぎょ</label><input id="def" type="number" value="75"></div>
  <div><label>すばやさ</label><input id="spd" type="number" value="105"></div>
  <div><label>技名</label><input id="move" value="10まんボルト"></div>
  <div><label>技タイプ</label><select id="moveType"></select></div>
  <div><label>技威力</label><input id="power" type="number" value="90"></div>
 </div>
 <div class="row" style="margin-top:12px"><button id="savePick">ピックを保存</button><button class="secondary" id="clearPicks">登録を全削除</button></div>
 <div id="pickCount" class="note" style="margin-top:8px"></div><div id="status" class="note" style="margin-top:6px;font-weight:700"></div>
</div>

<div class="card">
 <div class="sectionTitle">② 1vs1 バトル設定</div>
 <div class="grid">
  <div><label>自分</label><select id="allySelect"></select></div>
  <div><label>相手</label><select id="enemySelect"></select></div>
 </div>
 <div class="row" style="margin-top:12px"><button id="start">バトル開始</button><label style="flex:0 0 auto"><input id="detail" type="checkbox" checked style="width:auto"> 計算詳細</label></div>
</div>

<div id="battle" class="hidden">
 <div class="grid">
  <div class="card"><div class="battleName" id="allyName"></div><div id="allyMeta"></div><div class="hpwrap"><div class="hp" id="allyBar"></div></div><div id="allyHp"></div><div class="stats" id="allyStats"></div></div>
  <div class="card"><div class="battleName" id="enemyName"></div><div id="enemyMeta"></div><div class="hpwrap"><div class="hp" id="enemyBar"></div></div><div id="enemyHp"></div><div class="stats" id="enemyStats"></div></div>
 </div>
 <div class="card">
  <div class="sectionTitle">③ バトルログ</div>
  <div id="log" class="log"></div>
  <div class="row" style="margin-top:10px"><button id="next">次へ ▶</button><button class="secondary" id="reset">終了</button></div>
 </div>
</div>

<script>
const TYPES=["ノーマル","ほのお","みず","でんき","くさ","こおり","かくとう","どく","じめん","ひこう","エスパー","むし","いわ","ゴースト","ドラゴン","あく","はがね","フェアリー"];
const $=id=>document.getElementById(id);
for(const id of ["type","moveType"]){TYPES.forEach(t=>{let o=document.createElement("option");o.textContent=t;o.value=t;$(id).appendChild(o)});}
$("type").value="でんき";$("moveType").value="でんき";

const demo=[
{id:"demo1",name:"リザードン",grade:4,type:"ほのお",hp:120,atk:100,def:82,spd:90,move:"かえんほうしゃ",moveType:"ほのお",power:90},
{id:"demo2",name:"カメックス",grade:4,type:"みず",hp:125,atk:92,def:105,spd:78,move:"ハイドロポンプ",moveType:"みず",power:110},
{id:"demo3",name:"フシギバナ",grade:4,type:"くさ",hp:128,atk:96,def:98,spd:80,move:"ソーラービーム",moveType:"くさ",power:120}
];
let picks;
try{
  picks=JSON.parse(localStorage.getItem("frenda_picks")||"null")||demo;
}catch(e){
  picks=[...demo];
}
let battle=null, queue=[];

function save(){
 try{localStorage.setItem("frenda_picks",JSON.stringify(picks));}
 catch(e){$("status").textContent="※この開き方では端末への永続保存が制限されていますが、今回の登録は使用できます。";}
 refreshSelects();
}
function refreshSelects(){
 for(const id of ["allySelect","enemySelect"]){$(id).innerHTML="";picks.forEach((p,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${p.name} ★${p.grade}`;$(id).appendChild(o)})}
 if(picks.length>1)$("enemySelect").value=1;
 $("pickCount").textContent=`登録済み：${picks.length}枚（この端末のブラウザ内に保存）`;
}
refreshSelects();

$("savePick").onclick=()=>{
 const p={id:(window.crypto && typeof window.crypto.randomUUID==="function")?window.crypto.randomUUID():(Date.now().toString()+"-"+Math.random().toString(16).slice(2)),name:$("name").value.trim()||"名称未設定",grade:+$("grade").value,type:$("type").value,
 hp:+$("hp").value,atk:+$("atk").value,def:+$("def").value,spd:+$("spd").value,move:$("move").value.trim()||"わざ",moveType:$("moveType").value,power:+$("power").value};
 picks.push(p);save();$("status").textContent="✓ 「"+p.name+"」を保存しました。";
};
$("clearPicks").onclick=()=>{if(confirm("登録データを初期化しますか？")){picks=[...demo];save();}};

const chart={
"ほのお":{"くさ":2,"こおり":2,"むし":2,"はがね":2,"ほのお":.5,"みず":.5,"いわ":.5,"ドラゴン":.5},
"みず":{"ほのお":2,"じめん":2,"いわ":2,"みず":.5,"くさ":.5,"ドラゴン":.5},
"でんき":{"みず":2,"ひこう":2,"でんき":.5,"くさ":.5,"ドラゴン":.5,"じめん":0},
"くさ":{"みず":2,"じめん":2,"いわ":2,"ほのお":.5,"くさ":.5,"どく":.5,"ひこう":.5,"むし":.5,"ドラゴン":.5,"はがね":.5}
};
function eff(mt,dt){return chart[mt]?.[dt] ?? 1}
function damage(a,d){
 const base=Math.floor((((2*50/5+2)*a.power*a.atk/d.def)/50))+2;
 const stab=a.moveType===a.type?1.5:1;
 const e=eff(a.moveType,d.type);
 const gm={2:.9,3:1,4:1.1,5:1.2}[a.grade]||1;
 return {base,stab,e,gm,dmg:e===0?0:Math.max(1,Math.floor(base*stab*e*gm))};
}
function card(side,p){
 $(side+"Name").textContent=p.name;
 $(side+"Meta").innerHTML=`<span class=badge>${p.type}</span><span class=badge>★${p.grade}</span>`;
 $(side+"Hp").textContent=`HP ${p.cur}/${p.hp}`;
 $(side+"Bar").style.width=(Math.max(0,p.cur)/p.hp*100)+"%";
 $(side+"Stats").textContent=`攻 ${p.atk} / 防 ${p.def} / 速 ${p.spd} / ${p.move}（${p.moveType}・威力${p.power}）`;
}
function render(){card("ally",battle.a);card("enemy",battle.b)}
function push(s){queue.push(s)}
function attack(a,d,label){
 const x=damage(a,d); push(`${label}${a.name}の「${a.move}」！`);
 if($("detail").checked)push(`計算: Base=${x.base} × STAB ${x.stab} × 相性 ${x.e} × ★補正 ${x.gm} = ${x.dmg}`);
 push(x.e===0?"こうかがない！":x.e>1?"こうかは ばつぐん！":x.e<1?"こうかは いまひとつ…":`${d.name}に ${x.dmg} ダメージ！`);
 d.cur=Math.max(0,d.cur-x.dmg); push(`${d.name} HP → ${d.cur}/${d.hp}`);
 if(d.cur===0)push(`${d.name}は たおれた！`);
}
function makeTurn(){
 if(battle.a.cur<=0||battle.b.cur<=0)return;
 battle.turn++; push(`\n▼ ターン ${battle.turn}`);
 let first,second,flabel,slabel;
 if(battle.a.spd===battle.b.spd){first=Math.random()<.5?battle.a:battle.b}else first=battle.a.spd>battle.b.spd?battle.a:battle.b;
 second=first===battle.a?battle.b:battle.a; flabel=first===battle.a?"自分: ":"相手: "; slabel=second===battle.a?"自分: ":"相手: ";
 push(`行動順: ${first.name}（速${first.spd}） → ${second.name}（速${second.spd}）`);
 attack(first,second,flabel);
 if(second.cur>0)attack(second,first,slabel);
 if(battle.a.cur<=0||battle.b.cur<=0)push(battle.a.cur<=0&&battle.b.cur<=0?"結果: 引き分け":battle.b.cur<=0?"結果: あなたの勝ち！":"結果: 相手の勝ち");
}
$("start").onclick=()=>{
 if(picks.length<2){alert("2枚以上登録してください");return}
 const a=JSON.parse(JSON.stringify(picks[+$("allySelect").value])), b=JSON.parse(JSON.stringify(picks[+$("enemySelect").value]));a.cur=a.hp;b.cur=b.hp;
 battle={a,b,turn:0};queue=[];$("log").textContent="";$("battle").classList.remove("hidden");render();push("バトル開始！");push(`${a.name} VS ${b.name}`);makeTurn();
};
$("next").onclick=()=>{
 if(!battle)return;
 if(queue.length===0 && battle.a.cur>0 && battle.b.cur>0)makeTurn();
 if(queue.length){$("log").textContent+=queue.shift()+"\n";$("log").scrollTop=$("log").scrollHeight;render();}
};
$("reset").onclick=()=>{$("battle").classList.add("hidden");battle=null;queue=[]};
</script>
</body>
</html>
