<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フレンダ 管理者メニュー</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#10283a 0,#184b67 170px,#eef4f7 170px);color:#193343;min-height:100vh}header{position:sticky;top:0;z-index:5;background:#0d2535ef;color:#fff;padding:11px 14px;backdrop-filter:blur(8px)}.head{max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.home{color:#fff;text-decoration:none;background:#ffffff17;border:1px solid #ffffff2d;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0b25351a}.title{font-size:20px;font-weight:1000;margin-bottom:8px}.muted{font-size:12px;color:#667c89;line-height:1.7}.field{display:grid;gap:6px;margin-top:13px}.field label,.label{font-size:12px;font-weight:900;color:#405b6a}input[type=password],input[type=time]{width:100%;padding:12px;border:1px solid #b9cbd5;border-radius:11px;font:inherit;background:#fff}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{position:relative}.day input{position:absolute;opacity:0}.day span{display:grid;place-items:center;padding:10px 0;border-radius:10px;background:#edf3f6;color:#456171;font-size:12px;font-weight:900;border:1px solid #d4e0e6}.day input:checked+span{background:#176fa0;color:#fff;border-color:#176fa0}.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px;border-radius:12px;background:#f2f6f8}.toggle input{width:20px;height:20px}.toggle span{font-size:13px;font-weight:900}.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;background:#176fa0;color:#fff;font:inherit;font-weight:950;margin-top:13px}.ghost{background:#e8eef2;color:#28495c}.ok{padding:10px 12px;border-radius:12px;background:#e8f8ef;color:#21734c;font-size:12px;font-weight:900;margin-top:10px}.warn{padding:10px 12px;border-radius:12px;background:#fff6da;color:#7a5a00;font-size:12px;line-height:1.6;margin-top:10px}
</style></head><body><header><div class="head"><div><b>⚙️ 管理者メニュー</b><div style="font-size:10px;opacity:.72">利用時間の設定</div></div><a class="home" href="index.html">🏠 ホーム</a></div></header><main><div id="app"></div></main><script src="frenda-parental.js?b=20260928_0810"></script><script>
(async()=>{const P=window.FRENDA_PARENTAL,app=document.getElementById('app'),next=new URLSearchParams(location.search).get('next');let unlocked=false;function afterAuth(){P.grantAdminSession(60);if(next==='test-center.html'){location.href='test-center.html';return true}return false}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){app.innerHTML=`<div class="card"><div class="title">🔑 管理者PIN</div><div class="muted">設定を変更するにはPINを入力してください。</div><div class="field"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="4〜8桁"></div><button class="btn" id="login">開く</button></div>`;document.getElementById('login').onclick=async()=>{if(await P.verifyPin(document.getElementById('pin').value)){unlocked=true;if(!afterAuth())settings()}else alert('PINが違います。')}}
function setup(){app.innerHTML=`<div class="card"><div class="title">🔐 はじめに管理者PINを設定</div><div class="muted">子どもが設定を変更できないよう、4〜8桁の数字を決めてください。</div><div class="field"><label>新しいPIN</label><input id="p1" type="password" inputmode="numeric" placeholder="4〜8桁"></div><div class="field"><label>もう一度</label><input id="p2" type="password" inputmode="numeric" placeholder="同じPIN"></div><button class="btn" id="savePin">PINを設定</button><div class="warn">初期の利用制限は「月〜金 5:00〜8:30／祝祭日は制限なし」です。</div></div>`;document.getElementById('savePin').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b)return alert('PINが一致しません。');try{await P.setPin(a);unlocked=true;if(!afterAuth())settings()}catch(e){alert(e.message)}}}
function settings(){const s=P.ensure(),c=s.dungeon;app.innerHTML=`<div class="card"><div class="title">🏰 ダンジョン利用制限</div><div class="toggle"><input id="enabled" type="checkbox" ${c.enabled?'checked':''}><span>利用時間を制限する</span></div><div class="field"><div class="label">制限する曜日</div><div class="days">${['日','月','火','水','木','金','土'].map((x,i)=>`<label class="day"><input type="checkbox" data-day="${i}" ${(c.days||[]).map(Number).includes(i)?'checked':''}><span>${x}</span></label>`).join('')}</div></div><div class="field"><div class="label">利用禁止時間</div><div class="times"><label><span class="label">開始</span><input id="start" type="time" value="${esc(c.start)}"></label><label><span class="label">終了</span><input id="end" type="time" value="${esc(c.end)}"></label></div></div><label class="toggle"><input id="holiday" type="checkbox" ${c.allowHolidays?'checked':''}><span>祝祭日は制限しない（曜日設定より優先して自動判定）</span></label><div class="muted" style="margin-top:10px">※ 土日は曜日チェックが外れている限り常に遊べます。祝祭日は「国民の祝日・振替休日・国民の休日」を含みます。</div><button class="btn" id="save">設定を保存</button><div class="ok">🧭 おでかけ探索は、この設定に関係なく常時利用できます。</div></div><div class="card"><div class="title">🛠 管理者ツール</div><div class="muted">テスト機能は管理者認証中だけ使用できます。</div><a class="btn" href="test-center.html" style="display:block;text-decoration:none;text-align:center">🧪 テストセンターを開く</a><button class="btn ghost" id="adminLogout">管理者認証を終了</button></div><div class="card"><div class="title">🔑 PIN変更</div><div class="times"><input id="np1" type="password" inputmode="numeric" placeholder="新しいPIN"><input id="np2" type="password" inputmode="numeric" placeholder="もう一度"></div><button class="btn ghost" id="changePin">PINを変更</button></div>`;
document.getElementById('save').onclick=()=>{const st=P.ensure();st.dungeon={enabled:document.getElementById('enabled').checked,days:[...document.querySelectorAll('[data-day]:checked')].map(x=>Number(x.dataset.day)),start:document.getElementById('start').value||'05:00',end:document.getElementById('end').value||'08:30',allowHolidays:document.getElementById('holiday').checked};P.save(st);alert('保存しました。')};
document.getElementById('changePin').onclick=async()=>{const a=document.getElementById('np1').value,b=document.getElementById('np2').value;if(a!==b)return alert('PINが一致しません。');try{await P.setPin(a);alert('PINを変更しました。');document.getElementById('np1').value=document.getElementById('np2').value=''}catch(e){alert(e.message)}};document.getElementById('adminLogout').onclick=()=>{P.revokeAdminSession();location.href='index.html'}}
if(P.hasPin())login();else setup();})();
</script></body></html>
