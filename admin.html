<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フレンダ 管理者メニュー</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#10283a 0,#184b67 170px,#eef4f7 170px);color:#193343;min-height:100vh}header{position:sticky;top:0;z-index:5;background:#0d2535ef;color:#fff;padding:11px 14px;backdrop-filter:blur(8px)}.head{max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.home{color:#fff;text-decoration:none;background:#ffffff17;border:1px solid #ffffff2d;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0b25351a}.title{font-size:20px;font-weight:1000;margin-bottom:8px}.muted{font-size:12px;color:#667c89;line-height:1.7}.field{display:grid;gap:6px;margin-top:13px}.field label,.label{font-size:12px;font-weight:900;color:#405b6a}input[type=password],input[type=time],input[type=number]{width:100%;padding:12px;border:1px solid #b9cbd5;border-radius:11px;font:inherit;background:#fff}.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px;border-radius:12px;background:#f2f6f8}.toggle input{width:20px;height:20px}.toggle span{font-size:13px;font-weight:900}.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;background:#176fa0;color:#fff;font:inherit;font-weight:950;margin-top:13px}.ghost{background:#e8eef2;color:#28495c}.ok{padding:10px 12px;border-radius:12px;background:#e8f8ef;color:#21734c;font-size:12px;font-weight:900;margin-top:10px}.warn{padding:10px 12px;border-radius:12px;background:#fff6da;color:#7a5a00;font-size:12px;line-height:1.6;margin-top:10px}.unitField{position:relative}.unitField input{padding-right:42px}.unitField span{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#607784}
.scheduleIntro{margin:12px 0;padding:11px 12px;border-radius:12px;background:#eef8ff;border:1px solid #c7e3f1;font-size:12px;line-height:1.65;color:#31596c}.scheduleGrid{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1fr);gap:7px;align-items:center}.scheduleHead{font-size:10px;font-weight:950;color:#627986;text-align:center;padding:3px}.dayName{font-size:13px;font-weight:1000;color:#24485b;text-align:center;padding:10px 4px;border-radius:10px;background:#edf3f6}.scheduleGrid input[type=time]{padding:9px 7px;font-size:15px;font-weight:850;text-align:center;min-width:0}.holidayBox{margin-top:14px;padding:12px;border-radius:14px;background:#fff7df;border:1px solid #ead38a}.holidayBox .dayName{background:#fff0b8;color:#715400}.bulkBox{margin-top:12px;padding:10px;border-radius:12px;background:#f5f8fa;border:1px solid #dde7ec}.bulkTimes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bulkButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.miniBtn{border:1px solid #bfd0da;border-radius:10px;padding:9px 8px;background:#fff;color:#31566a;font:inherit;font-size:11px;font-weight:900}.preview{margin-top:13px;padding:12px;border-radius:14px;background:#102f43;color:#fff}.previewTitle{font-size:12px;font-weight:1000;margin-bottom:8px}.previewLine{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #ffffff1f;font-size:12px}.previewLine:first-of-type{border-top:0}.previewLine b{white-space:nowrap}.statusOk{color:#a8f2c7}.statusBlock{color:#ffd19f}.priorityNote{font-size:11px;color:#795b00;line-height:1.55;margin-top:7px}
@media(max-width:520px){main{padding:10px}.card{padding:13px;border-radius:16px}.scheduleGrid{grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);gap:5px}.scheduleGrid input[type=time]{padding:8px 3px;font-size:14px}.dayName{font-size:12px;padding:9px 2px}.scheduleHead{font-size:9px}.bulkButtons{grid-template-columns:1fr}.title{font-size:18px}}
</style></head><body><header><div class="head"><div><b>⚙️ 管理者メニュー</b><div style="font-size:10px;opacity:.72">利用時間・プレイ時間の設定</div></div><a class="home" href="index.html">🏠 ホーム</a></div></header><main><div id="app"></div></main><script src="frenda-parental.js?b=20260929_0535"></script><script>
(async()=>{const P=window.FRENDA_PARENTAL,app=document.getElementById('app'),next=new URLSearchParams(location.search).get('next');let unlocked=false;function afterAuth(){P.grantAdminSession(60);if(next==='test-center.html'){location.href='test-center.html';return true}return false}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){app.innerHTML=`<div class="card"><div class="title">🔑 管理者PIN</div><div class="muted">設定を変更するにはPINを入力してください。</div><div class="field"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="4〜8桁"></div><button class="btn" id="login">開く</button></div>`;document.getElementById('login').onclick=async()=>{if(await P.verifyPin(document.getElementById('pin').value)){unlocked=true;if(!afterAuth())settings()}else alert('PINが違います。')}}
function setup(){app.innerHTML=`<div class="card"><div class="title">🔐 はじめに管理者PINを設定</div><div class="muted">子どもが設定を変更できないよう、4〜8桁の数字を決めてください。</div><div class="field"><label>新しいPIN</label><input id="p1" type="password" inputmode="numeric" placeholder="4〜8桁"></div><div class="field"><label>もう一度</label><input id="p2" type="password" inputmode="numeric" placeholder="同じPIN"></div><button class="btn" id="savePin">PINを設定</button><div class="warn">曜日ごとに「朝から利用できる時刻」と「夜から利用できなくなる時刻」を設定できます。祝祭日は別設定にできます。</div></div>`;document.getElementById('savePin').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b)return alert('PINが一致しません。');try{await P.setPin(a);unlocked=true;if(!afterAuth())settings()}catch(e){alert(e.message)}}}
const DAY_ORDER=[1,2,3,4,5,6,0],DAY_NAMES=['日','月','火','水','木','金','土'];
function ruleInput(day,kind){return document.querySelector(`[data-day="${day}"][data-kind="${kind}"]`)}
function draftSettings(){const st=P.ensure();st.dungeon.enabled=document.getElementById('enabled').checked;st.dungeon.weekly={};for(const day of DAY_ORDER)st.dungeon.weekly[day]={open:ruleInput(day,'open').value||'00:00',close:ruleInput(day,'close').value||'23:59'};st.dungeon.holiday={enabled:document.getElementById('holidayEnabled').checked,open:document.getElementById('holidayOpen').value||'00:00',close:document.getElementById('holidayClose').value||'23:59'};return st}
function minutes(v){const [h,m]=String(v||'00:00').split(':').map(Number);return h*60+m}
function validRules(st){for(const day of DAY_ORDER){const r=st.dungeon.weekly[day];if(minutes(r.open)>=minutes(r.close))return `${DAY_NAMES[day]}曜日は「朝から利用」を「夜から停止」より早い時刻にしてください。`}if(st.dungeon.holiday.enabled&&minutes(st.dungeon.holiday.open)>=minutes(st.dungeon.holiday.close))return '祝祭日は「朝から利用」を「夜から停止」より早い時刻にしてください。';return ''}
function preview(){const box=document.getElementById('preview');if(!box)return;const st=draftSettings(),now=new Date(),tom=new Date(now);tom.setDate(tom.getDate()+1);const line=(d,label,showNow)=>{const r=P.scheduleForDate(d,st.dungeon),holiday=P.isHoliday(d),tag=r.source==='holiday'?'🎌祝祭日設定':'曜日設定';let status='';if(showNow&&st.dungeon.enabled){const n=d.getHours()*60+d.getMinutes(),a=minutes(r.open),b=minutes(r.close),ok=n>=a&&n<b;status=`<span class="${ok?'statusOk':'statusBlock'}">${ok?'利用できます':'利用できません'}</span>`}else if(showNow&&!st.dungeon.enabled)status='<span class="statusOk">制限OFF</span>';return `<div class="previewLine"><span><b>${label}（${DAY_NAMES[d.getDay()]}${holiday?'・祝':''}）</b><br>${esc(r.open)}〜${esc(r.close)} <small>${tag}</small></span>${status}</div>`};box.innerHTML=`<div class="previewTitle">👀 設定プレビュー</div>${line(now,'今日',true)}${line(tom,'明日',false)}`}
function settings(){const s=P.ensure(),c=s.dungeon,e=s.eyeCare;const rows=DAY_ORDER.map(day=>{const r=c.weekly?.[day]||{open:'00:00',close:'23:59'};return `<div class="dayName">${DAY_NAMES[day]}</div><input type="time" step="300" data-day="${day}" data-kind="open" value="${esc(r.open)}" aria-label="${DAY_NAMES[day]}曜日 朝から利用"><input type="time" step="300" data-day="${day}" data-kind="close" value="${esc(r.close)}" aria-label="${DAY_NAMES[day]}曜日 夜から停止">`}).join('');app.innerHTML=`<div class="card"><div class="title">👁 プレイ・休憩時間</div><div class="muted">ダンジョンとおでかけ探索で共通です。</div><div class="times" style="margin-top:12px"><label><span class="label">プレイ時間</span><div class="unitField"><input id="playMinutes" type="number" inputmode="numeric" min="1" max="180" value="${e.playMinutes}"><span>分</span></div></label><label><span class="label">休憩時間</span><div class="unitField"><input id="restMinutes" type="number" inputmode="numeric" min="1" max="120" value="${e.restMinutes}"><span>分</span></div></label></div><div class="muted" style="margin-top:9px">変更を保存すると、現在のプレイタイマーは新しい設定で最初から始まります。</div></div>
<div class="card"><div class="title">🏰 ダンジョン利用時間</div><label class="toggle"><input id="enabled" type="checkbox" ${c.enabled?'checked':''}><span>利用時間を制限する</span></label><div class="scheduleIntro"><b>その日の「朝から利用」〜「夜から停止」だけ遊べます。</b><br>例：月曜の夜21:00で停止。翌日が火曜なら、火曜の「朝から利用」の時刻で解除します。翌日が祝祭日なら、祝祭日設定を優先します。</div><div class="scheduleGrid"><div></div><div class="scheduleHead">🌅 朝から利用</div><div class="scheduleHead">🌙 夜から停止</div>${rows}</div>
<div class="bulkBox"><div class="label">一括入力</div><div class="bulkTimes"><input id="bulkOpen" type="time" step="300" value="08:00"><input id="bulkClose" type="time" step="300" value="21:00"></div><div class="bulkButtons"><button type="button" class="miniBtn" id="applyWeekdays">月〜金へ反映</button><button type="button" class="miniBtn" id="applyAll">全曜日へ反映</button></div></div>
<div class="holidayBox"><label class="toggle" style="margin-top:0;background:#fff3c9"><input id="holidayEnabled" type="checkbox" ${c.holiday?.enabled!==false?'checked':''}><span>🎌 祝祭日は下の設定を曜日より優先</span></label><div class="scheduleGrid" style="margin-top:9px"><div class="dayName">祝祭日</div><input id="holidayOpen" type="time" step="300" value="${esc(c.holiday?.open||'00:00')}"><input id="holidayClose" type="time" step="300" value="${esc(c.holiday?.close||'23:59')}"></div><div class="priorityNote">国民の祝日・振替休日・国民の休日を含みます。祝祭日に該当した日は、曜日の時刻ではなくこの時刻を使います。</div></div><div class="preview" id="preview"></div><button class="btn" id="save">設定を保存</button><div class="ok">🧭 おでかけ探索は、ダンジョン利用時間に関係なく常時利用できます。</div></div>
<div class="card"><div class="title">🛠 管理者ツール</div><div class="muted">テスト機能は管理者認証中だけ使用できます。</div><a class="btn" href="test-center.html" style="display:block;text-decoration:none;text-align:center">🧪 テストセンターを開く</a><button class="btn ghost" id="adminLogout">管理者認証を終了</button></div><div class="card"><div class="title">🔑 PIN変更</div><div class="times"><input id="np1" type="password" inputmode="numeric" placeholder="新しいPIN"><input id="np2" type="password" inputmode="numeric" placeholder="もう一度"></div><button class="btn ghost" id="changePin">PINを変更</button></div>`;
const updatePreview=()=>preview();document.querySelectorAll('[data-day][data-kind],#holidayOpen,#holidayClose,#holidayEnabled,#enabled').forEach(x=>x.addEventListener('change',updatePreview));
document.getElementById('applyWeekdays').onclick=()=>{const o=document.getElementById('bulkOpen').value,c=document.getElementById('bulkClose').value;[1,2,3,4,5].forEach(d=>{ruleInput(d,'open').value=o;ruleInput(d,'close').value=c});preview()};document.getElementById('applyAll').onclick=()=>{const o=document.getElementById('bulkOpen').value,c=document.getElementById('bulkClose').value;DAY_ORDER.forEach(d=>{ruleInput(d,'open').value=o;ruleInput(d,'close').value=c});preview()};
document.getElementById('save').onclick=()=>{const before=P.eyeCareSettings(),st=draftSettings(),err=validRules(st);if(err)return alert(err);st.eyeCare={playMinutes:Number(document.getElementById('playMinutes').value)||30,restMinutes:Number(document.getElementById('restMinutes').value)||10};P.save(st);const after=P.eyeCareSettings();if(before.playMinutes!==after.playMinutes||before.restMinutes!==after.restMinutes)P.resetEyeTimer();alert('保存しました。')};
document.getElementById('changePin').onclick=async()=>{const a=document.getElementById('np1').value,b=document.getElementById('np2').value;if(a!==b)return alert('PINが一致しません。');try{await P.setPin(a);alert('PINを変更しました。');document.getElementById('np1').value=document.getElementById('np2').value=''}catch(e){alert(e.message)}};document.getElementById('adminLogout').onclick=()=>{P.revokeAdminSession();location.href='index.html'};preview()}
if(P.hasPin())login();else setup();})();
</script></body></html>
