/* Ver0.70 fighter matchup appeal */
.teamChoiceCard .teamStrip{overflow:visible}
.teamMini.matchupGood,.teamMini.matchupBad,.teamMini.matchupVeryBad{transition:transform .18s ease,opacity .18s ease,filter .18s ease,box-shadow .18s ease,border-color .18s ease}
.teamMini.matchupGood{transform:translateY(-4px);border-color:#f0bd24!important;background:linear-gradient(180deg,#fffef4,#fff8d7)!important;box-shadow:0 5px 15px #a56e1633,0 0 0 2px #ffe88788 inset!important}
.teamMini.matchupGood .teamMiniHead img{animation:matchupVolunteerHop 1.15s ease-in-out infinite}
.teamMini.matchupBad{transform:translateY(5px) scale(.97);opacity:.78;filter:saturate(.7)}
.teamMini.matchupVeryBad{transform:translateY(4px) scale(.98);opacity:1;filter:none;border-color:#f08b55!important;background:linear-gradient(180deg,#fff8f0,#ffe2ce)!important;box-shadow:0 0 0 3px #ffb27b66 inset,0 5px 14px #b85a2b24!important}

.matchupAppeal.veryBad{background:#f47b43;color:#fff;border:1px solid #c94c1d;box-shadow:0 2px 6px #8d2f1638}

.adventureLog{padding:0;overflow:hidden}
.adventureLogSummary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;cursor:pointer;user-select:none;-webkit-user-select:none}

.adventureLogSummary::after{content:"開く ▼";font-size:11px;font-weight:1000;color:#5f7481;white-space:nowrap}
.adventureLog[open] .adventureLogSummary::after{content:"閉じる ▲"}

.battleLogDetails>summary::after{content:"▼";font-size:9px;opacity:.75;transition:transform .18s ease}

.battleLogDetails .battleLogEntries{border-top:1px solid #ffffff18;padding:5px 10px 8px}

.battleLogDetails[open]{cursor:default}

/* Ver0.35: clearer route roles */
/* Ver0.36: egg hatch requirements, dynamic home version, bonus result confirmation */
/* Ver0.37: auto update reload, stronger event results, victory splash */
.routeBtn.event .routeIcon:after{content:"BONUS";display:block;font-size:7px;letter-spacing:.12em;color:#ffe58a;margin-top:2px}
.routeBtn.unknown .routeIcon:after{content:"!?";display:block;font-size:9px;color:#fff;margin-top:1px}

/* Ver0.37: update check, stronger bonus feedback, battle victory splash */
/* Ver0.38: victory button tap/click fix; decorative stars ignore pointer events */
/* Ver0.39: make event target-selection prompt much more prominent */
/* Ver0.40: boss grade table, conspicuous MISS, hatch replay-loop guard */
/* Ver0.41: after hatch reveal, tapping the hatch screen also advances */
/* Ver0.42: training list shows actionable picks only; Home forces update check */
/* Ver0.43: larger, more readable battle damage numbers */
/* Ver0.44: lucky-rest full-HP softlock prevention and recovery */
/* Ver0.45: legendary Pokémon are limited to Rank 5 dungeons; non-Rank-5 eggs cannot hatch legendary Pokémon */
/* Ver0.46: enemy and egg lotteries are species-first, then pick; duplicate pick counts no longer raise species odds */
/* Ver0.47: evolution cost lowered to 2 points for first evolution and 3 points thereafter */
/* Ver0.48: evolution premonition cues and staged full-screen evolution animation */
/* Ver0.49: Rank 5 legendary encounters get a dedicated omen/silhouette/reveal intro and battle LEGENDARY badge */
/* Ver0.50: normal, elite, and boss encounters get short themed cut-ins; legendary intro still takes priority */
/* Ver0.51: evolution-family bond levels, run-end bond growth, mild heal/endure/start-buff effects, and bond UI */
/* Ver0.52: 12% floor-transition pickup events with auto-use berry, ball boost, growth candy, charm, and revive shard */
/* Ver0.53: dungeon-specific ambient effects and themed run/battle backgrounds for all 10 dungeons */
/* Ver0.54: species-level seen tracking, NEW first-encounter cues, faint seen/unowned dex art, and first-registration notices */
/* Ver0.55: boss victory now flows through egg discovery, roulette, and rarity-specific egg reward presentation before pending hatches */
/* Ver0.56: lightweight Web Audio sound effects with persisted 100%/50%/OFF home setting for battle, capture, legendary, and evolution scenes */
/* Ver0.57: previous-team recall plus auto team selection using matchup, grade, stats, training, bond, and role diversity */
/* Ver0.58: evolution preserves source rarity when possible; if no equal-or-higher registered pick exists, explicit confirmation allows lower rarity */
/* Ver0.59: dungeon entry gets a dedicated themed one-step intro before B1 route selection, with first-visit flavor text */
/* Ver0.60: battle layout refactor — expanded always-visible 3-member status cards and higher/larger player-vs-enemy display */
/* Ver0.61: dex series filter, large/medium/small dex+owned views, sticky just-trained cards, and one-screen enlarged home dashboard */
/* Ver0.62: fix Pokédex visibility to track encounters/ownership per exact pick instead of sharing visibility across same-species picks */
/* Ver0.63: slower readable presentation pacing, tappable message artwork, larger home text, clear fanfare, and chronological series filter order */
/* Ver0.64: simplify owned-pick front cards by grouping growth/drill resources, separating EXP, compacting permanent boosts, and reducing evolution text duplication */
/* Ver0.65: owned-pick back side now includes front-side growth information and tappable help popups for growth, drill, EXP, bond, and permanent boosts */
/* Ver0.66: growth points are evolution-only; non-evolving reward events convert to drill points; drill+EXP are grouped; startup uses the generated jacket splash */
/* Ver0.82: legendary + mythical special Pokémon are restricted to Rank 5 dungeons/eggs */
/* Ver0.88: enemy reveal, fighter selection, and battle now share one fixed combat-stage area; party selection is embedded in the stage to prevent desktop bottom clipping. */
/* Ver0.67: unified pick filters across Pokédex, owned picks, and party selection (search / series / type / grade / status / sort). */
/* Ver0.68: remove the duplicated “<dungeon name>へ！” line from every dungeon-entry screen. */
/* Ver0.69: floor-road cells keep the icon of the route selected on each cleared/current floor. */
/* Ver0.70: fighter-selection cards now give playful matchup appeals based on current enemy type effectiveness. */
/* Ver0.71: punchier attack impact SFX — short swish followed by a sharp crack and low thump on hit. */
/* Ver0.72: adventure log is collapsed by default and can be expanded/collapsed by tapping its header. */
/* Ver0.73: returning home after a completed run forces an update check and immediately loads a newer dungeon version when available. */
/* Ver0.74: after an enemy is fully revealed, tapping anywhere in the run area advances exactly like "戦闘準備へ". */
/* Ver0.88: alert meter discourages repeated non-battle routes; alert 3 triggers a forced normal battle on the next floor; 3 road battles grant boss-start ATK/DEF +2. */

<script>
(()=>{
"use strict";
const APP_VERSION=document.documentElement.dataset.appVersion||"0.00";
document.title=`フレンダダンジョン Ver${APP_VERSION}`;
const versionBadge=document.getElementById("versionBadge");if(versionBadge)versionBadge.textContent=`Ver${APP_VERSION}`;
const DUNGEON_TEST_REQUESTED=new URLSearchParams(location.search).get("test")==="1";
const DUNGEON_TEST_MODE=DUNGEON_TEST_REQUESTED&&!!window.FRENDA_PARENTAL?.isAdminAuthenticated();
const DUNGEON_TEST_CASE=new URLSearchParams(location.search).get("case")||"";
const DUNGEON_TIMER_CASE=new URLSearchParams(location.search).get("timer")||"";
const PARENTAL=window.FRENDA_PARENTAL;
if(!DUNGEON_TEST_MODE&&PARENTAL?.check("dungeon")?.blocked){PARENTAL.renderBlockedPage({app:"dungeon"});return;}
const DATA=window.FRENDA_DATA;
const UI=window.FRENDA_UI;
if(!DATA)throw new Error("frenda-data.js を読み込めませんでした。");
if(!UI)throw new Error("frenda-ui.js を読み込めませんでした。");


const TEST_SANDBOX=window.FRENDA_TEST;
const STORE=TEST_SANDBOX?.active?TEST_SANDBOX.storage:window.localStorage;
if(DUNGEON_TEST_REQUESTED&&!DUNGEON_TEST_MODE){location.replace("admin.html?next=test-center.html");return;}


const EXPEDITION_TIMER_KEY=DATA.KEYS.expedition;
function expeditionTimerState(){const x=DATA.readJSON(EXPEDITION_TIMER_KEY,null);return x&&typeof x==="object"?x:null}
function updateExpeditionTimerBadge(now=Date.now()){const el=document.getElementById("expeditionTimerBadge");if(!el)return;const x=expeditionTimerState(),m=x?.mission;if(x?.status==="exploring"&&m&&Number.isFinite(Number(m.returnAt))){const remain=Number(m.returnAt)-now;if(remain<=0){el.className="expeditionTimerBadge done";el.textContent="✨ 探索完了";el.title="おでかけ探索の帰還時間になりました"}else{const min=Math.max(1,Math.ceil(remain/60000));el.className="expeditionTimerBadge";el.textContent=`🧭 探索終了まで あと${min}分`;el.title=`帰還予定 ${new Date(Number(m.returnAt)).toLocaleString("ja-JP")}`}}else if(x?.status==="returned"){el.className="expeditionTimerBadge done";el.textContent="✨ 探索完了";el.title="おでかけ探索の成果を受け取れます"}else{el.className="expeditionTimerBadge";el.textContent="🧭 探索なし";el.title="現在、おでかけ探索には出ていません"}}

function createEyeCareResume({data,onTick,extraStorageKeys=[]}={}){
 if(!data)throw new Error("FRENDA_DATA is required");
 const KEY=data.KEYS.eyeTimer,PLAY_MS=30*60*1000,REST_MS=10*60*1000;
 let handle=null,locked=false,started=false;
 const read=()=>{const x=data.readJSON(KEY,null);return x&&typeof x==="object"?x:null};
 const write=x=>{try{data.writeJSON(KEY,x)}catch{}return x};
 const fresh=(now=Date.now())=>write({phase:"play",playUntil:now+PLAY_MS,updatedAt:now});
 function resolve(now=Date.now()){
  let x=read();
  if(!x||!Number.isFinite(Number(x.playUntil)))return fresh(now);
  if(x.phase==="ready")return x;
  if(x.phase==="rest"){
   const restUntil=Number(x.restUntil)||Number(x.playUntil)+REST_MS;
   if(now<restUntil){x.restUntil=restUntil;x.reason=x.reason||"auto";return x}
   x={phase:"ready",playUntil:Number(x.playUntil)||now,restUntil,reason:x.reason||"auto",readyAt:restUntil,updatedAt:now};write(x);return x
  }
  const playUntil=Number(x.playUntil);

 const apply=p=>{

<script id="v183-cloud-indicator">
(()=>{
 const el=document.getElementById("headerCloudStatus");if(!el)return;
 function refresh(){
  const hidden=document.querySelector(".frendaCloudBtn"),failed=hidden?.dataset?.kind==="error",logged=!!window.FrendaCloud?.isLoggedIn?.();
  const state=failed?"error":logged?"cloud":"local",icon=failed?"🌧️":logged?"☁️":"💾",label=failed?"クラウドログイン・接続に失敗中":logged?"クラウドログイン中":"ローカル保存（クラウドなし）";
  if(el.dataset.state!==state)el.dataset.state=state;
  if(el.textContent!==icon)el.textContent=icon;
  if(el.title!==label)el.title=label;
  if(el.getAttribute("aria-label")!==label)el.setAttribute("aria-label",label);
 }
 refresh();setTimeout(refresh,250);setTimeout(refresh,1000);setInterval(refresh,2000);
})();
