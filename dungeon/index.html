<title>フレンダダンジョン Ver0.03</title>
<style>
*{box-sizing:border-box}

button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}button:disabled{opacity:.42;cursor:default}.secondary{background:#63717c}.ghost{background:#e8eef3;color:#233743}.danger{background:#aa3131}.good{background:#15884c}.purple{background:#6841a7}
header{position:sticky;top:0;z-index:30;background:#0d2535eF;color:#fff;backdrop-filter:blur(8px);padding:11px 14px;border-bottom:1px solid #ffffff18}.headrow{max-width:920px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}.brand b{display:block;font-size:18px}.brand small{opacity:.72}.headerBtns{display:flex;gap:7px;flex-wrap:wrap}.headerBtns button{padding:8px 10px;font-size:12px}
main{max-width:920px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid #dce5eb;border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 7px 22px #0c243015}.heroCard{background:linear-gradient(145deg,#092a3d,#104d69);border-color:#28718e;color:#fff;overflow:hidden;position:relative}.heroCard:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-140px;background:#28d8ff1d}.heroCard h1{font-size:24px;margin:0 0 5px}.heroCard p{margin:0;color:#d6f6ff;line-height:1.6}.kicker{font-size:11px;font-weight:950;letter-spacing:.16em;color:#69e7ff;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.muted{color:var(--muted);font-size:12px}.sectionTitle{font-size:17px;font-weight:950;margin:0 0 11px}.hidden{display:none!important}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;background:#edf3f7;color:#40515d;font-size:11px;font-weight:850}.badge.good{background:#dff4e7;color:#167744}.badge.bad{background:#fee5e5;color:#a22929}.badge.gold{background:#fff2bd;color:#785500}.badge.dark{background:#173d54;color:#fff}.badge.purple{background:#eee6ff;color:#5b3c92}
.menuGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.menuBtn{min-height:74px;background:linear-gradient(180deg,#fff,#eef5f8);border:1px solid #cfdde5;color:#173243;box-shadow:0 3px 0 #c5d0d6}.menuBtn b{display:block;font-size:20px;margin-bottom:2px}.menuBtn span{font-size:10px;color:#657580}.continueBtn{width:100%;font-size:17px;background:linear-gradient(180deg,#29b865,#178b4b);box-shadow:0 4px 0 #0e6b39;margin-bottom:12px}
.starterGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.starterCard{border:2px solid #b9ccd7;border-radius:17px;background:linear-gradient(145deg,#f9fdff,#e8f1f6);padding:10px;text-align:center}.starterCard img{width:100%;max-width:160px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#dfe7ec}.starterCard h3{margin:7px 0 2px}.stars{color:#e3a300;font-weight:1000;letter-spacing:-1px}.starterCard button{width:100%;margin-top:8px}.starterSetGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}.starterSetCard{border:2px solid #b9ccd7;border-radius:18px;background:linear-gradient(145deg,#f9fdff,#e8f1f6);padding:12px}.starterSetCard h3{margin:0 0 8px;text-align:center}.starterTrio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.starterMini{text-align:center;min-width:0}.starterMini img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:9px;background:#dfe7ec}.starterMini b{display:block;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.starterMini small{display:block;font-size:9px;color:#667681}.starterSetCard>button{width:100%;margin-top:10px}
.dungeonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.dungeonCard{border:2px solid #b7cbd5;border-radius:17px;padding:13px;background:linear-gradient(160deg,#f9feff,#eaf4f7);position:relative}.dungeonCard.locked{filter:grayscale(.65);opacity:.6}.dungeonCard h3{margin:0 0 5px}.dungeonCard .bigStar{font-size:20px;color:#da9d00}.dungeonMeta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metaBox{background:#fff;border:1px solid #dbe4e9;border-radius:10px;padding:7px}.metaBox span{display:block;font-size:10px;color:#697883}.metaBox b{font-size:13px}
.teamSelectGrid,.ownedGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.pickCard{border:2px solid #b9cad4;border-radius:16px;background:#fff;padding:8px;position:relative}.pickCard.selected{outline:3px solid #2bcaf0;outline-offset:-2px;background:#eafbff}.pickCard img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#e3eaee}.pickCard b{display:block;margin-top:6px}.pickCard small{display:block;color:#667681;line-height:1.45}.pickCard .selectMark{position:absolute;right:7px;top:7px;border-radius:999px;padding:4px 7px;background:#0786b0;color:#fff;font-size:10px;font-weight:900}.filterRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filterRow input,.filterRow select{padding:10px;border:1px solid #bdcbd4;border-radius:10px;background:#fff;min-width:150px;flex:1}
.runTop{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.runStatus{background:linear-gradient(145deg,#0a3146,#126585);color:#fff;border-radius:16px;padding:14px}.floorBig{font-size:28px;font-weight:1000}.progressTrack{height:10px;background:#ffffff28;border-radius:999px;overflow:hidden;margin-top:7px}.progressFill{height:100%;background:linear-gradient(90deg,#46e6ff,#85f4a9);transition:width .25s}.eggMini{background:#f7f2ff;border:1px solid #d8cbed;border-radius:16px;padding:12px}.routeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.routeCard{border:2px solid #c7d5dd;background:linear-gradient(180deg,#fff,#eef4f7);color:#253b49;padding:15px;min-height:128px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 4px 0 #c5d0d6}.routeCard .ico{font-size:31px}.routeCard b{font-size:17px;margin:4px 0}.routeCard small{color:#667883}.routeCard.battle{border-color:#d1a35e}.routeCard.elite{border-color:#a87dca;background:linear-gradient(180deg,#fff,#f0e7fa)}.routeCard.heal{border-color:#74bf8f}.routeCard.event{border-color:#6cbcc9}.routeCard.unknown{border-color:#9aa8b0}
.teamStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.teamMini{border:1px solid #d2dce2;border-radius:13px;padding:8px;background:#fff;position:relative}.teamMini.ko{filter:grayscale(.9);opacity:.58}.teamMiniHead{display:flex;gap:7px;align-items:center}.teamMini img{width:42px;height:60px;object-fit:cover;border-radius:7px;background:#e1e8ec}.teamMini b{font-size:12px}.teamMini small{font-size:9px;color:#647680}.hpbar{height:10px;background:#e2e7ea;border-radius:999px;overflow:hidden;margin-top:6px}.hpfill{height:100%;background:#37b960;transition:width .25s}.hpfill.mid{background:#e8a82d}.hpfill.low{background:#d74b47}.buffs{font-size:9px;color:#536572;margin-top:4px;min-height:13px}
.battleArena{background:linear-gradient(180deg,#ccefff,#f7fbfd 58%,#e8f0e5);border:1px solid #bad4df;border-radius:20px;padding:14px;overflow:hidden}.enemyPreview{text-align:center;margin-bottom:10px}.enemyPreview img{width:140px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#e2e8ec}.battleGrid{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center}.fighterBox{background:#fff;border:1px solid #d1dce2;border-radius:16px;padding:10px;text-align:center}.fighterBox img{width:min(145px,100%);aspect-ratio:2/3;object-fit:cover;border-radius:11px;background:#e0e7eb}.fighterBox h3{margin:5px 0 1px}.vs{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#132b3a;color:#fff;font-weight:1000;margin:auto}.battleActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.battleLog{max-height:180px;overflow:auto;background:#102737;color:#e9f9ff;border-radius:12px;padding:9px;font-size:12px;line-height:1.55;margin-top:10px}.chooserGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chooseFighter{background:#eef5f8;color:#1d3948;border:2px solid #c4d5dd;padding:9px}.chooseFighter:disabled{opacity:.45}.chooseFighter img{width:55px;height:78px;object-fit:cover;border-radius:7px;display:block;margin:auto}.chooseFighter b{display:block;margin-top:4px;font-size:12px}
.rewardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.rewardBtn{background:linear-gradient(180deg,#fff8d1,#f6e59f);color:#503e00;border:2px solid #e1c65e;min-height:105px}.rewardBtn b{display:block;font-size:16px;margin:5px 0}.summary{padding:18px;text-align:center}.summary .resultIcon{font-size:54px}.summary h2{margin:4px 0}.summary p{line-height:1.6;color:#586975}.notice{padding:10px 12px;border-radius:12px;background:#fff7d8;border:1px solid #ecd98f;font-size:12px;line-height:1.6}.errorBox{background:#ffe9e9;border:1px solid #e4a9a9;color:#832929;border-radius:13px;padding:12px;margin-bottom:12px;white-space:pre-wrap}.logline{padding:4px 0;border-bottom:1px solid #ffffff13}.logline:last-child{border-bottom:0}
@media(max-width:700px){body{background:linear-gradient(180deg,#0a2234 0,#123c55 140px,var(--bg) 140px)}main{padding:10px}.menuGrid{grid-template-columns:repeat(2,1fr)}.starterGrid{grid-template-columns:1fr}.runTop{grid-template-columns:1fr}.routeGrid{grid-template-columns:1fr}.teamStrip{grid-template-columns:1fr 1fr}.battleGrid{grid-template-columns:1fr 44px 1fr}.vs{width:42px;height:42px;font-size:12px}.rewardGrid{grid-template-columns:1fr}.chooserGrid{grid-template-columns:1fr 1fr}.brand small{display:none}}
</style>
</head>
<body>
<header><div class="headrow"><div class="brand"><b>フレンダダンジョン</b><small>Ver0.03 / Simulator Ver6.73 共通データ対応</small></div><div class="headerBtns"><button class="ghost" id="homeBtn">ホーム</button><button class="danger" id="withdrawBtn" style="display:none">撤退</button></div></div></header>
<main id="app"></main>

<!-- 配置想定: 共通ファイルの1階層下に dungeon/index.html を置く -->
<script src="../frenda-master.js"></script>
<script src="../frenda-core.js"></script>
<script>
(()=>{
"use strict";
const APP_VERSION="0.04";
const SAVE_KEY="frenda:dungeon:v1";
const DAMAGE_MODEL_KEY="frenda:damageModel:v1";
const app=document.getElementById("app"),homeBtn=document.getElementById("homeBtn"),withdrawBtn=document.getElementById("withdrawBtn");
const MASTER=window.FRENDA_MASTER;
const CORE=window.FRENDA_CORE;
const RECORDS=Array.isArray(MASTER?.records)?MASTER.records:[];
const THEMES={forest:{id:"forest",name:"森のダンジョン",types:["くさ","むし"],icon:"🌳"}};
const ROUTE_DEF={battle:{icon:"⚔️",label:"通常戦",hint:"ポケモンの気配がする",cls:"battle"},elite:{icon:"💀",label:"強敵",hint:"強い気配を感じる……",cls:"elite"},event:{icon:"✨",label:"イベント",hint:"何かが起こりそうだ",cls:"event"},heal:{icon:"❤️",label:"回復",hint:"休めそうな場所がある",cls:"heal"},unknown:{icon:"❓",label:"不明",hint:"先に何があるか分からない",cls:"unknown"}};
const ROUTE_RATES_EARLY={battle:30,elite:10,event:20,heal:20,unknown:20};
const ROUTE_RATES_LATE={battle:30,elite:20,event:15,heal:15,unknown:20};
const ENEMY_GRADE_RATES={1:{2:60,3:30,4:9,5:1},2:{2:45,3:35,4:17,5:3},3:{2:30,3:40,4:24,5:6},4:{2:20,3:35,4:35,5:10},5:{2:10,3:30,4:40,5:20}};
const DIFF_BONUS={1:0,2:.10,3:.20,4:.35,5:.50};
const STARTER_SET_DEFS=[
 {key:"kanto",label:"カントー",names:["フシギダネ","ヒトカゲ","ゼニガメ"]},
 {key:"johto",label:"ジョウト",names:["チコリータ","ヒノアラシ","ワニノコ"]},
 {key:"hoenn",label:"ホウエン",names:["キモリ","アチャモ","ミズゴロウ"]},
 {key:"sinnoh",label:"シンオウ",names:["ナエトル","ヒコザル","ポッチャマ"]},
 {key:"unova",label:"イッシュ",names:["ツタージャ","ポカブ","ミジュマル"]},
 {key:"kalos",label:"カロス",names:["ハリマロン","フォッコ","ケロマツ"]},
 {key:"alola",label:"アローラ",names:["モクロー","ニャビー","アシマリ"]},
 {key:"galar",label:"ガラル",names:["サルノリ","ヒバニー","メッソン"]},
 {key:"paldea",label:"パルデア",names:["ニャオハ","ホゲータ","クワッス"]}
];
const stateDefault=()=>({saveVersion:2,appVersion:APP_VERSION,initialized:false,starterSetOptions:null,starterSetKey:null,starterIds:[],starterOptions:null,starterId:null,owned:[],dex:{},trainingPoints:{},permanentBoosts:{},eggs:[],eggCap:3,unlocks:{forest:[1]},stats:{},run:null,lastSummary:null});
let state=loadState();
migrateState();
let screen="home";
let teamSelection=[];
let currentDungeon={id:"forest",difficulty:1};
let message="";

function save(){try{state.appVersion=APP_VERSION;state.saveVersion=2;localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){console.error(e)}}
function loadState(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return x&&typeof x==="object"?Object.assign(stateDefault(),x):stateDefault()}catch{return stateDefault()}}
function migrateState(){
 const v=Number(state.saveVersion||1);
 if(v>=2)return;
 // Ver0.01は初期所持が1体のみでゲット機能も未実装。
 // Ver0.02の御三家3体開始へ合わせるため、初回選択だけやり直す。
 state=stateDefault();
 save();
}
function resetSave(){if(!confirm("フレンダダンジョンのセーブデータを初期化しますか？"))return;if(!confirm("御三家選択を含む全進行状況が消えます。本当に初期化しますか？"))return;localStorage.removeItem(SAVE_KEY);state=stateDefault();screen="home";render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rec(id){return RECORDS.find(r=>r.master_id===id)||null}
function clone(o){return JSON.parse(JSON.stringify(o))}
function validBattle(r){return r&&Number(r.hp)>0&&Number(r.atk)>0&&Number(r.def)>0&&Number(r.sp_atk)>0&&Number(r.sp_def)>0&&r.move_type}
function imageOf(r){return r?.official_image||""}
function gradeText(r){return r?.grade?"★"+r.grade:"★-"}
function maxHpFor(id){const r=rec(id);const b=state.permanentBoosts?.[id]?.hp||0;return Math.max(1,Math.round(Number(r?.hp||1)+b))}
function ownedEntry(id){return state.owned.find(x=>x.id===id)||null}
function statKey(did,diff){return `${did}:${diff}`}
function getStat(did,diff){const k=statKey(did,diff);if(!state.stats[k])state.stats[k]={deepest:0,clears:0};return state.stats[k]}
function updateDeepest(f){if(!state.run)return;const s=getStat(state.run.dungeonId,state.run.difficulty);s.deepest=Math.max(s.deepest,Math.min(10,f));save()}
function pct(n,d){return d?Math.max(0,Math.min(100,Math.round(n/d*100))):0}
function hpClass(p){return p<=25?" low":p<=50?" mid":""}
function chooseWeighted(map){const a=Object.entries(map),sum=a.reduce((n,[,w])=>n+Number(w),0);let x=Math.random()*sum;for(const [k,w] of a){x-=Number(w);if(x<0)return k}return a[a.length-1]?.[0]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uniqueSample(a,n){return shuffle(a).slice(0,n)}
function typesHTML(r){return [r?.type1,r?.type2].filter(Boolean).map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}
function starterPickForName(name){
 const a=RECORDS.filter(r=>r.name_ja===name&&Number(r.grade)===2&&validBattle(r));
 if(!a.length)return null;
 return a[Math.floor(Math.random()*a.length)].master_id;
}
function ensureStarterSetOptions(){
 if(Array.isArray(state.starterSetOptions)&&state.starterSetOptions.length)return;
 state.starterSetOptions=STARTER_SET_DEFS.map(def=>{
   const ids=def.names.map(starterPickForName);
   return ids.every(Boolean)?{key:def.key,label:def.label,names:def.names.slice(),ids}:null;
 }).filter(Boolean);
 save();
}
function ownNew(id){if(!id||ownedEntry(id))return false;state.owned.push({id});state.dex[id]={obtained:true,current:true};save();return true}
function pickStarterSet(key){
 if(state.initialized)return;
 const set=state.starterSetOptions?.find(x=>x.key===key);
 if(!set||!Array.isArray(set.ids)||set.ids.length!==3)return;
 set.ids.forEach(ownNew);
 state.initialized=true;
 state.starterSetKey=set.key;
 state.starterIds=set.ids.slice();
 state.starterId=null;
 state.unlocks={forest:[1]};
 save();
 screen="home";
 render();
}
function unlocked(did,diff){return (state.unlocks[did]||[]).includes(diff)}
function unlockedDifficulties(did){return state.unlocks[did]||[]}
function homeHero(){const s=getStat("forest",1);return `<div class="card heroCard"><div class="kicker">FRENDA DUNGEON</div><h1>森のダンジョンから冒険開始</h1><p>地下10階を目指し、HPを管理しながら分岐を選択。Ver0.04では森★1の敵能力を15％抑え、強敵を少し減らして序盤を遊びやすくしています。</p><div class="row" style="margin-top:10px"><span class="badge dark">最深 B${s.deepest}F</span><span class="badge dark">クリア ${s.clears}回</span><span class="badge dark">所持 ${state.owned.length}枚</span></div></div>`}
function render(){withdrawBtn.style.display=state.run?"inline-block":"none";homeBtn.style.display=screen==="home"&&!state.run?"none":"inline-block";if(!MASTER||!CORE||!RECORDS.length){app.innerHTML=`<div class="errorBox">共通ファイルを読み込めませんでした。\n\nこのファイルを dungeon/index.html として配置し、1階層上に frenda-master.js / frenda-core.js を置いてください。</div>`;return}if(!state.initialized){renderStarter();return}if(state.run){renderRun();return}if(screen==="dungeons")return renderDungeonList();if(screen==="team")return renderTeamSelect();if(screen==="owned")return renderOwned();if(screen==="save")return renderSaveMenu();renderHome()}
function renderStarter(){
 ensureStarterSetOptions();
 if(!state.starterSetOptions.length){app.innerHTML=`<div class="errorBox">御三家セットを作成できませんでした。共通マスターデータを確認してください。</div>`;return}
 app.innerHTML=`<div class="card heroCard"><div class="kicker">STARTER TRIO</div><h1>最初の御三家を選ぼう</h1><p>地方ごとの御三家3体をセットで獲得して冒険を始めます。3体とも登録済み★2ピックから選ばれます。選び直しはセーブ初期化時のみです。</p></div><div class="card"><div class="sectionTitle">御三家セットを選択</div><div class="starterSetGrid">${state.starterSetOptions.map(set=>`<div class="starterSetCard"><h3>${esc(set.label)}の御三家</h3><div class="starterTrio">${set.ids.map(id=>{const r=rec(id);return `<div class="starterMini"><img src="${esc(imageOf(r))}" alt=""><b>${esc(r.name_ja)}</b><small>${gradeText(r)}</small></div>`}).join("")}</div><button data-starter-set="${esc(set.key)}">この御三家で始める</button></div>`).join("")}</div><div class="notice" style="margin-top:12px">現在の共通マスターに★2ピックが3体そろっている地方だけ表示します。将来マスターデータに追加されれば候補も増やせます。</div></div>`;
 app.querySelectorAll("[data-starter-set]").forEach(b=>b.onclick=()=>{
   const set=state.starterSetOptions.find(x=>x.key===b.dataset.starterSet);
   if(set&&confirm(`${set.label}の御三家3体で始めますか？\n${set.names.join("・")}`))pickStarterSet(set.key);
 });
}

function renderSummary(){const x=state.lastSummary||{type:"withdraw",floor:1};const clear=x.type==="clear",def=x.type==="defeat";app.innerHTML=`<div class="card summary"><div class="resultIcon">${clear?"🏆":def?"💥":"🚪"}</div><h2>${clear?"ダンジョンクリア！":def?"全滅……":"撤退しました"}</h2><p>到達：地下${x.floor}階<br>${clear?"森のダンジョン★1を制覇しました。":"獲得した進行記録は保存されています。"}</p>${clear?'<div class="notice">Ver0.04では卵ルーレットは未実装です。次段階でクリア報酬を追加します。</div>':""}<button id="summaryHome" style="margin-top:12px">ホームへ</button></div>`;withdrawBtn.style.display="none";document.getElementById("summaryHome").onclick=()=>{screen="home";render()}}
function teamMiniHTML(t,i){const r=rec(t.id),max=maxHpFor(t.id),p=pct(t.hp,max);return `<div class="teamMini ${t.ko?"ko":""}"><div class="teamMiniHead"><img src="${esc(imageOf(r))}" alt=""><div><b>${esc(r.name_ja)}</b><small>${gradeText(r)} / ${t.ko?"ひんし":`HP ${t.hp}/${max}`}</small></div></div><div class="hpbar"><div class="hpfill${hpClass(p)}" style="width:${p}%"></div></div><div class="buffs">攻+${t.tempAtk||0} / 防+${t.tempDef||0}</div></div>`}
function renderRun(){const r=state.run;if(!r)return;const theme=THEMES[r.dungeonId];let body=`<div class="runTop"><div class="runStatus"><div class="kicker">${esc(theme.name)} ★${r.difficulty}</div><div class="floorBig">地下${r.floor}階 / 10</div><div class="progressTrack"><div class="progressFill" style="width:${r.floor*10}%"></div></div></div><div class="eggMini"><b>🥚 卵</b><div class="muted">Ver0.03では未実装</div><div style="margin-top:5px"><span class="badge purple">所持上限 ${state.eggCap}</span></div></div></div><div class="card"><div class="sectionTitle">チーム</div><div class="teamStrip">${runTeam().map(teamMiniHTML).join("")}</div></div>`;
 if(r.scene==="route")body+=renderRoutesHTML();else if(r.scene==="chooseFighter")body+=renderChooseFighterHTML();else if(r.scene==="battle")body+=renderBattleHTML();else if(r.scene==="reward"||r.scene==="rewardTarget")body+=renderRewardHTML();else if(r.scene==="heal")body+=renderHealHTML();else if(r.scene==="eventTarget")body+=renderEventTargetHTML();else if(r.scene==="bossIntro")body+=`<div class="card summary"><div class="resultIcon">👑</div><h2>地下10階・ボス戦</h2><p>3匹の強敵との連戦です。相手は1匹ずつ登場します。</p><button id="bossStart">ボス戦を始める</button></div>`;
 body+=`<div class="card"><div class="sectionTitle">冒険ログ</div><div class="battleLog">${r.logs.slice(-12).map(x=>`<div class="logline">${esc(x)}</div>`).join("")}</div></div>`;app.innerHTML=body;bindRunHandlers()}
function renderRoutesHTML(){const r=state.run,peek=r.peek>0;return `<div class="card"><div class="sectionTitle">進む道を選ぶ</div><div class="routeGrid">${r.routeOptions.map(x=>{const d=ROUTE_DEF[x.type];return `<button class="routeCard ${d.cls}" data-route="${esc(x.id)}"><span class="ico">${d.icon}</span><b>${d.label}</b><small>${peek?`${d.hint}（先読み中）`:d.hint}</small></button>`}).join("")}</div><div class="muted" style="margin-top:8px">一度選ぶと戻れません。</div></div>`}
function renderChooseFighterHTML(){const en=currentEnemy(),left=state.run.encounter.enemies.length-state.run.encounter.index;return `<div class="card"><div class="enemyPreview"><div class="kicker" style="color:#1672e6">ENEMY ${state.run.encounter.index+1}/${state.run.encounter.enemies.length}</div><img src="${esc(imageOf(en))}" alt=""><h2>${esc(en.name_ja)}</h2><div>${typesHTML(en)}</div><span class="badge gold">${gradeText(en)}</span> <span class="badge">残り${left}匹</span></div><div class="sectionTitle">出すポケモンを選択</div><div class="chooserGrid">${runTeam().map((t,i)=>{const rr=rec(t.id);return `<button class="chooseFighter" data-fighter="${i}" ${t.ko?"disabled":""}><img src="${esc(imageOf(rr))}" alt=""><b>${esc(rr.name_ja)}</b><small>HP ${t.hp}/${maxHpFor(t.id)}</small></button>`}).join("")}</div></div>`}
function renderBattleHTML(){const b=state.run.battle,t=runTeam()[b.teamIndex],me=teamRec(t),en=currentEnemy(),mp=pct(t.hp,maxHpFor(t.id)),ep=pct(b.enemyHp,en.hp);return `<div class="card"><div class="battleArena"><div class="battleGrid"><div class="fighterBox"><img src="${esc(imageOf(me))}" alt=""><h3>${esc(me.name_ja)}</h3><small>${gradeText(me)}</small><div class="hpbar"><div class="hpfill${hpClass(mp)}" style="width:${mp}%"></div></div><b>HP ${t.hp}/${maxHpFor(t.id)}</b></div><div class="vs">VS</div><div class="fighterBox"><img src="${esc(imageOf(en))}" alt=""><h3>${esc(en.name_ja)}</h3><small>${gradeText(en)}</small><div class="hpbar"><div class="hpfill${hpClass(ep)}" style="width:${ep}%"></div></div><b>HP ${b.enemyHp}/${en.hp}</b></div></div><div class="battleActions"><button id="attackBtn">攻撃する</button><button class="secondary" id="switchBtn" ${runTeam().filter(x=>!x.ko).length<2?"disabled":""}>交代する</button></div><div class="battleLog">${b.log.slice(-10).map(x=>`<div class="logline">${esc(x)}</div>`).join("")}</div></div></div>`}
function renderRewardHTML(){const rw=state.run.reward;if(state.run.scene==="rewardTarget"){const opt=rw.options[rw.pick];return `<div class="card"><div class="sectionTitle">${esc(opt.label)}を誰に使う？</div><div class="chooserGrid">${runTeam().map((t,i)=>{const rr=rec(t.id);return `<button class="chooseFighter" data-reward-target="${i}" ${t.ko?"disabled":""}><img src="${esc(imageOf(rr))}" alt=""><b>${esc(rr.name_ja)}</b><small>HP ${t.hp}/${maxHpFor(t.id)}</small></button>`}).join("")}</div></div>`}return `<div class="card"><div class="sectionTitle">勝利報酬を1つ選ぶ</div><div class="rewardGrid">${rw.options.map((x,i)=>`<button class="rewardBtn" data-reward="${i}"><span>🎁</span><b>${esc(x.label)}</b><small>${esc(x.desc)}</small></button>`).join("")}</div></div>`}
function renderHealHTML(){return `<div class="card"><div class="sectionTitle">❤️ 回復ポイント</div><div class="rewardGrid"><button class="rewardBtn" id="healOne"><span>💚</span><b>1匹を全回復</b><small>ひんし状態も復活</small></button><button class="rewardBtn" id="healAll"><span>💞</span><b>全員50%回復</b><small>ひんしは復活しない</small></button></div></div>`}
function eventLabel(k){return {heal30:"1匹30%回復",heal20:"1匹20%回復",healAll15:"全員15%回復",atk2:"攻撃+2",def2:"防御+2",shield20:"次戦被ダメ20%減",danger:"危険な泉：HP20%減・攻撃+4",guard:"守りの祭壇：HP10%減・防御+4",lucky:"幸運の休息：50%回復",healSingleSelect:"1匹を全回復"}[k]||"イベント"}
function renderEventTargetHTML(){const e=state.run.event;return `<div class="card"><div class="sectionTitle">✨ ${esc(eventLabel(e.kind))}</div><div class="muted" style="margin-bottom:10px">対象のポケモンを選んでください。</div><div class="chooserGrid">${runTeam().map((t,i)=>{const rr=rec(t.id),can=e.kind==="healSingleSelect"?true:!t.ko;return `<button class="chooseFighter" data-event-target="${i}" ${can?"":"disabled"}><img src="${esc(imageOf(rr))}" alt=""><b>${esc(rr.name_ja)}</b><small>${t.ko?"ひんし":`HP ${t.hp}/${maxHpFor(t.id)}`}</small></button>`}).join("")}</div></div>`}
function bindRunHandlers(){app.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{const x=state.run.routeOptions.find(r=>r.id===b.dataset.route);if(x)selectRoute(x)});app.querySelectorAll("[data-fighter]").forEach(b=>b.onclick=()=>startFighter(Number(b.dataset.fighter)));const atk=document.getElementById("attackBtn");if(atk)atk.onclick=doAttack;const sw=document.getElementById("switchBtn");if(sw)sw.onclick=()=>{const b=state.run.battle;const candidates=runTeam().map((t,i)=>({t,i})).filter(x=>!x.t.ko&&x.i!==b.teamIndex);if(!candidates.length)return;const names=candidates.map((x,j)=>`${j+1}:${rec(x.t.id).name_ja}`).join(" / ");const n=Number(prompt(`交代先を番号で入力\n${names}`));if(n>=1&&n<=candidates.length)switchFighter(candidates[n-1].i)};app.querySelectorAll("[data-reward]").forEach(b=>b.onclick=()=>applyReward(Number(b.dataset.reward)));app.querySelectorAll("[data-reward-target]").forEach(b=>b.onclick=()=>applyReward(state.run.reward.pick,Number(b.dataset.rewardTarget)));const ho=document.getElementById("healOne");if(ho)ho.onclick=()=>healChoice("single");const ha=document.getElementById("healAll");if(ha)ha.onclick=()=>healChoice("all");app.querySelectorAll("[data-event-target]").forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.eventTarget);if(state.run.event?.kind==="healSingleSelect")healChoice("single",idx);else applyEventTarget(idx)});const bs=document.getElementById("bossStart");if(bs)bs.onclick=()=>beginEncounter("boss")}
function renderOwned(){app.innerHTML=`<div class="card"><div class="sectionTitle">ダンジョン所持ピック</div><div class="muted" style="margin-bottom:10px">シミュレーター側の実物所持とは別管理です。</div><div class="ownedGrid">${state.owned.map(o=>{const r=rec(o.id),pb=state.permanentBoosts[o.id]||{};return `<div class="pickCard"><img src="${esc(imageOf(r))}" alt=""><b>${esc(r.name_ja)}</b><small>${gradeText(r)} / ${esc(r.pick_no)}</small><div>${typesHTML(r)}</div><small>恒久強化 HP+${pb.hp||0} / 攻+${pb.atk||0} / 防+${pb.def||0}</small></div>`}).join("")}</div></div>`}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=`frenda-dungeon-save-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importSave(file){const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||typeof x!=="object")throw new Error("形式不正");state=Object.assign(stateDefault(),x);save();alert("セーブデータを読み込みました。");screen="home";render()}catch(e){alert("読み込みに失敗しました。\n"+e.message)}};rd.readAsText(file)}
function renderSaveMenu(){app.innerHTML=`<div class="card"><div class="sectionTitle">セーブ管理</div><div class="row"><button id="exportBtn">セーブを書き出す</button><button class="secondary" id="importBtn">セーブを読み込む</button><button class="danger" id="resetBtn">初期化</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><div class="notice" style="margin-top:12px">通常は自動保存されます。書き出しファイルは端末移行・バックアップ用です。</div></div>`;document.getElementById("exportBtn").onclick=exportSave;document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importSave(e.target.files[0])};document.getElementById("resetBtn").onclick=resetSave}

homeBtn.onclick=()=>{if(state.run){screen="home";renderRun()}else{screen="home";render()}};
withdrawBtn.onclick=withdraw;
if(state.lastSummary&&screen==="summary")renderSummary();else render();
})();
</script>
