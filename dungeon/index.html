async function doAttack(){state.run.switchSelecting=false;const b=state.run.battle;if(!b||b.busy)return;const t=runTeam()[b.teamIndex];if(!t||t.ko)return;const enc=state.run.encounter;enc.currentParticipants=Array.isArray(enc.currentParticipants)?enc.currentParticipants:[];if(!enc.currentParticipants.includes(t.id))enc.currentParticipants.push(t.id);b.hasAttacked=true;const me=teamRec(t),en=currentEnemy(),cmp=CORE.compareSpeed(me,en),meFirst=cmp>=0;b.busy=true;const atkBtn=document.getElementById("attackBtn"),swBtn=document.getElementById("switchBtn");if(atkBtn)atkBtn.disabled=true;if(swBtn)swBtn.disabled=true;await showTurnSplash(b.turn,meFirst,me.name_ja,en.name_ja);const meAct=async()=>{if(t.ko||b.enemyHp<=0)return;const x=attackValue(me,en);if(x.hit){b.enemyHp=Math.max(0,b.enemyHp-x.damage);const enc=state.run.encounter;if(!Array.isArray(enc.enemyHps))enc.enemyHps=enc.enemies.map((e,i)=>i===enc.index?b.enemyHp:Number(e.hp));enc.enemyHps[enc.index]=b.enemyHp;battleLine(`${me.name_ja}の${CORE.skillName(me)}！ ${en.name_ja}に${x.damage}ダメージ。`)}else battleLine(`${me.name_ja}の攻撃は外れた！`);await playDungeonAttack(me,"enemy",x,x.damage,b.enemyHp,Number(en.hp)||1)};const enAct=async()=>{if(t.ko||b.enemyHp<=0)return;const x=attackValue(en,me);let dmg=x.damage;if(x.hit&&state.run.shield>0)dmg=Math.max(1,Math.round(dmg*(1-state.run.shield)));if(x.hit){t.hp=Math.max(0,t.hp-dmg);battleLine(`${en.name_ja}の${CORE.skillName(en)}！ ${me.name_ja}に${dmg}ダメージ。`);if(t.hp<=0){t.ko=true;battleLine(`${me.name_ja}はひんしになった。`)}}else battleLine(`${en.name_ja}の攻撃は外れた！`);await playDungeonAttack(en,"me",x,dmg,t.hp,maxHpFor(t.id))};if(meFirst){await meAct();if(b.enemyHp>0)await enAct()}else{await enAct();if(!t.ko)await meAct()}b.turn++;b.busy=false;if(b.enemyHp<=0)return enemyDefeated();if(t.ko){handleFaintedReplacement();return}save();render()}
async function autoBattleToEnd(){
 if(autoBattleRunning||!state.run||state.run.scene!=="battle"||!state.run.battle||state.run.battle.busy)return;
 const startEncounter=state.run.encounter,startIndex=startEncounter?.index;

  while(autoBattleRunning&&state.run&&state.run.scene==="battle"&&state.run.battle&&state.run.encounter===startEncounter&&state.run.encounter?.index===startIndex){
   if(state.run.battle.busy){await fxSleep(80);continue}
   await doAttack();
   await fxSleep(180);
  }
 }finally{
  autoBattleRunning=false;
  if(state.run?.scene==="battle"&&state.run?.battle)render();

}
async function switchFighter(newIndex){const b=state.run.battle;if(!b||b.busy||autoBattleRunning)return;const old=runTeam()[b.teamIndex],n=runTeam()[newIndex];if(!n||n.ko||newIndex===b.teamIndex)return;const enc=state.run.encounter,en=currentEnemy(),oldName=rec(old.id)?.name_ja||"仲間";state.run.switchSelecting=false;if(!b.hasAttacked){b.teamIndex=newIndex;const nr=teamRec(n);battleLine(`${oldName}から${nr.name_ja}へ交代（攻撃前なのでターン消費なし）。`);save();render();return}b.busy=true;b.teamIndex=newIndex;enc.currentParticipants=Array.isArray(enc.currentParticipants)?enc.currentParticipants:[];if(!enc.currentParticipants.includes(n.id))enc.currentParticipants.push(n.id);const nr=teamRec(n);battleLine(`${oldName}から${nr.name_ja}へ交代！`);save();render();const atkBtn=document.getElementById("attackBtn"),swBtn=document.getElementById("switchBtn");if(atkBtn)atkBtn.disabled=true;if(swBtn)swBtn.disabled=true;setBattleMessage(`${nr.name_ja}に交代！`);await fxSleep(360);const x=attackValue(en,nr);let dmg=x.damage;if(x.hit&&state.run.shield>0)dmg=Math.max(1,Math.round(dmg*(1-state.run.shield)));const newHp=x.hit?Math.max(0,n.hp-dmg):n.hp;if(x.hit)battleLine(`${en.name_ja}の${CORE.skillName(en)}！ ${nr.name_ja}に${dmg}ダメージ。`);else battleLine(`${en.name_ja}の${CORE.skillName(en)}は外れた！`);await playDungeonAttack(en,"me",x,dmg,newHp,maxHpFor(n.id));n.hp=newHp;if(n.hp<=0){n.ko=true;battleLine(`${nr.name_ja}はひんしになった。`)}b.turn++;b.busy=false;if(n.ko){handleFaintedReplacement();return}save();render()}

function applyBattleVictoryBonus(kind){const bonus=kind==="elite"?4:2;runTeam().forEach(t=>{t.tempAtk=Math.min(TEMP_BOOST_MAX,Number(t.tempAtk||0)+bonus);t.tempDef=Math.min(TEMP_BOOST_MAX,Number(t.tempDef||0)+bonus)});state.run.battleWins=Number(state.run.battleWins||0)+(kind==="elite"?2:1);addLog(`🔥 闘志ボーナス：パーティ全員の攻撃・防御+${bonus}（ダンジョン終了まで）。`)}

async function startCaptureDrama(){const run=state.run,c=run?.capture,o=c?.pendingOutcome;if(!run||run.scene!=="captureThrow"||!c||!o)return;const seq=++captureDramaSeq,ball=document.getElementById("captureThrownBall"),target=document.getElementById("captureTargetSprite"),msg=document.getElementById("captureDramaText"),title=document.getElementById("captureDramaTitle"),dots=document.getElementById("captureDots");if(!ball||!msg)return;const alive=()=>seq===captureDramaSeq&&state.run?.scene==="captureThrow"&&state.run?.capture?.pendingOutcome;if(title)title.textContent=`${BALL_DEF[o.ballKey]?.label||"ボール"}になった！`;msg.textContent="このボールでゲットに挑戦！";await fxSleep(900);if(!alive())return;msg.textContent=`${rec(c.targetId)?.name_ja||"ポケモン"}をゲットできるか…`;ball.classList.add("throw");await fxSleep(720);if(!alive())return;target?.classList.add("captured");ball.classList.add("settled");ball.classList.remove("throw");if(dots)dots.textContent="……";msg.textContent="ボールが閉じた……";await fxSleep(650);for(let i=1;i<=3;i++){if(!alive())return;ball.classList.remove("shake");void ball.offsetWidth;ball.classList.add("shake");if(dots)dots.textContent="・".repeat(i*3);msg.textContent=i===1?"……1回……":i===2?"……2回……":"……3回……";await fxSleep(720)}if(!alive())return;ball.classList.remove("shake");ball.classList.add(o.success?"success":"fail");msg.textContent="…………！";if(dots)dots.textContent="";await fxSleep(o.success?760:620);if(!alive())return;commitCaptureOutcome()}
