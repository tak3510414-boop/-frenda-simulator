 if(/^フレンダ\d+だん$/.test(s))return 100+n;

 if(/^エクストレジャー\d+だん$/.test(s))return 300+n;

}

function sndTone(freq,dur=.08,type="sine",gain=.08,when=0,endFreq=null){
 const ctx=ensureAudio(),vol=soundVolume();if(!ctx||!vol)return;
 const t=ctx.currentTime+Math.max(0,when),o=ctx.createOscillator(),g=ctx.createGain();
 o.type=type;o.frequency.setValueAtTime(Math.max(35,freq),t);
 if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(35,endFreq),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain*vol),t+.008);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)
}
function sndNoise(dur=.05,gain=.035,when=0){
 const ctx=ensureAudio(),vol=soundVolume();if(!ctx||!vol)return;
 const len=Math.max(1,Math.floor(ctx.sampleRate*dur)),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
 const src=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime+Math.max(0,when);
 src.buffer=buf;g.gain.setValueAtTime(Math.max(.0001,gain*vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(g);g.connect(ctx.destination);src.start(t)
}

function weightedEvolutionGrade(pool,currentGrade,allowLower=false){

  const g=Number(r.grade);
  if(g>=2&&g<=5)(by[g]||(by[g]=[])).push(r)
 }

 if(!allowed.length&&allowLower)allowed=grades;

 for(const g of allowed)weights[g]=EVO_GRADE_WEIGHTS[g]||1;

}
function chooseEvolutionPick(sourceId,target,allowLower=false){

       all=(target?.candidates||[]).filter(r=>Number(r.grade)>=2&&Number(r.grade)<=5),
       safe=all.filter(r=>Number(r.grade)>=current);

function autoTeamBaseScore(r){

       atk=(Number(r.atk)||0)+(Number(pb.atk)||0),

 while(selected.length<need&&selected.length<pool.length){
  const role=roles[Math.min(selected.length,roles.length-1)];
  let best=null,bestScore=-Infinity;
  for(const r of pool){
   if(selected.includes(r.master_id))continue;

async function doAttack(){state.run.switchSelecting=false;const b=state.run.battle;if(!b||b.busy)return;const t=runTeam()[b.teamIndex];if(!t||t.ko)return;const enc=state.run.encounter;enc.currentParticipants=Array.isArray(enc.currentParticipants)?enc.currentParticipants:[];if(!enc.currentParticipants.includes(t.id))enc.currentParticipants.push(t.id);b.hasAttacked=true;const me=teamRec(t),en=currentEnemy(),cmp=CORE.compareSpeed(me,en),meFirst=cmp>=0;b.busy=true;const atkBtn=document.getElementById("attackBtn"),swBtn=document.getElementById("switchBtn");if(atkBtn)atkBtn.disabled=true;if(swBtn)swBtn.disabled=true;await showTurnSplash(b.turn,meFirst,me.name_ja,en.name_ja);const meAct=async()=>{if(t.ko||b.enemyHp<=0)return;const x=attackValue(me,en);if(x.hit){b.enemyHp=Math.max(0,b.enemyHp-x.damage);const enc=state.run.encounter;if(!Array.isArray(enc.enemyHps))enc.enemyHps=enc.enemies.map((e,i)=>i===enc.index?b.enemyHp:Number(e.hp));enc.enemyHps[enc.index]=b.enemyHp;battleLine(`${me.name_ja}の${CORE.skillName(me)}！ ${en.name_ja}に${x.damage}ダメージ。`)}else battleLine(`${me.name_ja}の攻撃は外れた！`);await playDungeonAttack(me,"enemy",x,x.damage,b.enemyHp,Number(en.hp)||1)};const enAct=async()=>{if(t.ko||b.enemyHp<=0)return;const x=attackValue(en,me);let dmg=x.damage;if(x.hit&&state.run.shield>0)dmg=Math.max(1,Math.round(dmg*(1-state.run.shield)));if(x.hit){const endured=tryBondEndure(t,dmg);if(!endured)t.hp=Math.max(0,t.hp-dmg);battleLine(`${en.name_ja}の${CORE.skillName(en)}！ ${me.name_ja}に${dmg}ダメージ。`);if(t.hp<=0){t.ko=true;battleLine(`${me.name_ja}はひんしになった。`)}await playDungeonAttack(en,"me",x,dmg,t.hp,maxHpFor(t.id));if(endured){setBattleMessage(`${me.name_ja}はキミとの絆でこらえた！`);await showImpactText("きずな！","bond")}}else{battleLine(`${en.name_ja}の攻撃は外れた！`);await playDungeonAttack(en,"me",x,dmg,t.hp,maxHpFor(t.id))}};if(meFirst){await meAct();if(b.enemyHp>0)await enAct()}else{await enAct();if(!t.ko)await meAct()}b.turn++;b.busy=false;if(b.enemyHp<=0)return enemyDefeated();if(t.ko){handleF
