 {key:"kanto",label:"カントー",names:["フシギダネ","ヒトカゲ","ゼニガメ"]},

 {key:"hoenn",label:"ホウエン",names:["キモリ","アチャモ","ミズゴロウ"]},
 {key:"sinnoh",label:"シンオウ",names:["ナエトル","ヒコザル","ポッチャマ"]},
 {key:"unova",label:"イッシュ",names:["ツタージャ","ポカブ","ミジュマル"]},
 {key:"kalos",label:"カロス",names:["ハリマロン","フォッコ","ケロマツ"]},
 {key:"alola",label:"アローラ",names:["モクロー","ニャビー","アシマリ"]},
 {key:"galar",label:"ガラル",names:["サルノリ","ヒバニー","メッソン"]},
 {key:"paldea",label:"パルデア",names:["ニャオハ","ホゲータ","クワッス"]}
];
const stateDefault=()=>({saveVersion:4,appVersion:APP_VERSION,initialized:false,starterSetOptions:null,starterSetKey:null,starterIds:[],starterOptions:null,starterId:null,owned:[],dex:{},trainingPoints:{},experience:{},drillPoints:{},permanentBoosts:{},eggs:[],eggCap:3,unlocks:{forest:[1]},stats:{},run:null,postRun:null,lastSummary:null});

let message="";

function loadState(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return x&&typeof x==="object"?Object.assign(stateDefault(),x):stateDefault()}catch{return stateDefault()}}
function migrateState(){
 const v=Number(state.saveVersion||1);
 if(v<2)state=stateDefault();
 if(!Array.isArray(state.owned))state.owned=[];
 if(!state.dex||typeof state.dex!=="object")state.dex={};
 if(!state.experience||typeof state.experience!=="object")state.experience={};
 if(!state.drillPoints||typeof state.drillPoints!=="object")state.drillPoints={};
 if(!state.trainingPoints||typeof state.trainingPoints!=="object")state.trainingPoints={};
 if(!state.permanentBoosts||typeof state.permanentBoosts!=="object")state.permanentBoosts={};
 if(!Array.isArray(state.eggs))state.eggs=[];
 if(!state.unlocks||typeof state.unlocks!=="object")state.unlocks={forest:[1]};
 if(!state.unlocks.forest)state.unlocks.forest=[1];
 if(!state.stats||typeof state.stats!=="object")state.stats={};
 if(state.postRun&&typeof state.postRun!=="object")state.postRun=null;
 if(state.run){
   state.run.xpGained=state.run.xpGained||{};state.run.drillGained=state.run.drillGained||{};state.run.captured=state.run.captured||[];
   if(state.run.encounter){
     state.run.encounter.currentParticipants=Array.isArray(state.run.encounter.currentParticipants)?state.run.encounter.currentParticipants:[];
     if(state.run.battle){const t=state.run.team?.[state.run.battle.teamIndex];if(t&&!state.run.encounter.currentParticipants.includes(t.id))state.run.encounter.currentParticipants.push(t.id)}
   }
 }
 rebuildProgressionFromStats();
 state.saveVersion=4;
 save();
}
function resetSave(){if(!confirm("フレンダダンジョンのセーブデータを初期化しますか？"))return;if(!confirm("御三家選択を含む全進行状況が消えます。本当に初期化しますか？"))return;localStorage.removeItem(SAVE_KEY);state=stateDefault();screen="home";render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rec(id){return RECORDS.find(r=>r.master_id===id)||null}
function clone(o){return JSON.parse(JSON.stringify(o))}
function validBattle(r){return r&&Number(r.hp)>0&&Number(r.atk)>0&&Number(r.def)>0&&Number(r.sp_atk)>0&&Number(r.sp_def)>0&&r.move_type}
function imageOf(r){return r?.official_image||""}
function gradeText(r){return r?.grade?"★"+r.grade:"★-"}
function maxHpFor(id){const r=rec(id);const b=state.permanentBoosts?.[id]?.hp||0;return Math.max(1,Math.round(Number(r?.hp||1)+b))}
function ownedEntry(id){return state.owned.find(x=>x.id===id)||null}
function xpFor(id){return Number(state.experience?.[id]||0)}
function drillFor(id){return Number(state.drillPoints?.[id]||0)}
function growthKeyFor(id){const r=rec(id);return r?.evolution_family||r?.evo_family||r?.family_id||r?.name_ja||id}
function growthPointsFor(id){return Number(state.trainingPoints?.[growthKeyFor(id)]||0)}
function addGrowthPoint(id,n=1){const k=growthKeyFor(id);state.trainingPoints[k]=Number(state.trainingPoints[k]||0)+n}
function addBattleXp(ids,amount,label="戦闘"){const uniq=[...new Set((ids||[]).filter(Boolean))];if(!uniq.length||amount<=0)return;for(const id of uniq){let xp=xpFor(id)+amount;let gained=0;while(xp>=EXP_TO_DRILL){xp-=EXP_TO_DRILL;gained++}state.experience[id]=xp;if(gained){state.drillPoints[id]=drillFor(id)+gained}if(state.run){state.run.xpGained=state.run.xpGained||{};state.run.xpGained[id]=Number(state.run.xpGained[id]||0)+amount;if(gained){state.run.drillGained=state.run.drillGained||{};state.run.drillGained[id]=Number(state.run.drillGained[id]||0)+gained}}const nm=rec(id)?.name_ja||"仲間";addLog(`${nm}が${label}でEXP ${amount}を獲得${gained?`、特訓ポイント+${gained}`:""}。`)}save()}
function spendDrill(id,stat){if(!ownedEntry(id)||drillFor(id)<=0)return;const pb=state.permanentBoosts[id]||(state.permanentBoosts[id]={hp:0,atk:0,def:0});if(!["hp","atk","def"].includes(stat)||Number(pb[stat]||0)>=20)return;pb[stat]=Number(pb[stat]||0)+1;state.drillPoints[id]=drillFor(id)-1;save();render()}
function statKey(did,diff){return `${did}:${diff}`}
function getStat(did,diff){const k=statKey(did,diff);if(!state.stats[k])state.stats[k]={deepest:0,clears:0};return state.stats[k]}
function updateDeepest(f){if(!state.run)return;const s=getStat(state.run.dungeonId,state.run.difficulty);s.deepest=Math.max(s.deepest,Math.min(10,f));save()}
function addUnlock(did,diff){if(!THEMES[did]||diff<1||diff>5)return false;const a=state.unlocks[did]||(state.unlocks[did]=[]);if(a.includes(diff))return false;a.push(diff);a.sort((x,y)=>x-y);return true}
function rebuildProgressionFromStats(){addUnlock("forest",1);for(let ti=0;ti<THEME_ORDER.length;ti++){const did=THEME_ORDER[ti];for(let d=1;d<=5;d++){const st=state.stats?.[statKey(did,d)];if(Number(st?.clears||0)>0){addUnlock(did,d);if(d<5)addUnlock(did,d+1);if(d===1&&ti+1<THEME_ORDER.length)addUnlock(THEME_ORDER[ti+1],1)}}}const clearedTheme1=THEME_ORDER.filter(id=>Number(state.stats?.[statKey(id,1)]?.clears||0)>0).length;state.eggCap=Math.max(Number(state.eggCap)||3,Math.min(10,3+clearedTheme1))}
function applyClearProgression(did,diff,firstClear){const unlockedNow=[];if(diff<5&&addUnlock(did,diff+1))unlockedNow.push(`${THEMES[did].name} ★${diff+1}`);if(diff===1&&firstClear){const ti=THEME_ORDER.indexOf(did);if(ti>=0&&ti+1<THEME_ORDER.length){const nx=THEME_ORDER[ti+1];if(addUnlock(nx,1))unlockedNow.push(`${THEMES[nx].name} ★1`)}const before=state.eggCap||3;state.eggCap=Math.min(10,before+1);if(state.eggCap>before)unlockedNow.push(`卵所持上限 ${before}→${state.eggCap}`)}return unlockedNow}
function eggId(){return `egg-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`}
function eggLabel(e){const d=EGG_DEF[e?.kind]||EGG_DEF.normal;return e?.kind==="type"&&e?.type?`${e.type}タイプの卵`:d.label}
function eggReq(e){return Number(e?.required||EGG_DEF[e?.kind]?.required||5)}
function eggReady(e){return Number(e?.points||0)>=eggReq(e)}
function chooseThemeEggType(did){const th=THEMES[did]||THEMES.forest,valid=RECORDS.filter(validBattle),counts={};for(const t of th.types)counts[t]=valid.reduce((n,r)=>n+((r.type1===t||r.type2===t)?((th.types.every(x=>r.type1===x||r.type2===x))?.5:1):0),0);return chooseWeighted(counts)}
function makeEgg(kind,did,diff){const d=EGG_DEF[kind]||EGG_DEF.normal;return {id:eggId(),kind:d===EGG_DEF.normal&&kind!=="normal"?"normal":kind,type:kind==="type"?chooseThemeEggType(did):null,points:0,required:d.required,sourceDungeon:did,sourceDifficulty:diff,createdAt:new Date().toISOString()}}
function advanceEggs(n=1){if(!Array.isArray(state.eggs)||!state.eggs.length)return;for(const e of state.eggs)e.points=Math.min(eggReq(e),Number(e.points||0)+n);addLog(`所持している卵すべての孵化ポイント +${n}。`)}
function chooseHatchRecord(egg){const rates=EGG_HATCH_GRADE[egg.kind]||EGG_HATCH_GRADE.normal;let g=Number(chooseWeighted(rates));let pool=RECORDS.filter(validBattle);if(egg.kind==="type"&&egg.type)pool=pool.filter(r=>r.type1===egg.type||r.type2===egg.type);let gp=pool.filter(r=>Number(r.grade)===g);if(!gp.length){const grades=[...new Set(pool.map(r=>Number(r.grade)).filter(Boolean))].sort((a,b)=>Math.abs(a-g)-Math.abs(b-g));gp=pool.filter(r=>Number(r.grade)===grades[0])}return gp[Math.floor(Math.random()*gp.length)]||pool[Math.floor(Math.random()*pool.length)]||null}
function resolveReadyEggs(){const ready=(state.eggs||[]).filter(eggReady),keep=(state.eggs||[]).filter(e=>!eggReady(e));state.eggs=keep;const results=[];for(const e of ready){const r=chooseHatchRecord(e);if(!r)continue;const duplicate=!!ownedEntry(r.master_id);if(duplicate)addGrowthPoint(r.master_id,1);else ownNew(r.master_id);results.push({egg:e,pickId:r.master_id,duplicate})}return results}
function eggSlotsFor(diff,did){const rates=EGG_SLOT_RATES[diff]||EGG_SLOT_RATES[1];return Array.from({length:8},()=>{const kind=chooseWeighted(rates);return {kind,type:kind==="type"?chooseThemeEggType(did):null}})}
function pct(n,d){return d?Math.max(0,Math.min(100,Math.round(n/d*100))):0}
function hpClass(p){return p<=25?" low":p<=50?" mid":""}

async function startCaptureDrama(){const run=state.run,c=run?.capture,o=c?.pendingOutcome;if(!run||run.scene!=="captureThrow"||!c||!o)return;const seq=++captureDramaSeq,ball=document.getElementById("captureThrownBall"),target=document.getElementById("captureTargetSprite"),msg=document.getElementById("captureDramaText"),title=document.getElementById("captureDramaTitle"),dots=document.getElementById("captureDots");if(!ball||!msg)return;const alive=()=>seq===captureDramaSeq&&state.run?.scene==="captureThrow"&&state.run?.capture?.pendingOutcome;if(title)title.textContent=`${BALL_DEF[o.ballKey]?.label||"ボール"}になった！`;msg.textContent="このボールでゲットに挑戦！";await fxSleep(900);if(!alive())return;msg.textContent=`${rec(c.targetId)?.name_ja||"ポケモン"}をゲットできるか…`;ball.classList.add("throw");await fxSleep(720);if(!alive())return;target?.classList.add("captured");ball.classList.add("settled");ball.classList.remove("throw");if(dots)dots.textContent="……";msg.textContent="ボールが閉じた……";await fxSleep(650);for(let i=1;i<=3;i++){if(!alive())return;ball.classList.remove("shake");void ball.offsetWidth;ball.classList.add("shake");if(dots)dots.textContent="・".repeat(i*3);msg.textContent=i===1?"……1回……":i===2?"……2回……":"……3回……";await fxSleep(720)}if(!alive())return;ball.classList.remove("shake");ball.classList.add(o.success?"success":"fail");msg.textContent="…………！";if(dots)dots.textContent="";await fxSleep(o.success?760:620);if(!alive())return;commitCaptureOutcome()}

 app.querySelectorAll("[data-event-target]").forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.eventTarget);if(state.run.event?.kind==="healSingleSelect")healChoice("single",idx);else applyEventTarget(idx)});

let ballTimer=null,ballCursor=0;

function startBallSlotAnimation(stopBtn){stopBallTimer();ballCursor=0;const cells=[...app.querySelectorAll("[data-ball-cell]")];const paint=()=>cells.forEach((c,i)=>c.classList.toggle("active",i===ballCursor));paint();ballTimer=setInterval(()=>{ballCursor=(ballCursor+1)%cells.length;paint()},65);stopBtn.onclick=()=>{if(!ballTimer)return;stopBallTimer();const slipRoll=Math.random(),slip=slipRoll<.15?0:slipRoll<.60?1:2;const final=(ballCursor+slip)%cells.length;cells.forEach((c,i)=>c.classList.toggle("active",i===final));stopBtn.disabled=true;const ballKey=state.run.capture.balls[final];setTimeout(()=>resolveCapture(ballKey),450)}}
function renderEggs(){app.innerHTML=`<div class="card"><div class="row spread"><div class="sectionTitle">🥚 卵</div><span class="badge purple">${state.eggs.length}/${state.eggCap}</span></div><div class="notice" style="margin-bottom:10px">ダンジョンで階を1つ進むたび、所持中のすべての卵に孵化ポイント+1。必要ポイントに達してもダンジョン中は孵化せず、クリア・全滅・撤退時に孵化します。</div>${state.eggs.length?`<div class="eggGrid">${state.eggs.map(e=>{const req=eggReq(e),p=Math.min(100,Math.round((e.points||0)/req*100));return `<div class="eggCard"><div class="eggIcon">${EGG_DEF[e.kind]?.icon||"🥚"}</div><b>${esc(eggLabel(e))}</b><small>${e.kind==="type"?"タイプのみ判明":"中身は孵化まで不明"}</small><div class="eggProgress"><div style="width:${p}%"></div></div><small>${e.points}/${req}pt　${eggReady(e)?"孵化待ち":`あと${Math.max(0,req-e.points)}階`}</small></div>`}).join("")}</div>`:`<div class="summary"><div class="resultIcon">🥚</div><p>まだ卵を持っていません。<br>ダンジョンのボスを倒すと、卵ルーレットで1個獲得できます。</p></div>`}</div>`}
function renderOwned(){app.innerHTML=`<div class="card"><div class="sectionTitle">ダンジョン所持ピック</div><div class="muted" style="margin-bottom:10px">シミュレーター側の実物所持とは別管理です。EXPと特訓ポイントは全滅・撤退しても残ります。</div><div class="ownedGrid">${state.owned.map(o=>{const r=rec(o.id),pb=state.permanentBoosts[o.id]||{},xp=xpFor(o.id),dp=drillFor(o.id);return `<div class="pickCard"><img src="${esc(imageOf(r))}" alt=""><b>${esc(r.name_ja)}</b><small>${gradeText(r)} / ${esc(r.pick_no)}</small><div>${typesHTML(r)}</div><div class="expbar"><div class="expfill" style="width:${xp}%"></div></div><small>EXP ${xp}/100 / 特訓P ${dp}</small><small>恒久強化 HP+${pb.hp||0} / 攻+${pb.atk||0} / 防+${pb.def||0}</small></div>`}).join("")}</div></div>`}
function renderTraining(){app.innerHTML=`<div class="card"><div class="sectionTitle">✨ 特訓</div><div class="notice" style="margin-bottom:10px">戦闘でEXPを獲得し、100EXPごとに特訓ポイント+1。特訓ポイント1でHP・攻撃・防御のどれかを恒久+1できます。各能力は最大+20です。</div><div class="ownedGrid">${state.owned.map(o=>{const r=rec(o.id),pb=state.permanentBoosts[o.id]||(state.permanentBoosts[o.id]={hp:0,atk:0,def:0}),xp=xpFor(o.id),dp=drillFor(o.id);return `<div class="pickCard"><img src="${esc(imageOf(r))}" alt=""><b>${esc(r.name_ja)}</b><small>${gradeText(r)} / ${esc(r.pick_no)}</small><div class="expbar"><div class="expfill" style="width:${xp}%"></div></div><small>EXP ${xp}/100　特訓P ${dp}</small><small>HP+${pb.hp||0} / 攻+${pb.atk||0} / 防+${pb.def||0}</small><div class="trainBtns"><button data-train-id="${esc(o.id)}" data-stat="hp" ${dp<=0||Number(pb.hp||0)>=20?"disabled":""}>HP+1</button><button data-train-id="${esc(o.id)}" data-stat="atk" ${dp<=0||Number(pb.atk||0)>=20?"disabled":""}>攻撃+1</button><button data-train-id="${esc(o.id)}" data-stat="def" ${dp<=0||Number(pb.def||0)>=20?"disabled":""}>防御+1</button></div></div>`}).join("")}</div></div>`;app.querySelectorAll("[data-train-id]").forEach(b=>b.onclick=()=>spendDrill(b.dataset.trainId,b.dataset.stat))}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=`frenda-dungeon-save-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importSave(file){const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||typeof x!=="object")throw new Error("形式不正");state=Object.assign(stateDefault(),x);save();alert("セーブデータを読み込みました。");screen="home";render()}catch(e){alert("読み込みに失敗しました。\n"+e.message)}};rd.readAsText(file)}
function renderSaveMenu(){app.innerHTML=`<div class="card"><div class="sectionTitle">セーブ管理</div><div class="row"><button id="exportBtn">セーブを書き出す</button><button class="secondary" id="importBtn">セーブを読み込む</button><button class="danger" id="resetBtn">初期化</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><div class="notice" style="margin-top:12px">通常は自動保存されます。書き出しファイルは端末移行・バックアップ用です。</div></div>`;document.getElementById("exportBtn").onclick=exportSave;document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importSave(e.target.files[0])};document.getElementById("resetBtn").onclick=resetSave}

homeBtn.onclick=()=>{if(state.postRun){renderPostRun();return}if(state.run){screen="home";renderRun()}else{screen="home";render()}};
withdrawBtn.onclick=withdraw;
render();
})();
</script>
