/* Ver0.35: clearer route roles */
/* Ver0.36: egg hatch requirements, dynamic home version, bonus result confirmation */
/* Ver0.37: auto update reload, stronger event results, victory splash */
.routeBtn.event .routeIcon:after{content:"BONUS";display:block;font-size:7px;letter-spacing:.12em;color:#ffe58a;margin-top:2px}
.routeBtn.unknown .routeIcon:after{content:"!?";display:block;font-size:9px;color:#fff;margin-top:1px}

/* Ver0.37: update check, stronger bonus feedback, battle victory splash */
/* Ver0.38: victory button tap/click fix; decorative stars ignore pointer events */
/* Ver0.39: make event target-selection prompt much more prominent */
/* Ver0.40: boss grade table, conspicuous MISS, hatch replay-loop guard */
/* Ver0.41: after hatch reveal, tapping the hatch screen also advances */
/* Ver0.42: training list shows actionable picks only; Home forces update check */
/* Ver0.43: larger, more readable battle damage numbers */
/* Ver0.44: lucky-rest full-HP softlock prevention and recovery */
/* Ver0.45: legendary Pokémon are limited to ★5 dungeons; non-★5 eggs cannot hatch legendary Pokémon */
/* Ver0.46: enemy and egg lotteries are species-first, then pick; duplicate pick counts no longer raise species odds */
/* Ver0.47: evolution cost lowered to 2 points for first evolution and 3 points thereafter */
/* Ver0.48: evolution premonition cues and staged full-screen evolution animation */
/* Ver0.49: ★5 legendary encounters get a dedicated omen/silhouette/reveal intro and battle LEGENDARY badge */
/* Ver0.50: normal, elite, and boss encounters get short themed cut-ins; legendary intro still takes priority */
/* Ver0.51: evolution-family bond levels, run-end bond growth, mild heal/endure/start-buff effects, and bond UI */
/* Ver0.52: 12% floor-transition pickup events with auto-use berry, ball boost, growth candy, charm, and revive shard */
/* Ver0.53: dungeon-specific ambient effects and themed run/battle backgrounds for all 10 dungeons */
/* Ver0.54: species-level seen tracking, NEW first-encounter cues, faint seen/unowned dex art, and first-registration notices */
/* Ver0.55: boss victory now flows through egg discovery, roulette, and rarity-specific egg reward presentation before pending hatches */
/* Ver0.56: lightweight Web Audio sound effects with persisted 100%/50%/OFF home setting for battle, capture, legendary, and evolution scenes */
/* Ver0.57: previous-team recall plus auto team selection using matchup, grade, stats, training, bond, and role diversity */
/* Ver0.58: evolution preserves source rarity when possible; if no equal-or-higher registered pick exists, explicit confirmation allows lower rarity */
/* Ver0.59: dungeon entry gets a dedicated themed one-step intro before B1 route selection, with first-visit flavor text */
/* Ver0.60: battle layout refactor — expanded always-visible 3-member status cards and higher/larger player-vs-enemy display */
/* Ver0.61: dex series filter, large/medium/small dex+owned views, sticky just-trained cards, and one-screen enlarged home dashboard */
/* Ver0.62: fix Pokédex visibility to track encounters/ownership per exact pick instead of sharing visibility across same-species picks */
/* Ver0.63: slower readable presentation pacing, tappable message artwork, larger home text, clear fanfare, and chronological series filter order */
/* Ver0.64: simplify owned-pick front cards by grouping growth/drill resources, separating EXP, compacting permanent boosts, and reducing evolution text duplication */
/* Ver0.65: owned-pick back side now includes front-side growth information and tappable help popups for growth, drill, EXP, bond, and permanent boosts */
/* Ver0.66: growth points are evolution-only; non-evolving reward events convert to drill points; drill+EXP are grouped; startup uses the generated jacket splash */
/* Ver0.67: unified pick filters across Pokédex, owned picks, and party selection (search / series / type / grade / status / sort). */
/* Ver0.68: remove the duplicated “<dungeon name>へ！” line from every dungeon-entry screen. */
/* Ver0.69: floor-road cells keep the icon of the route selected on each cleared/current floor. */
/* Ver0.70: fighter-selection cards now give playful matchup appeals based on current enemy type effectiveness. */
/* Ver0.71: punchier attack impact SFX — short swish followed by a sharp crack and low thump on hit. */
/* Ver0.72: adventure log is collapsed by default and can be expanded/collapsed by tapping its header. */
/* Ver0.73: returning home after a completed run forces an update check and immediately loads a newer dungeon version when available. */
/* Ver0.74: after an enemy is fully revealed, tapping anywhere in the run area advances exactly like "戦闘準備へ". */

 .ownedBackFrontSummary{gap:4px;margin-left:9px;margin-right:9px}.ownedBackPoint{gap:3px;padding:7px 5px}.ownedBackPoint>span{font-size:17px}.ownedBackPoint small{font-size:6.5px}.ownedBackPoint b{font-size:14px}.ownedBackPoint i{width:17px;height:17px;font-size:8px}
 .ownedBackExpGauge,.ownedBackBoostSummary,.ownedBackEvoState,.ownedBackPointHint{margin-left:9px;margin-right:9px}.ownedBackBoostSummary{width:calc(100% - 18px)}
 .ownedPointHelpPanel{padding:18px 15px 14px}.ownedPointHelpPanel h3{font-size:20px}.ownedPointHelpPanel p{font-size:12px}
}


/* Ver0.66: evolution-only growth points, drill+EXP grouping, startup jacket splash */
.ownedEvolutionPoint{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;padding:7px 8px;border-radius:10px;background:#f7f1ff;border:1px solid #dfd0f3}
.ownedEvolutionPoint>span{font-size:18px}.ownedEvolutionPoint>div{display:flex;justify-content:space-between;align-items:baseline;gap:7px}.ownedEvolutionPoint small{font-size:8px;font-weight:950;color:#7353a1}.ownedEvolutionPoint b{margin:0!important;font-size:17px!important;color:#65409b}
.ownedTrainingProgress{padding:7px 8px;border-radius:11px;background:#eef8fc;border:1px solid #cde8f3}
.ownedTrainingTop{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center}.ownedTrainingTop>span{font-size:18px}.ownedTrainingTop>div{display:flex;justify-content:space-between;align-items:baseline;gap:7px}.ownedTrainingTop small{font-size:8px;font-weight:950;color:#39758b}.ownedTrainingTop b{margin:0!important;font-size:17px!important;color:#176c8a}
.ownedTrainingExp{margin-top:5px;padding-top:5px;border-top:1px solid #c9e3ed}.ownedTrainingExp .expbar{height:7px;margin:4px 0 2px}.ownedTrainingExp>small{display:block;text-align:right;font-size:7px;color:#5c7b88}
.ownedNoEvolutionNote{padding:5px 7px;border-radius:8px;background:#f1f4f5;border:1px solid #dce3e6;color:#64757e;font-size:7.5px;font-weight:850;text-align:center}

.ownedBackFrontSummary.twoRole{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);align-items:stretch}
.ownedBackFrontSummary.twoRole>.ownedBackTrainingProgress:only-child{grid-column:1/-1}
.ownedBackTrainingProgress{border-radius:12px;border:1px solid #70c7e15e;background:#174f6655;overflow:hidden}
.ownedBackTrainingHead,.ownedBackTrainingExp{width:100%;box-shadow:none;background:transparent;color:#eefcff;border:0;text-align:left}
.ownedBackTrainingHead{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:8px}
.ownedBackTrainingHead>span{font-size:20px}.ownedBackTrainingHead small{display:block;color:#b7d0dc;font-size:8px;font-weight:900}.ownedBackTrainingHead b{font-size:18px}.ownedBackTrainingHead i,.ownedBackTrainingExp i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffffff1c;border:1px solid #ffffff35;color:#c7f2ff;font-size:10px;font-style:normal;font-weight:1000}
.ownedBackTrainingExp{padding:7px 8px;border-top:1px solid #ffffff20}.ownedBackTrainingExp .ownedExpHead{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}.ownedBackTrainingExp .ownedExpHead span{text-align:right}.ownedBackTrainingExp .expbar{height:7px;margin:5px 0 2px}.ownedBackTrainingExp>small{display:block;text-align:right;color:#a8c9d6;font-size:8px}

.trainStatRow.drillOnly{grid-template-columns:72px 1fr}.trainStatRow.drillOnly button{font-size:9px}
.trainingCombinedMini{margin-top:5px;padding:6px 7px;border-radius:9px;background:#edf8fc;border:1px solid #cce7f1}.trainingCombinedMini>div:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:7px}.trainingCombinedMini b{font-size:10px}.trainingCombinedMini small{font-size:8px}.trainingCombinedMini .expbar{height:6px;margin-top:4px}
.noEvolutionTrainingNote{margin-top:7px;padding:6px 7px;border-radius:8px;background:#f1f4f5;color:#64757e;font-size:8px;font-weight:850;text-align:center}

.startupSplash{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;background:#05090d;opacity:1;transition:opacity .26s ease}
.startupSplash.closing{opacity:0;pointer-events:none}
.startupSplashBg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(24px) brightness(.33) saturate(1.2);transform:scale(1.08)}
.startupSplash:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#0000 10%,#0008 82%,#000d 100%);pointer-events:none}
.startupSplashStage{position:relative;z-index:2;width:min(92vw,520px);max-height:96dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;outline:none;touch-action:manipulation}
.startupSplashCover{display:block;width:auto;max-width:100%;height:auto;max-height:88dvh;aspect-ratio:3/4;object-fit:contain;border-radius:14px;box-shadow:0 18px 65px #000b,0 0 0 1px #ffffff20}
.startupSplashTap{margin-top:10px;color:#fff;text-align:center;font-size:11px;font-weight:1000;letter-spacing:.18em;text-shadow:0 2px 12px #000;animation:splashTapPulse 1.2s ease-in-out infinite}
.startupSplashTap span{font-size:13px;letter-spacing:.05em}
.startupSplashStage:focus-visible .startupSplashCover{outline:3px solid #6ce5ff;outline-offset:4px}
@keyframes splashTapPulse{0%,100%{opacity:.58;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@media(max-width:600px){
 .ownedBackFrontSummary.twoRole{grid-template-columns:1fr;gap:6px}
 .ownedEvolutionPoint{padding:5px 6px}.ownedEvolutionPoint>span,.ownedTrainingTop>span{font-size:15px}.ownedEvolutionPoint b,.ownedTrainingTop b{font-size:14px!important}
 .startupSplashStage{width:min(94vw,470px)}.startupSplashCover{max-height:86dvh;border-radius:10px}.startupSplashTap{margin-top:8px}
}


/* Ver0.67: unified pick filter UI */
.commonPickFilter{margin:9px 0 11px;padding:9px;border:1px solid #d4e0e6;border-radius:13px;background:#f7fafb}
.commonPickFilterGrid{display:grid;grid-template-columns:minmax(190px,1.45fr) repeat(2,minmax(125px,1fr));gap:7px}
.commonPickFilter label{display:grid;gap:3px;min-width:0}
.commonPickFilter label>span{font-size:9px;font-weight:950;color:#536773;letter-spacing:.02em}
.commonPickFilter input,.commonPickFilter select{width:100%;min-width:0;padding:9px 8px;border:1px solid #bdcbd4;border-radius:10px;background:#fff;color:#233947}
.commonPickFilterFoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.commonPickFilterCount{font-size:10px;font-weight:900;color:#637681}
.commonPickFilterReset{padding:7px 10px;background:#e7eef2;color:#334b59;font-size:10px}
.teamQuickActions.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:700px){
 .commonPickFilter{padding:7px}
 .commonPickFilterGrid{grid-template-columns:1fr 1fr;gap:5px}
 .commonPickFilter label.search{grid-column:1/-1}
 .commonPickFilter label>span{font-size:8px}
 .commonPickFilter input,.commonPickFilter select{padding:8px 6px;font-size:10px}
 .commonPickFilterCount,.commonPickFilterReset{font-size:9px}
 .teamQuickActions.two{grid-template-columns:1fr 1fr}
}

</style>

function seriesReleaseRank(name){
 const s=String(name||"").trim(),m=s.match(/(\d+)\s*だん/),n=m?Number(m[1]):99;
 if(/^フレンダ\d+だん$/.test(s))return 100+n;
 if(/^ベストタッグ\d+だん$/.test(s))return 200+n;
 if(/^エクストレジャー\d+だん$/.test(s))return 300+n;
 if(/スペシャル|ワンダー|イベント|プロモ/.test(s))return 9000;
 return 8000
}
function compareSeriesRelease(a,b){
 const ra=seriesReleaseRank(a),rb=seriesReleaseRank(b);
 return ra-rb||String(a||"").localeCompare(String(b||""),"ja",{numeric:true})
}
const SOUND_KEY="frenda:dungeon:sound:v1";
let audioCtx=null;
function soundMode(){const v=localStorage.getItem(SOUND_KEY);return ["100","50","off"].includes(v)?v:"100"}
function soundVolume(){const m=soundMode();return m==="100"?1:m==="50"?.5:0}
function soundModeLabel(){const m=soundMode();return m==="100"?"🔊 100%":m==="50"?"🔉 50%":"🔇 OFF"}
function ensureAudio(){
 if(soundVolume()<=0)return null;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  return audioCtx
 }catch{return null}
}
function sndTone(freq,dur=.08,type="sine",gain=.08,when=0,endFreq=null){
 const ctx=ensureAudio(),vol=soundVolume();if(!ctx||!vol)return;
 const t=ctx.currentTime+Math.max(0,when),o=ctx.createOscillator(),g=ctx.createGain();
 o.type=type;o.frequency.setValueAtTime(Math.max(35,freq),t);
 if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(35,endFreq),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain*vol),t+.008);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)
}
function sndNoise(dur=.05,gain=.035,when=0){
 const ctx=ensureAudio(),vol=soundVolume();if(!ctx||!vol)return;
 const len=Math.max(1,Math.floor(ctx.sampleRate*dur)),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
 const src=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime+Math.max(0,when);
 src.buffer=buf;g.gain.setValueAtTime(Math.max(.0001,gain*vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(g);g.connect(ctx.destination);src.start(t)
}
function sndCrack(gain=.10,when=0){
 const ctx=ensureAudio(),vol=soundVolume();if(!ctx||!vol)return;
 const dur=.055,t=ctx.currentTime+Math.max(0,when),len=Math.max(1,Math.floor(ctx.sampleRate*dur));
 const buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<len;i++){const p=1-i/len;data[i]=(Math.random()*2-1)*p*p}
 const src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),peak=ctx.createBiquadFilter(),g=ctx.createGain();
 src.buffer=buf;hp.type='highpass';hp.frequency.setValueAtTime(700,t);hp.Q.setValueAtTime(.7,t);
 peak.type='peaking';peak.frequency.setValueAtTime(1900,t);peak.Q.setValueAtTime(1.1,t);peak.gain.setValueAtTime(7,t);
 g.gain.setValueAtTime(Math.max(.0001,gain*vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(hp);hp.connect(peak);peak.connect(g);g.connect(ctx.destination);src.start(t);
 sndTone(185,.065,'square',gain*.48,when,82);
 sndTone(1550,.035,'triangle',gain*.24,when,720)
}
function sfx(name){
 if(soundVolume()<=0)return;
 ensureAudio();
 switch(name){
  case "battleStart":
   sndTone(392,.09,"triangle",.055,0);sndTone(523,.10,"triangle",.06,.09);sndTone(659,.14,"triangle",.07,.19);break;
  case "attack":
   sndNoise(.032,.030,0);sndTone(980,.085,"sawtooth",.035,0,300);break;
  case "hit":
   sndCrack(.115,0);break;
  case "super":
   sndCrack(.145,0);sndTone(245,.10,"square",.072,.012,92);sndTone(880,.075,"triangle",.046,.018,1320);break;
  case "miss":
   sndTone(520,.16,"sine",.04,0,150);break;
  case "special":
   sndTone(220,.10,"sawtooth",.05,0,340);sndTone(340,.11,"sawtooth",.055,.09,520);sndTone(520,.15,"sawtooth",.06,.18,820);sndNoise(.045,.024,.18);break;
  case "ko":
   sndTone(310,.35,"triangle",.06,0,85);break;
  case "victory":
   sndTone(523,.12,"triangle",.06,0);sndTone(659,.12,"triangle",.065,.12);sndTone(784,.13,"triangle",.07,.24);sndTone(1047,.24,"triangle",.075,.37);break;
  case "clear":
   sndTone(392,.16,"triangle",.055,0);sndTone(523,.16,"triangle",.06,.12);sndTone(659,.18,"triangle",.065,.24);sndTone(784,.20,"triangle",.07,.38);sndTone(1047,.26,"sine",.075,.55);sndTone(1319,.34,"sine",.06,.72);sndNoise(.16,.018,.58);break;
  case "captureThrow":
   sndTone(280,.20,"sine",.04,0,980);break;
  case "captureShake":
   sndTone(165,.07,"triangle",.035,0,130);break;
  case "captureSuccess":
   sndTone(659,.11,"triangle",.055,0);sndTone(880,.12,"triangle",.065,.11);sndTone(1047,.22,"triangle",.075,.23);break;
  case "captureFail":
   sndTone(350,.14,"triangle",.05,0,230);sndTone(220,.22,"triangle",.045,.12,120);break;
  case "legendaryWarn":
   sndTone(82,.55,"sine",.055,0,58);break;
  case "legendarySpark":
   sndTone(880,.10,"sine",.045,0);sndTone(1320,.16,"sine",.04,.08);break;
  case "evoRise":
   sndTone(220,.34,"sine",.045,0,660);sndTone(330,.36,"triangle",.035,.08,990);break;
  case "evoSuccess":
   sndTone(523,.13,"triangle",.055,0);sndTone(784,.13,"triangle",.065,.12);sndTone(1047,.28,"sine",.075,.25);break;
 }
}

function teamRecommendationInfo(r){
 const th=THEMES[currentDungeon.id];
 const move=String(r?.move_type||"").trim();
 if(!th||!move||!CORE?.rawEff)return {recommended:false,score:0,reason:""};
 const vals=th.types.map(t=>Number(CORE.rawEff(move,{type1:t,type2:null}))||1);
 const good=vals.map((v,i)=>({v,t:th.types[i]})).filter(x=>x.v>1);
 const best=Math.max(...vals,1),score=good.length*100+best*10+(Number(r?.poke_ene)||0)/1000;
 return {recommended:good.length>0,score,reason:good.length===th.types.length?`${th.types.join("・")}に有利`:`${good.map(x=>x.t).join("・")}に有利`};
}

function autoTeamBaseScore(r){
 const pb=state.permanentBoosts[r.master_id]||{},ri=teamRecommendationInfo(r),
       hp=(Number(r.hp)||0)+(Number(pb.hp)||0),
       atk=(Number(r.atk)||0)+(Number(pb.atk)||0),
       def=(Number(r.def)||0)+(Number(pb.def)||0),
       spa=Number(r.sp_atk)||0,spd=Number(r.sp_def)||0,
       training=(Number(pb.hp)||0)+(Number(pb.atk)||0)+(Number(pb.def)||0),
       grade=Number(r.grade)||0,energy=Number(r.poke_ene)||0,
       bond=bondLevelFor(r.master_id),xp=xpFor(r.master_id),drill=drillFor(r.master_id);
 return {
  base:(ri.recommended?52:0)+(ri.score||0)*.12+grade*15+energy/350+training*3.5+bond*7+xp/25+drill*2,
  damage:Math.max(atk,spa)*.27+Math.min(atk,spa)*.05,
  tank:hp*.13+(def+spd)*.15,
  coverage:ri.recommended?42:0,
  types:[r.type1,r.type2].filter(Boolean),
  moveType:String(r.move_type||"")
 }
}
function autoTeamDiversityPenalty(r,selected){
 const a=autoTeamBaseScore(r);let penalty=0;
 for(const id of selected){
  const x=rec(id);if(!x)continue;
  const b=autoTeamBaseScore(x),overlap=a.types.filter(t=>b.types.includes(t)).length;
  penalty+=overlap*16;
  if(a.moveType&&a.moveType===b.moveType)penalty+=18;
  if(speciesKey(r)===speciesKey(x))penalty+=70
 }
 return penalty
}
function buildAutoTeam(need){
 const pool=(state.owned||[]).map(o=>rec(o.id)).filter(Boolean);
 if(!pool.length||need<=0)return[];
 const selected=[],roles=["damage","tank","coverage"];
 while(selected.length<need&&selected.length<pool.length){
  const role=roles[Math.min(selected.length,roles.length-1)];
  let best=null,bestScore=-Infinity;
  for(const r of pool){
   if(selected.includes(r.master_id))continue;
   const a=autoTeamBaseScore(r);
   let score=a.base-autoTeamDiversityPenalty(r,selected);
   if(role==="damage")score+=a.damage+a.coverage*.45;
   else if(role==="tank")score+=a.tank+a.coverage*.25;
   else score+=a.coverage+a.damage*.28+a.tank*.22;
   if(score>bestScore){bestScore=score;best=r}
  }
  if(!best)break;
  selected.push(best.master_id)
 }
 return selected
}

 const sort=filter.sort||"standard";
 const cmp={
  standard:(a,b)=>a.i-b.i,
  number:(a,b)=>String(a.r.pick_no||"").localeCompare(String(b.r.pick_no||""),"ja",{numeric:true})||a.i-b.i,
  name:(a,b)=>String(a.r.name_ja||"").localeCompare(String(b.r.name_ja||""),"ja")||a.i-b.i,
  grade:(a,b)=>(Number(b.r.grade)||0)-(Number(a.r.grade)||0)||(Number(b.r.poke_ene)||0)-(Number(a.r.poke_ene)||0)||a.i-b.i,
  energy:(a,b)=>(Number(b.r.poke_ene)||0)-(Number(a.r.poke_ene)||0)||(Number(b.r.grade)||0)-(Number(a.r.grade)||0)||a.i-b.i,
  growth:(a,b)=>growthPointsFor(b.r.master_id)-growthPointsFor(a.r.master_id)||a.i-b.i,
  drill:(a,b)=>drillFor(b.r.master_id)-drillFor(a.r.master_id)||a.i-b.i,
  bond:(a,b)=>bondLevelFor(b.r.master_id)-bondLevelFor(a.r.master_id)||a.i-b.i,
  recommended:(a,b)=>teamRecommendationInfo(b.r).score-teamRecommendationInfo(a.r).score||(Number(b.r.poke_ene)||0)-(Number(a.r.poke_ene)||0)||(Number(b.r.grade)||0)-(Number(a.r.grade)||0)||a.i-b.i

  const checkUrl=new URL(location.href);checkUrl.hash="";checkUrl.searchParams.set("_frenda_version_check",String(now));
  const res=await fetch(checkUrl.toString(),{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
  if(!res.ok)return false;
  const html=await res.text(),m=html.match(/FRENDA_DUNGEON_VERSION:\s*([0-9.]+)/i),remote=m?.[1];
  if(!remote||compareAppVersions(remote,APP_VERSION)<=0)return false;
  const key=`frenda:dungeon:reloaded:${remote}`;if(sessionStorage.getItem(key)==="1"&&!force)return false;
  sessionStorage.setItem(key,"1");
  const next=new URL(location.href);next.searchParams.set("appv",remote);next.searchParams.set("_reload",String(now));location.replace(next.toString());return true;
 }catch(e){console.debug("update check skipped",e);return false}
}

function showStartupSplash(){
 document.getElementById("startupSplash")?.remove();
 const ov=document.createElement("div");
 ov.id="startupSplash";ov.className="startupSplash";
 ov.innerHTML=`<img class="startupSplashBg" src="${STARTUP_SPLASH_ART}" alt=""><div class="startupSplashStage" role="button" tabindex="0" aria-label="フレンダダンジョンを開始"><img class="startupSplashCover" src="${STARTUP_SPLASH_ART}" alt="フレンダダンジョン"><div class="startupSplashTap">TAP TO START<br><span>タップしてスタート</span></div></div>`;
 document.body.appendChild(ov);
 const start=()=>{
  ov.classList.add("closing");
  setTimeout(()=>ov.remove(),260);
  screen="home";
  if(!state.run&&!state.postRun)render()
 };
 ov.querySelector(".startupSplashStage").onclick=start;
 ov.querySelector(".startupSplashStage").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();start()}}
}
document.addEventListener("pointerdown",()=>{if(soundVolume()>0)ensureAudio()},{passive:true});
render();loadEvolutionData();showStartupSplash();
setTimeout(()=>checkForAppUpdate(),900);

function dungeonCloudData(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch{}
 return {format_version:1,dungeon_version:APP_VERSION,state:saved||state};
}
function applyDungeonCloudData(data){
 if(!data||typeof data!=="object"||!data.state||typeof data.state!=="object")throw new Error("クラウドデータ形式が不正です");
 localStorage.setItem(SAVE_KEY,JSON.stringify(data.state));
}
if(window.FrendaCloud)window.FrendaCloud.init({app:"dungeon",label:"ダンジョン",column:"dungeon_data",getData:dungeonCloudData,applyData:applyDungeonCloudData,watchStorage:k=>k===SAVE_KEY});
})();
