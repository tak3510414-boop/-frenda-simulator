function frendaManagedStorageKeys(){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith("frenda:")||k.startsWith("frenda_")))out.push(k)}return out}
function captureFrendaStorage(){const data={};for(const k of frendaManagedStorageKeys())data[k]=localStorage.getItem(k);return data}

 return {format_version:1,dungeon_version:String(saved?.appVersion||""),state:saved||{}};
}
function applyExpeditionDungeonCloudData(data){
 if(!data||typeof data!=="object"||!data.state||typeof data.state!=="object")throw new Error("クラウドデータ形式が不正です");
 DATA.dungeon.write(data.state);

 else localStorage.removeItem(EXP_KEY);
}

 try{
