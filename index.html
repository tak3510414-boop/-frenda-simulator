*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,#2b7598 0,#173f58 30%,#0b2434 68%,#071923 100%);color:#fff;padding:env(safe-area-inset-top) 14px calc(20px + env(safe-area-inset-bottom))}.wrap{width:min(760px,100%);margin:auto;padding:28px 0}.hero{text-align:center;margin-bottom:22px}.logo{font-size:56px;filter:drop-shadow(0 8px 14px #0006)}h1{font-size:clamp(27px,8vw,42px);margin:8px 0 4px;letter-spacing:.02em}.sub{font-size:12px;color:#b9d7e7;font-weight:700}.apps{display:grid;gap:12px}.app{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:13px;align-items:center;text-decoration:none;color:#143246;background:#f7fcff;border:2px solid #ffffff80;border-radius:20px;padding:15px 14px;box-shadow:0 10px 28px #0005;transition:.13s transform,.13s filter}.app:active{transform:scale(.985)}.icon{width:64px;height:64px;border-radius:17px;display:grid;place-items:center;font-size:34px;background:#dceff8}.app b{display:block;font-size:18px}.app small{display:block;color:#587181;font-weight:700;margin-top:4px;line-height:1.4}.ver{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#e6eef3;color:#496270;font-size:10px;font-weight:900}.arrow{font-size:26px;color:#7595a7;font-weight:900}.sim .icon{background:#dff5ff}.dun .icon{background:#def3e4}.exp .icon{background:#fff0c9}.note{margin:17px 4px 0;padding:11px 13px;border:1px solid #ffffff25;border-radius:13px;background:#ffffff0d;color:#c4dbe7;font-size:11px;line-height:1.65;text-align:center}@media(max-width:520px){.wrap{padding-top:20px}.logo{font-size:45px}.app{grid-template-columns:52px minmax(0,1fr) 18px;padding:12px 10px;gap:9px;border-radius:16px}.icon{width:52px;height:52px;font-size:28px;border-radius:14px}.app b{font-size:15px}.app small{font-size:9px}.arrow{font-size:20px}}
</style>
