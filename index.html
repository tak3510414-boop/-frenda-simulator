<!doctype html>
<!-- FRENDA_SIMULATOR_VERSION: 3.5 -->
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>フレンダシミュレーター Ver3.5</title>
<style>
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#17202a}
header{background:#172b3a;color:#fff;padding:14px 16px;font-weight:800}main{max-width:720px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 1px 5px #0002}
h2{margin:0 0 12px;font-size:19px}.note{font-size:13px;line-height:1.6;color:#555}
input,button{font:inherit;box-sizing:border-box}input[type=file]{width:100%}
button{border:0;border-radius:10px;padding:11px 14px;background:#1769e0;color:#fff;font-weight:700}button:disabled{opacity:.4}
.photo{position:relative;background:#222;border-radius:12px;overflow:hidden;margin-top:10px}
.photo img{display:block;width:100%;height:auto}.photo canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.status{padding:9px;background:#eef4ff;border-radius:9px;margin:8px 0}.diag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diag>div{background:#f6f6f6;border-radius:10px;padding:7px}.diag img{width:100%;height:100px;object-fit:contain;background:#222}
small{word-break:break-all}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields label{font-size:12px;font-weight:700}
.fields input{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;margin-top:3px}
</style></head><body>
<header>ポケモンフレンダ 家庭版シミュレーター　Ver3.5</header><main>
<section class="card"><h2>① 裏面を撮影</h2>
<input id="file" type="file" accept="image/*" capture="environment">
<p class="note">撮影後、ピックの <b>左上 → 右上 → 右下 → 左下</b> の順に4点をタップしてください。</p>
<div id="photo" class="photo" hidden><img id="img"><canvas id="cv"></canvas></div>
<div id="ps" class="status">0 / 4 点</div>
<button id="reset" type="button">四隅をやり直す</button>
<button id="run" type="button" disabled>4点補正してOCR</button>
</section>
<section class="card"><h2>② 4点補正後</h2><img id="rect" style="width:100%;max-height:500px;object-fit:contain;background:#222">
<p class="note">ここがピック裏面だけの長方形になっていることを確認してください。</p></section>
<section class="card"><h2>③ OCR切り出し診断</h2><div id="diag" class="diag"></div></section>
<section class="card"><h2>④ 認識結果</h2><div class="fields" id="fields"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>
<script>
const $=x=>document.getElementById(x); let im=new Image(),pts=[],rectified=null;
const names={name:"日本語名",english:"英語名",move:"技名",hp:"HP",atk:"こうげき",def:"ぼうぎょ",spatk:"とくこう",spdef:"とくぼう",pickno:"ピック番号"};
Object.entries(names).forEach(([k,v])=>{$("fields").insertAdjacentHTML("beforeend",`<label>${v}<input id="f_${k}"></label>`)});
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{im.onload=()=>{$("img").src=r.result;$("photo").hidden=false;pts=[];draw()};im.src=r.result};r.readAsDataURL(f)};
function draw(){const c=$("cv"),r=$("img").getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;let x=c.getContext("2d");x.scale(devicePixelRatio,devicePixelRatio);x.strokeStyle="red";x.fillStyle="red";x.lineWidth=2;pts.forEach((p,i)=>{x.beginPath();x.arc(p.x*r.width,p.y*r.height,7,0,7);x.fill();x.fillText(i+1,p.x*r.width+8,p.y*r.height)});if(pts.length>1){x.beginPath();x.moveTo(pts[0].x*r.width,pts[0].y*r.height);for(let i=1;i<pts.length;i++)x.lineTo(pts[i].x*r.width,pts[i].y*r.height);if(pts.length==4)x.closePath();x.stroke()}$("ps").textContent=pts.length+" / 4 点";$("run").disabled=pts.length!=4}
$("cv").onpointerdown=e=>{if(pts.length>=4)return;let r=e.currentTarget.getBoundingClientRect();pts.push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});draw()};
$("reset").onclick=()=>{pts=[];draw()};
function rectify(){const W=720,H=1080,s=document.createElement("canvas");s.width=im.naturalWidth;s.height=im.naturalHeight;let sx=s.getContext("2d");sx.drawImage(im,0,0);let sd=sx.getImageData(0,0,s.width,s.height).data,c=document.createElement("canvas");c.width=W;c.height=H;let cx=c.getContext("2d"),o=cx.createImageData(W,H),d=o.data,P=pts.map(p=>({x:p.x*s.width,y:p.y*s.height}));for(let y=0;y<H;y++){let v=y/(H-1);for(let x=0;x<W;x++){let u=x/(W-1),xx=(1-u)*(1-v)*P[0].x+u*(1-v)*P[1].x+u*v*P[2].x+(1-u)*v*P[3].x,yy=(1-u)*(1-v)*P[0].y+u*(1-v)*P[1].y+u*v*P[2].y+(1-u)*v*P[3].y,ix=Math.max(0,Math.min(s.width-1,Math.round(xx))),iy=Math.max(0,Math.min(s.height-1,Math.round(yy))),a=(iy*s.width+ix)*4,b=(y*W+x)*4;d[b]=sd[a];d[b+1]=sd[a+1];d[b+2]=sd[a+2];d[b+3]=255}}cx.putImageData(o,0,0);return c}
const R={name:[.50,.10,.45,.09],english:[.60,.06,.34,.05],move:[.10,.35,.65,.09],hp:[.25,.64,.22,.08],atk:[.45,.64,.18,.08],def:[.63,.64,.22,.08],spatk:[.35,.72,.25,.08],spdef:[.60,.72,.25,.08],pickno:[.70,.84,.25,.06]};
function crop(a){let [x,y,w,h]=a,c=document.createElement("canvas");c.width=w*rectified.width*4;c.height=h*rectified.height*4;c.getContext("2d").drawImage(rectified,x*rectified.width,y*rectified.height,w*rectified.width,h*rectified.height,0,0,c.width,c.height);return c}
$("run").onclick=async()=>{try{$("run").disabled=true;rectified=rectify();$("rect").src=rectified.toDataURL("image/jpeg",.9);$("diag").innerHTML="";let w=await Tesseract.createWorker(["jpn","eng"]);for(const k of Object.keys(R)){let c=crop(R[k]),numeric=["hp","atk","def","spatk","spdef"].includes(k);await w.setParameters(numeric?{tessedit_char_whitelist:"0123456789",tessedit_pageseg_mode:"7"}:{tessedit_pageseg_mode:"7"});let z=await w.recognize(c),t=z.data.text.trim();$("f_"+k).value=numeric?t.replace(/\\D/g,""):t.replace(/\\s+/g," ");let box=document.createElement("div");box.innerHTML=`<b>${k}</b><img><small></small>`;box.querySelector("img").src=c.toDataURL("image/jpeg",.9);box.querySelector("small").textContent="OCR: "+JSON.stringify(t)+" / "+Math.round(z.data.confidence)+"%";$("diag").appendChild(box)}await w.terminate()}catch(e){alert(e)}finally{$("run").disabled=false}};
</script></body></html>
