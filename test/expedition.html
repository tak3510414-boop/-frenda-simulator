<script>
(()=>{
"use strict";

const DATA=window.FRENDA_DATA;

if(!DATA)throw new Error("frenda-data.js を読み込めませんでした。");

const TEST_SANDBOX=window.FRENDA_TEST;

const TEST_PARAMS=new URLSearchParams(location.search);

const DUNGEON_KEY=DATA.KEYS.dungeon;
const EXP_KEY=DATA.KEYS.expedition;
const REGION_PREFIXES=["アローラ","ガラル","ヒスイ","パルデア"];
const MASTER=window.FRENDA_MASTER,CORE=window.FRENDA_CORE,RULES=window.FRENDA_RULES,RECORDS=Array.isArray(MASTER?.records)?MASTER.records:[];
if(!RULES)throw new Error("frenda-rules.js を読み込めませんでした。");
const EXP_TO_DRILL=RULES.EXP_TO_DRILL;
const BOND_LEVEL_THRESHOLDS=RULES.BOND_LEVEL_THRESHOLDS;
const BOND_MAX_POINTS=Math.max(1,Number(BOND_LEVEL_THRESHOLDS?.[5])||15),COIN_PER_OVERFLOW_BOND=50;
const TRAINING_STEP=RULES.TRAINING_STEP,PERMANENT_BOOST_MAX=RULES.PERMANENT_BOOST_MAX;
const LUCK_MAX=5,COIN_PER_OVERFLOW_DRILL=100,SOUVENIR_COIN_NORMAL=50,SOUVENIR_COIN_RARE=200;
const app=document.getElementById("app");
if((EXPEDITION_TEST_REQUESTED||EXPEDITION_SELFTEST_REQUESTED)&&!TEST_SANDBOX?.active){
 app.innerHTML=`<div class="card error"><b>テスト用保存領域を開始できませんでした。</b><br>frenda-test.js を expedition.html と同じ階層に配置してください。<br><small>本番セーブ保護のため、テストモードは開始していません。</small></div>`;
 throw new Error("FRENDA_TEST_SANDBOX_REQUIRED");
}

/* Ver0.71: shared procedural BGM / SFX. No external audio assets. */
const SOUND_KEY="frenda:dungeon:sound:v1";

/* ===== AUTO GENERATION BACKUP v1 =====
   10世代・本番セーブとは別キー。壊れた/nullデータは世代化しない。
   通常保存は10分間隔＋重複排除。アプリVer境界、初期化前、読込前後、復元前後は強制世代化。
*/
const AUTO_BACKUP_KEY="frenda:auto-backups:v1";
const AUTO_BACKUP_FORMAT="frenda-auto-backups-v1";
const AUTO_BACKUP_MAX=10;
const AUTO_BACKUP_MIN_INTERVAL_MS=10*60*1000;
const AUTO_BACKUP_SOURCE_APP="expedition";
function autoBackupParseObject(raw){if(typeof raw!=="string"||!raw.trim())return null;try{const x=JSON.parse(raw);return x&&typeof x==="object"&&!Array.isArray(x)?x:null}catch{return null}}
function autoBackupValidDungeonRaw(raw){const x=autoBackupParseObject(raw);return !!(x&&x.initialized===true&&Array.isArray(x.owned)&&x.owned.length>0)}
function autoBackupValidExpeditionRaw(raw){if(raw===null)return true;const x=autoBackupParseObject(raw);return !!x}
function autoBackupHash(text){let h=2166136261;const s=String(text??"");for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,"0")}
function autoBackupReadStore(){try{const raw=STORE.getItem(AUTO_BACKUP_KEY);if(!raw)return[];const x=JSON.parse(raw);const a=Array.isArray(x)?x:Array.isArray(x?.items)?x.items:[];return a.filter(v=>v&&typeof v==="object"&&typeof v.dungeon==="string").slice(0,AUTO_BACKUP_MAX)}catch(e){console.warn("AUTO_BACKUP_READ",e);return[]}}
function autoBackupWriteStore(items){const src=(Array.isArray(items)?items:[]).slice(0,AUTO_BACKUP_MAX);for(let keep=src.length;keep>=1;keep--){try{const body={format:AUTO_BACKUP_FORMAT,version:1,max:AUTO_BACKUP_MAX,updatedAt:new Date().toISOString(),items:src.slice(0,keep)};STORE.setItem(AUTO_BACKUP_KEY,JSON.stringify(body));const verify=JSON.parse(STORE.getItem(AUTO_BACKUP_KEY)||"null");if(!verify||!Array.isArray(verify.items)||verify.items.length!==keep)throw new Error("AUTO_BACKUP_VERIFY_FAILED");return keep}catch(e){console.warn("AUTO_BACKUP_STORE_RETRY",keep,e)}}return 0}
function autoBackupCurrentRaw(){return {dungeon:STORE.getItem(DUNGEON_KEY),expedition:STORE.getItem(EXP_KEY),sound:STORE.getItem(SOUND_KEY)}}
function autoBackupDescribeRaw(raw){const d=autoBackupParseObject(raw.dungeon)||{},x=autoBackupParseObject(raw.expedition)||{};let clears=0;for(const v of Object.values(d.stats||{}))clears+=Math.max(0,Number(v?.clears)||0);return {dungeonVersion:String(d.appVersion||"?"),expeditionVersion:String(x.appVersion||"?"),owned:Array.isArray(d.owned)?d.owned.length:0,clears,expStatus:String(x.status||"idle")}}
function autoBackupCapture(reason="自動保存",options={}){
 try{
  const raw=autoBackupCurrentRaw();
  if(!autoBackupValidDungeonRaw(raw.dungeon))return {ok:false,skipped:"invalid-dungeon"};
  if(!autoBackupValidExpeditionRaw(raw.expedition))return {ok:false,skipped:"invalid-expedition"};
  const items=autoBackupReadStore(),latest=items[0]||null,meta=autoBackupDescribeRaw(raw),now=Date.now();
  if(latest&&latest.dungeon===raw.dungeon&&latest.expedition===raw.expedition&&latest.sound===raw.sound)return {ok:true,skipped:"same",count:items.length};
  const storedVer=AUTO_BACKUP_SOURCE_APP==="dungeon"?meta.dungeonVersion:meta.expeditionVersion;
  const versionBoundary=storedVer&&storedVer!=="?"&&String(storedVer)!==String(APP_VERSION);
  const force=options.force===true||versionBoundary||items.length===0;
  const lastAt=Number(latest?.createdAtMs)||Date.parse(latest?.createdAt||"")||0;
  if(!force&&lastAt&&now-lastAt<AUTO_BACKUP_MIN_INTERVAL_MS)return {ok:true,skipped:"interval",count:items.length};
  const why=versionBoundary&&!options.force?`${reason}（Ver${storedVer}→${APP_VERSION}更新前）`:reason;
  const fingerprint=autoBackupHash(`${raw.dungeon}\n${raw.expedition??""}\n${raw.sound??""}`);
  const item={id:`${now}-${fingerprint}`,createdAt:new Date(now).toISOString(),createdAtMs:now,reason:String(why||"自動保存"),sourceApp:AUTO_BACKUP_SOURCE_APP,dungeonVersion:meta.dungeonVersion,expeditionVersion:meta.expeditionVersion,owned:meta.owned,clears:meta.clears,expStatus:meta.expStatus,fingerprint,dungeon:raw.dungeon,expedition:raw.expedition,sound:raw.sound};
  const count=autoBackupWriteStore([item,...items]);
  return count?{ok:true,count,item}:{ok:false,skipped:"quota"}
 }catch(e){console.error("AUTO_BACKUP_CAPTURE",e);return {ok:false,error:e}}
}
function autoBackupEscape(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]))}
function autoBackupDate(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?String(iso||""):d.toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function autoBackupRestore(id){const target=autoBackupReadStore().find(x=>x.id===id);if(!target)return UI.dialog.alert("選択した世代が見つかりません。");if(!autoBackupValidDungeonRaw(target.dungeon)||!autoBackupValidExpeditionRaw(target.expedition))return UI.dialog.alert("この世代は安全条件を満たさないため復元できません。");if(!UI.dialog.confirm(`${autoBackupDate(target.createdAt)} の世代へ戻しますか？\n復元前の現在データも緊急退避してから実行します。`))return;try{autoBackupCapture("世代復元前の緊急退避",{force:true});STORE.setItem(DUNGEON_KEY,target.dungeon);if(typeof target.expedition==="string")STORE.setItem(EXP_KEY,target.expedition);else STORE.removeItem(EXP_KEY);if(typeof target.sound==="string")STORE.setItem(SOUND_KEY,target.sound);else STORE.removeItem(SOUND_KEY);if(STORE.getItem(DUNGEON_KEY)!==target.dungeon||STORE.getItem(EXP_KEY)!==(target.expedition??null))throw new Error("RESTORE_VERIFY_FAILED");autoBackupCapture("世代復元後",{force:true});UI.dialog.alert("世代バックアップを復元しました。ページを再読み込みします。");location.reload()}catch(e){console.error("AUTO_BACKUP_RESTORE",e);UI.dialog.alert("復元に失敗しました。\n"+(e?.message||String(e)))}}
function autoBackupOpenManager(){
