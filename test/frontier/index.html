<!doctype html>
<html lang="ja" data-app-version="0.05">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frenda Frontier Ver0.05</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#e7eee8;color:#173126}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--green:#1b6b43;--green2:#2f8b5b;--line:#c9d8cc;--shadow:0 10px 28px #143c2618;--navy:#102544;--navy2:#18345f;--paper:#f6f1df;--wood:#b97d49;--wood2:#8a5834}
header{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#164f35,#277c50);color:#fff;padding:8px 12px;box-shadow:0 2px 10px #0003}
.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px}.brand{display:flex;flex-direction:column;min-width:0}.brand b{font-size:21px;line-height:1.1}.brand small{font-size:10px;opacity:.84}.headStats{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{background:#ffffff1c;border:1px solid #ffffff35;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
main{max-width:980px;margin:auto;padding:12px}.notice{background:#fff7d5;border:1px solid #e0c766;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800;margin-bottom:10px}
.topNav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.topNav button{flex:0 0 auto;border:1px solid #bfd2c3;background:#fff;color:#234a35;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900}.topNav button.on{background:#1e6c45;color:#fff;border-color:#1e6c45}
.gameFrame{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.gameHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(#f8fbf8,#eef5ef);border-bottom:1px solid #d6e2d8}.gameHeader h2{margin:0;font-size:16px}.sub{font-size:11px;color:#5f7466}
.sceneHolder{position:relative;overflow:hidden}
.gameScene{position:relative;height:min(74vh,700px);min-height:520px;overflow:hidden;background:#c8dfc0}
.sceneHud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:5}.miniTags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#123726dd;color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;backdrop-filter:blur(4px)}
/* Windows inside scene */
.dialogBox,.commandBox,.hudBox{position:absolute;z-index:8;background:var(--navy);color:#fff;border:4px solid #d5e0f2;border-radius:16px;box-shadow:0 10px 28px #0005}.dialogBox{left:12px;right:150px;bottom:12px;min-height:106px;padding:12px}.dialogBox h3{margin:0 0 8px;font-size:14px;color:#fff}.dialogBox p{margin:0;font-size:14px;line-height:1.7;white-space:pre-line}.commandBox{right:12px;bottom:12px;width:126px;padding:10px}.commandTitle{font-size:12px;font-weight:900;margin:0 0 8px}.cmdList{display:grid;gap:6px}.cmdBtn{width:100%;text-align:left;padding:7px 8px;border-radius:10px;border:1px solid #8fa7d1;background:linear-gradient(#214374,#173059);color:#fff;font-weight:900;font-size:12px}.cmdBtn.primary{background:linear-gradient(#2f7d5f,#1d6348);border-color:#70b395}.cmdBtn.warn{background:linear-gradient(#a96639,#864b28);border-color:#d79d6e}.cmdBtn:disabled{opacity:.5;cursor:not-allowed}
.hudStrip{position:absolute;left:12px;right:12px;top:12px;z-index:9;display:flex;gap:8px;flex-wrap:wrap}.hudPill{background:var(--navy);color:#fff;border:3px solid #d5e0f2;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:900}
/* Pixel-ish characters */
.pxHuman{position:absolute;width:34px;height:46px;z-index:4}.pxHuman .sh{position:absolute;left:7px;bottom:1px;width:20px;height:7px;border-radius:50%;background:#0000002a}.pxHuman .hd{position:absolute;left:10px;top:8px;width:14px;height:12px;background:#e8c29e;border:2px solid #83583a;border-radius:6px}.pxHuman .hat{position:absolute;left:8px;top:4px;width:18px;height:7px;background:#d24f4a;border:2px solid #963533;border-bottom:none;border-radius:8px 8px 3px 3px}.pxHuman.blue .hat{background:#4184d8;border-color:#244f88}.pxHuman.green .hat{background:#5eaa58;border-color:#3d7137}.pxHuman.purple .hat{background:#8a67bd;border-color:#5b4481}.pxHuman.orange .hat{background:#ce7a3e;border-color:#915127}.pxHuman .bd{position:absolute;left:9px;top:20px;width:16px;height:13px;background:#e65b52;border:2px solid #8a3d39;border-radius:3px}.pxHuman.blue .bd{background:#4f7fd0;border-color:#345689}.pxHuman.green .bd{background:#6bb064;border-color:#487345}.pxHuman.purple .bd{background:#9472c1;border-color:#634d86}.pxHuman.orange .bd{background:#d38a4b;border-color:#8c5a2f}.pxHuman .arm{position:absolute;top:22px;width:6px;height:9px;background:#e8c29e;border-radius:3px}.pxHuman .arm.l{left:5px}.pxHuman .arm.r{right:5px}.pxHuman .lg{position:absolute;left:10px;top:33px;width:5px;height:10px;background:#474a88;border-radius:2px;box-shadow:9px 0 0 #474a88}.pxHuman .face{position:absolute;left:13px;top:13px;width:2px;height:2px;background:#4f3526;box-shadow:6px 0 0 #4f3526}
.partnerSprite,.enemySprite{position:absolute;z-index:4}.partnerSprite img,.enemySprite img{width:36px;height:50px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px #0004}.enemyLabel{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2px solid #b54747;color:#6e2323;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}
/* Town scene */
.townScene{background:linear-gradient(#7fc0eb 0 42%,#8cc571 42% 66%,#baa377 66% 100%)}.townRoadV{position:absolute;left:41%;top:22%;width:14%;height:62%;background:#d8c190;border-left:2px solid #c5ad7c;border-right:2px solid #c5ad7c}.townRoadH{position:absolute;left:8%;top:53%;width:84%;height:14%;background:#d8c190;border-top:2px solid #c5ad7c;border-bottom:2px solid #c5ad7c}.shopExt,.houseExt,.whExt,.smithExt{position:absolute;border-radius:10px;box-shadow:0 10px 0 #00000018}.shopExt,.houseExt,.whExt,.smithExt{background:#e7d6ad;border:4px solid #714a31}.roofRed,.roofBlue,.roofBrown,.roofGold{position:absolute;left:-6px;right:-6px;top:-24px;height:34px;clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:10px 10px 0 0}.roofRed{background:#b95443}.roofBlue{background:#4a81cb}.roofBrown{background:#9c6b3c}.roofGold{background:#b98b46}.door,.win{position:absolute;background:#8f613f;border:3px solid #6b482f;border-radius:6px}.sign{position:absolute;background:#fff7da;border:2px solid #8c6b37;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:900;color:#2d3e2f}.fountain{position:absolute;left:43.5%;top:57%;width:13%;height:13%;border-radius:50%;background:radial-gradient(circle,#9ae0ff 0 34%,#54a5cf 35% 63%,#d8d3bf 64% 100%);border:4px solid #7e8b85;box-shadow:0 0 0 4px #d8c190 inset}.tree{position:absolute;width:40px;height:40px;background:radial-gradient(circle at 40% 35%,#6ca95e 0 28%,#4f8b45 29% 60%,#356932 61% 100%);border-radius:50%;box-shadow:0 22px 0 -14px #6e5335}.flower{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffb2d0;box-shadow:10px 2px 0 #ffe789,4px 10px 0 #caa4ff}
/* House interior */
.houseScene{background:repeating-linear-gradient(90deg,#c99661 0 30px,#b98553 30px 32px),repeating-linear-gradient(0deg,#c99661 0 30px,#b98553 30px 32px)}.wallPanel{position:absolute;inset:10px;border:8px solid #7c5637;border-radius:10px;pointer-events:none}.bedBig{position:absolute;left:11%;top:14%;width:25%;height:27%;background:#f7f7f7;border:4px solid #6a4b32;border-radius:12px}.bedBig:before{content:"";position:absolute;left:0;right:0;top:0;height:32%;background:#6d92d9;border-radius:8px 8px 0 0}.bookShelf{position:absolute;background:#8a5c39;border:4px solid #5f3f2a;border-radius:6px}.bookShelf:after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,#7aa5e2 0 10px,#7aa5e2 10px 12px,#d9c85f 12px 20px,#d9c85f 20px 22px,#6bb16c 22px 30px,#6bb16c 30px 32px)}.rugRect{position:absolute;background:#7f9a61;border:4px solid #d7c37a;border-radius:8px}.tableSmall{position:absolute;background:#9a704b;border:4px solid #6d4a31;border-radius:50%}.kitchen{position:absolute;right:8%;bottom:12%;width:19%;height:22%;background:#dbd1c0;border:4px solid #7c6c58;border-radius:8px}.stove{position:absolute;right:12%;bottom:15%;width:7%;height:11%;background:#b8c3ce;border:3px solid #617080;border-radius:6px}
/* Store interior */
.storeScene{background:repeating-linear-gradient(90deg,#c99661 0 30px,#b98553 30px 32px),repeating-linear-gradient(0deg,#c99661 0 30px,#b98553 30px 32px)}.counter{position:absolute;left:34%;top:34%;width:31%;height:17%;background:#8a5a37;border:5px solid #5d3e29;border-radius:8px}.shelfWall{position:absolute;background:#7b5133;border:4px solid #553821;border-radius:6px}.shelfWall .goods{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.good{width:100%;padding-top:100%;border-radius:4px;background:#72a6ea}.good:nth-child(2n){background:#d95b59}.good:nth-child(3n){background:#6cb769}.good:nth-child(4n){background:#d4b758}.crate{position:absolute;background:#a57143;border:4px solid #714a2f;border-radius:6px}.plant{position:absolute;width:28px;height:28px;background:radial-gradient(circle at 50% 40%,#5fa962 0 34%,#3e813e 35% 60%,transparent 61%);border-radius:50%}.cashierBox{position:absolute;background:#464f66;border:3px solid #d5e0f2;border-radius:8px}
/* Adventure */
.advScene{background:linear-gradient(#446b3f,#27402a)}.forestBg{position:absolute;inset:0;background:radial-gradient(circle at 15% 18%,#567e46 0 3.5%,transparent 4%),radial-gradient(circle at 40% 16%,#4d7742 0 3.5%,transparent 4%),radial-gradient(circle at 70% 24%,#5b844f 0 3.5%,transparent 4%),linear-gradient(#5d8d4f 0 18%,#436b3b 18% 100%)}
.boardWrap{position:absolute;left:12px;right:150px;top:54px;bottom:132px;background:#3e6137;border:4px solid #d5e0f2;border-radius:18px;padding:8px;overflow:hidden}.board{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:1fr;height:100%;border-radius:12px;overflow:hidden;background:#35572f}.tile{position:relative}.tile.floor{background:#a8c67c}.tile.gather{background:#b7d492}.tile.stairs{background:#c7ae70}.tile.wall{background:#456742}.tile.floor:after,.tile.gather:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#ffffff18 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,#00000008 0 10%,transparent 11%)}.tile.wall:after{content:"";position:absolute;inset:2px;background:radial-gradient(circle at 25% 25%,#52784f 0 18%,transparent 19%),radial-gradient(circle at 75% 75%,#335132 0 18%,transparent 19%)}.leaf{position:absolute;left:50%;top:50%;width:16px;height:9px;background:#68a359;border-radius:10px 10px 10px 0;transform:translate(-50%,-50%) rotate(-25deg);box-shadow:8px 5px 0 #79b96c}.stairsIcon{position:absolute;left:50%;top:50%;width:28px;height:18px;transform:translate(-50%,-50%);border:3px solid #7f5e35;border-top:none;background:repeating-linear-gradient(0deg,#ddc47e 0 4px,#c28c4a 4px 8px)}.tapHint{position:absolute;right:12px;top:12px;z-index:5;background:#102544cc;color:#fff;border:3px solid #d5e0f2;border-radius:12px;padding:6px 9px;font-size:10px;font-weight:900}
.dirPad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}.dirPad button{height:34px;border-radius:8px;border:1px solid #8fa7d1;background:#214374;color:#fff;font-weight:900}.dirPad .up{grid-column:2}
/* modal, toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#153b2de8;color:#fff;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:900;box-shadow:0 8px 28px #0005;pointer-events:none;opacity:0;transition:opacity .2s}.toast.on{opacity:1}.modal{position:fixed;inset:0;z-index:90;background:#07160fbd;display:grid;place-items:center;padding:16px}.modalPanel{width:min(520px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 25px 70px #0008}.modalPanel h2{margin:0 0 8px}.modalActions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.partnerGrid,.choiceGrid{display:grid;grid-template-columns:1fr;gap:8px}.partnerCard,.choiceCard{border:2px solid #d7e3d9;background:#fff;border-radius:14px;padding:8px;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}.partnerCard.on{border-color:#2a8a59;background:#edf9f1}.partnerCard img,.choiceCard img{width:52px;height:72px;object-fit:cover;border-radius:7px;background:#eef}.badge{display:inline-block;border-radius:999px;background:#eaf1ec;padding:2px 6px;font-size:9px;font-weight:900;margin:2px 2px 0 0}
@media (max-width:640px){main{padding:8px}.brand b{font-size:18px}.gameScene{height:min(67vh,620px);min-height:470px}.dialogBox{right:122px;min-height:98px;padding:10px}.dialogBox h3{font-size:12px}.dialogBox p{font-size:12px}.commandBox{width:102px;padding:8px}.cmdBtn{padding:6px 7px;font-size:11px}.boardWrap{right:118px;bottom:118px}.tag,.hudPill{font-size:10px;padding:5px 8px}.pxHuman{transform:scale(.95);transform-origin:top left}.partnerSprite img,.enemySprite img{width:30px;height:42px}.notice{font-size:10px}}
</style>
</head>
<body>
<header><div class="head"><div id="frontierUserHost"></div><div class="brand"><b>Frenda Frontier</b><small id="appVerLabel">Ver0.05 / TEST</small></div><div class="headStats" id="headStats"></div></div></header>
<main>
  <div class="notice">🧪 Ver0.05：町・店・家・ダンジョンを、イメージに寄せた1画面完結のゲーム画面へ調整しました。会話ウィンドウ＋コマンド選択方式です。既存Simulator／Dungeon／Expeditionのデータは変更しません。</div>
  <div class="topNav" id="mainNav">
    <button class="on" data-view="home">🏠 拠点</button>
    <button data-view="adventure">🗺️ 冒険</button>
    <button data-view="store">🏪 お店</button>
  </div>
  <section class="gameFrame">
    <div class="gameHeader"><div><h2 id="viewTitle">拠点</h2><div class="sub" id="viewSubtitle"></div></div><div class="sub" id="viewMeta"></div></div>
    <div class="sceneHolder"><div id="sceneMount" class="gameScene"></div></div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script>
(()=>{const v=document.documentElement.dataset.appVersion||"0";document.write(`<script src="../frenda-test.js?app=${v}"><\/script>`);document.write(`<script src="../frenda-user.js?app=${v}"><\/script>`);for(const f of ["frenda-master.js","frenda-data.js"])document.write(`<script src="../../${f}?app=${v}"><\/script>`);})();
</script>
<script>(()=>{const v=document.documentElement.dataset.appVersion||"0";for(const f of ["frontier-data.js","frontier-save.js","frontier-core.js","frontier-ui.js"])document.write(`<script src="${f}?v=${encodeURIComponent(v)}"><\/script>`);})();</script>
</body>
</html>
