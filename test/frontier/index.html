<!doctype html>
<html lang="ja" data-app-version="0.04">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frenda Frontier Ver0.04</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#e9f0ea;color:#173126}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--green:#1b6b43;--green2:#2f8b5b;--ink:#173126;--line:#c9d8cc;--shadow:0 10px 28px #143c2618;--paper:#f6f1df;--wood1:#d9bf8e;--wood2:#b98653;--wood3:#6a4a31;--night:#102a1f}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#164f35,#277c50);color:#fff;padding:8px 12px;box-shadow:0 2px 10px #0003}.head{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px}.brand{display:flex;flex-direction:column;min-width:0}.brand b{font-size:21px;line-height:1.1}.brand small{font-size:10px;opacity:.8}.headStats{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{background:#ffffff1c;border:1px solid #ffffff35;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
main{max-width:1200px;margin:auto;padding:12px}.notice{background:#fff7d5;border:1px solid #e0c766;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800;margin-bottom:10px}
.topNav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.topNav button{flex:0 0 auto;border:1px solid #bfd2c3;background:#fff;color:#234a35;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:900}.topNav button.on{background:#1e6c45;color:#fff;border-color:#1e6c45}
.gameFrame{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.gameHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(#f8fbf8,#eef5ef);border-bottom:1px solid #d6e2d8}.gameHeader h2{margin:0;font-size:16px}.sub{font-size:11px;color:#5f7466}.sceneWrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:0;min-height:620px}.scenePanel{position:relative;background:#d4e7cc;overflow:hidden}.sidePanel{background:#f8fbf8;border-left:1px solid #d6e2d8;padding:10px;display:grid;grid-template-rows:auto auto 1fr;gap:10px}
.window{background:#fff;border:3px solid #355842;border-radius:14px;box-shadow:0 4px 0 #dce8de;padding:10px}.window h3{margin:0 0 8px;font-size:14px}.window p{margin:0;font-size:11px;line-height:1.6}.menuList{display:grid;gap:7px}.menuBtn{width:100%;text-align:left;border:2px solid #bfd2c3;background:linear-gradient(#fff,#eff5f0);color:#234a35;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:900}.menuBtn.primary{background:linear-gradient(#2e8b5a,#196740);color:#fff;border-color:#196740}.menuBtn.warn{background:linear-gradient(#d98e3f,#bd6728);color:#fff;border-color:#9c4f1b}.menuBtn:disabled{opacity:.45;cursor:not-allowed}
.cmdNote{font-size:10px;color:#67806f;line-height:1.5}
.msgLog{display:grid;gap:6px;align-content:start;overflow:auto;max-height:260px}.msgLine{background:#eef5ef;border:1px solid #d8e2da;border-radius:10px;padding:6px 8px;font-size:10px;line-height:1.45}.msgLine.new{background:#f9f3da;border-color:#d8c986}
.overlayMini{position:absolute;left:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;z-index:5}.tag{background:#153b2cd9;color:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;backdrop-filter:blur(4px)}
/* Human sprite */
.spriteHuman,.spriteNpc{position:absolute;width:34px;height:48px}.spriteHuman .shadow,.spriteNpc .shadow{position:absolute;left:7px;right:7px;bottom:0;height:9px;border-radius:50%;background:#00000020}.spriteHuman .head,.spriteNpc .head{position:absolute;left:9px;top:3px;width:16px;height:15px;border-radius:8px;background:#e2b48c;border:2px solid #8b5e3d}.spriteHuman .hair,.spriteNpc .hair{position:absolute;left:8px;top:1px;width:18px;height:10px;border-radius:9px 9px 3px 3px;background:#53361f}.spriteHuman .body,.spriteNpc .body{position:absolute;left:8px;top:18px;width:18px;height:16px;border-radius:4px;background:#d04f4f;border:2px solid #73403e}.spriteHuman .legs,.spriteNpc .legs{position:absolute;left:10px;top:34px;width:6px;height:10px;background:#2b4a91;border-radius:2px;box-shadow:8px 0 0 #2b4a91}.spriteHuman .arms,.spriteNpc .arms{position:absolute;left:4px;top:20px;width:26px;height:6px;background:linear-gradient(90deg,#e2b48c 0 18%,#d04f4f 18% 82%,#e2b48c 82% 100%);border-radius:3px}.spriteHuman.partner .body{background:#2f7fda}.spriteHuman.shop .body{background:#cf6d3d}.spriteNpc.green .body{background:#59a05f}.spriteNpc.purple .body{background:#8062b9}.spriteNpc.blue .body{background:#4a8abf}
/* Town / Store */
.townMap{position:relative;height:620px;background:linear-gradient(#bde6f5 0 28%,#89c771 28% 54%,#cfba88 54% 100%)}.townPath{position:absolute;left:0;right:0;bottom:0;height:240px;background:#ccb48a}.townPath:before{content:"";position:absolute;left:0;right:0;top:70px;height:28px;background:#bfab80}.lot{position:absolute;border:4px dashed #5f8d64;border-radius:12px;background:#d7c79c66;display:grid;place-items:center;color:#36553d;font-weight:900}.lot span{background:#fff7dd;border:1px solid #b78f57;border-radius:8px;padding:4px 8px;font-size:11px}
.building{position:absolute;background:#f7efd8;border:4px solid #875f41;border-radius:8px;box-shadow:0 6px 0 #6e503b22}.building .roof{position:absolute;left:-8px;right:-8px;top:-32px;height:38px;background:#a74c3d;clip-path:polygon(50% 0,100% 100%,0 100%)}.building.home .roof{background:#8b613c}.wallLabel{position:absolute;top:10px;left:10px;background:#163a2b;color:#fff;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:900}
.shopInterior{position:absolute;left:8%;top:14%;width:46%;height:47%;background:linear-gradient(#dcb275,#c58e57);border:4px solid #7d5739;border-radius:8px}.shopShelf{position:absolute;background:#9a6a45;border:3px solid #6e4930;border-radius:4px}.shopCounter{position:absolute;left:56%;top:50%;width:32%;height:17%;background:#8b5d3b;border-radius:6px;border:4px solid #65442e}.homeInterior{position:absolute;left:60%;top:13%;width:26%;height:34%;background:linear-gradient(#ddc083,#c79258);border:4px solid #7d5739;border-radius:8px}.bed{position:absolute;background:#f7f7f7;border:3px solid #7b5f43;border-radius:8px}.rug{position:absolute;background:#d1b27e;border:3px solid #8a684a;border-radius:50%}
.windowMsg{position:absolute;left:12px;right:12px;bottom:12px;z-index:5}
/* Store scene */
.storeMap{position:relative;height:620px;background:linear-gradient(#c39b61,#ac7d4e)}.storeFloor{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#c89561 0 26px,#b78453 26px 28px),repeating-linear-gradient(0deg,#c89561 0 26px,#b78453 26px 28px)}.storeBackWall{position:absolute;left:0;right:0;top:0;height:120px;background:#8b5f39}.counterBig{position:absolute;right:8%;bottom:20%;width:30%;height:18%;background:#7a5034;border:4px solid #533823;border-radius:8px}.shelfRack{position:absolute;background:#764c31;border:4px solid #533823;border-radius:6px}.product{position:absolute;width:16px;height:16px;border-radius:50%;background:#b33;box-shadow:18px 0 0 #e88,36px 0 0 #69c,0 18px 0 #7b5,18px 18px 0 #d9c25d,36px 18px 0 #9c6ad7}
.customerBubble{position:absolute;background:#fff;border:2px solid #c9d6cc;border-radius:12px;padding:4px 7px;font-size:10px;font-weight:900;box-shadow:0 3px 9px #0002}
/* Dungeon */
.adventureMap{padding:12px;background:#f4f6f1}.dungeonHud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.dungeonHud .tag{background:#eef5ef;color:#234a35}.adventureStage{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px;align-items:start}.boardWrap{background:#fff;border:3px solid #294032;border-radius:14px;padding:8px}.board{display:grid;grid-template-columns:repeat(12,1fr);aspect-ratio:12/8;gap:0;border:4px solid #1a2d21;border-radius:10px;overflow:hidden;background:#1f3c28}.tile{position:relative;min-height:0;border-right:1px solid #6c805f;border-bottom:1px solid #6c805f}.tile.floor{background:#bfdc9b}.tile.wall{background:#4a6847}.tile.gather{background:#cae7b0}.tile.stairs{background:#d9bf77}.tile.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0 75%,#00000008 100%)}.tile.wall::after{content:"";position:absolute;inset:3px;background:radial-gradient(circle at 30% 30%,#577955 0 20%,transparent 21%),radial-gradient(circle at 70% 65%,#3e5d3e 0 22%,transparent 23%)}.leaf{position:absolute;left:50%;top:50%;width:14px;height:9px;background:#68a359;border-radius:10px 10px 10px 0;transform:translate(-50%,-50%) rotate(-25deg);box-shadow:8px 6px 0 #79b96c}.stairsIcon{position:absolute;left:50%;top:50%;width:26px;height:18px;transform:translate(-50%,-50%);border:3px solid #8f693b;border-top:none;background:repeating-linear-gradient(0deg,#e0c27f 0 3px,#c5944f 3px 6px)}
.boardChar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}.boardChar img{width:34px;height:48px;object-fit:cover;border-radius:6px;box-shadow:0 1px 0 #0004}.boardEnemy img{width:36px;height:48px;object-fit:cover;border-radius:6px;box-shadow:0 1px 0 #0004}.boardEnemy .label{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#fff;border:1px solid #b44;border-radius:8px;padding:1px 5px;font-size:8px;font-weight:900;white-space:nowrap}.boardPlayerSprite{position:relative;width:34px;height:48px}.boardPlayerSprite .shadow{position:absolute;left:7px;right:7px;bottom:1px;height:8px;background:#0002;border-radius:50%}.boardPlayerSprite .head{position:absolute;left:9px;top:2px;width:16px;height:15px;border-radius:8px;background:#e2b48c;border:2px solid #8b5e3d}.boardPlayerSprite .hair{position:absolute;left:8px;top:1px;width:18px;height:10px;border-radius:9px 9px 3px 3px;background:#4d3321}.boardPlayerSprite .body{position:absolute;left:8px;top:18px;width:18px;height:16px;border-radius:4px;background:#4377ce;border:2px solid #2d4d86}.boardPlayerSprite .legs{position:absolute;left:10px;top:34px;width:6px;height:10px;background:#61442d;border-radius:2px;box-shadow:8px 0 0 #61442d}.boardPlayerSprite .arms{position:absolute;left:4px;top:20px;width:26px;height:6px;background:linear-gradient(90deg,#e2b48c 0 18%,#4377ce 18% 82%,#e2b48c 82% 100%);border-radius:3px}
.adventureSide{display:grid;gap:10px}.dirPad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dirPad button{height:50px;border:2px solid #bfd2c3;background:linear-gradient(#fff,#eff5f0);border-radius:12px;font-size:22px;font-weight:1000;color:#23513a}.dirPad .up{grid-column:2}.msgCompact{background:#f1f7f2;border:1px solid #d2dfd4;border-radius:10px;padding:7px;font-size:10px;line-height:1.45;min-height:140px;max-height:200px;overflow:auto}
/* modal */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#153b2de8;color:#fff;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:900;box-shadow:0 8px 28px #0005;pointer-events:none;opacity:0;transition:opacity .2s}.toast.on{opacity:1}.modal{position:fixed;inset:0;z-index:90;background:#07160fbd;display:grid;place-items:center;padding:16px}.modalPanel{width:min(500px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 25px 70px #0008}.modalPanel h2{margin:0 0 8px}.modalActions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.partnerGrid,.choiceGrid{display:grid;grid-template-columns:1fr;gap:8px}.partnerCard,.choiceCard{border:2px solid #d7e3d9;background:#fff;border-radius:14px;padding:8px;text-align:left;display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center}.partnerCard.on{border-color:#2a8a59;background:#edf9f1}.partnerCard img,.choiceCard img{width:48px;height:68px;object-fit:cover;border-radius:7px;background:#eef}.badge{display:inline-block;border-radius:999px;background:#eaf1ec;padding:2px 6px;font-size:9px;font-weight:900;margin:2px 2px 0 0}
.muted{color:#667b6e;font-size:11px}.miniBtn{border:1px solid #c6d6c9;background:#f8fbf8;border-radius:9px;padding:6px 9px;font-size:10px;font-weight:900;color:#2f5a3e}
@media (max-width:900px){.sceneWrap{grid-template-columns:1fr}.sidePanel{border-left:none;border-top:1px solid #d6e2d8}.scenePanel,.townMap,.storeMap{min-height:420px;height:420px}.adventureStage{grid-template-columns:1fr}.adventureSide{grid-template-columns:1fr 1fr}.windowMsg{right:8px;left:8px;bottom:8px}.boardWrap{padding:6px}}
@media (max-width:640px){main{padding:8px}.gameHeader{padding:8px 10px}.scenePanel,.townMap,.storeMap{min-height:360px;height:360px}.sidePanel{padding:8px}.window{padding:8px}.menuBtn{padding:8px 10px}.adventureSide{grid-template-columns:1fr}.windowMsg{font-size:10px}.brand b{font-size:18px}}
</style>
</head>
<body>
<header><div class="head"><div id="frontierUserHost"></div><div class="brand"><b>Frenda Frontier</b><small id="appVerLabel">Ver0.04 / TEST</small></div><div class="headStats" id="headStats"></div></div></header>
<main>
  <div class="notice">🧪 Ver0.04：人間表現を改善し、下部説明欄中心の構成を廃止しました。コマンド選択中心の1画面完結型TESTです。既存Simulator／Dungeon／Expeditionのデータは変更しません。</div>
  <div class="topNav" id="mainNav">
    <button class="on" data-view="home">🏠 拠点</button>
    <button data-view="adventure">🗺️ 冒険</button>
    <button data-view="store">🏪 お店</button>
  </div>
  <section class="gameFrame">
    <div class="gameHeader"><div><h2 id="viewTitle">拠点</h2><div class="sub" id="viewSubtitle"></div></div><div class="sub" id="viewMeta"></div></div>
    <div id="viewHome" class="sceneWrap view">
      <div class="scenePanel" id="homeScene"></div>
      <aside class="sidePanel">
        <div class="window"><h3>🎯 いまの目標</h3><p id="goalText"></p></div>
        <div class="window"><h3>📜 コマンド</h3><div class="menuList" id="homeCommands"></div><div class="cmdNote">必要なことは右のコマンドで進めます。くわしい説明は会話ウィンドウに出ます。</div></div>
        <div class="window"><h3>💬 会話・ヒント</h3><div class="msgLog" id="homeLog"></div></div>
      </aside>
    </div>
    <div id="viewAdventure" class="sceneWrap view hidden">
      <div class="scenePanel adventureMap" id="adventureScene"></div>
      <aside class="sidePanel adventureSide">
        <div class="window"><h3>🎮 行動</h3><div class="menuList" id="advCommands"></div><div class="dirPad"><button class="up" data-move="0,-1">▲</button><button data-move="-1,0">◀</button><button data-move="0,1">▼</button><button data-move="1,0">▶</button></div></div>
        <div class="window"><h3>💬 ログ</h3><div class="msgCompact" id="advLog"></div></div>
      </aside>
    </div>
    <div id="viewStore" class="sceneWrap view hidden">
      <div class="scenePanel" id="storeScene"></div>
      <aside class="sidePanel">
        <div class="window"><h3>🏪 お店のようす</h3><p id="storeSummary"></p></div>
        <div class="window"><h3>📜 コマンド</h3><div class="menuList" id="storeCommands"></div></div>
        <div class="window"><h3>💬 店の声</h3><div class="msgLog" id="storeLog"></div></div>
      </aside>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="../common/frenda-user.js"></script>
<script src="../common/frenda-data.js"></script>
<script src="../master/frenda-master.js"></script>
<script src="frontier-data.js"></script>
<script src="frontier-save.js"></script>
<script src="frontier-core.js"></script>
<script src="frontier-ui.js"></script>
</body>
</html>
