<!doctype html>
<html lang="ja" data-app-version="0.10">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frenda Frontier Ver0.10</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#e7eee8;color:#173126}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--green:#1b6b43;--line:#c9d8cc;--shadow:0 10px 28px #143c2618;--navy:#102544}
header{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#164f35,#277c50);color:#fff;padding:8px 12px;box-shadow:0 2px 10px #0003}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px}.brand{display:flex;flex-direction:column;min-width:0}.brand b{font-size:21px;line-height:1.1}.brand small{font-size:10px;opacity:.84}.headStats{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{background:#ffffff1c;border:1px solid #ffffff35;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
main{max-width:980px;margin:auto;padding:12px}.notice{background:#fff7d5;border:1px solid #e0c766;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800;margin-bottom:10px}.topNav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.topNav button{flex:0 0 auto;border:1px solid #bfd2c3;background:#fff;color:#234a35;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900}.topNav button.on{background:#1e6c45;color:#fff;border-color:#1e6c45}
.gameFrame{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.gameHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(#f8fbf8,#eef5ef);border-bottom:1px solid #d6e2d8}.gameHeader h2{margin:0;font-size:16px}.sub{font-size:11px;color:#5f7466}.sceneHolder{position:relative;overflow:hidden;background:#e7efe9}.gameScene{position:relative;height:min(78vh,760px);min-height:560px;overflow:hidden;background:#c8dfc0}
.sceneHud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:5}.miniTags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#123726dd;color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;backdrop-filter:blur(4px)}
.sceneArt{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}.spriteLayer{position:absolute;inset:0;z-index:4;pointer-events:none}
.dialogBox,.commandBox{position:absolute;z-index:8;background:var(--navy);color:#fff;border:4px solid #d5e0f2;border-radius:16px;box-shadow:0 10px 28px #0005}.dialogBox{left:12px;right:158px;bottom:12px;min-height:108px;padding:12px}.dialogBox h3{margin:0 0 8px;font-size:14px;color:#fff}.dialogBox p{margin:0;font-size:14px;line-height:1.7;white-space:pre-line}.commandBox{right:12px;bottom:12px;width:132px;padding:10px}.commandTitle{font-size:12px;font-weight:900;margin:0 0 8px}.cmdList{display:grid;gap:6px}.cmdBtn{width:100%;text-align:left;padding:7px 8px;border-radius:10px;border:1px solid #8fa7d1;background:linear-gradient(#214374,#173059);color:#fff;font-weight:900;font-size:12px}.cmdBtn.primary{background:linear-gradient(#2f7d5f,#1d6348);border-color:#70b395}.cmdBtn.warn{background:linear-gradient(#a96639,#864b28);border-color:#d79d6e}.cmdBtn:disabled{opacity:.5;cursor:not-allowed}
.hudStrip{position:absolute;left:12px;right:12px;top:12px;z-index:9;display:flex;gap:8px;flex-wrap:wrap}.hudPill{background:var(--navy);color:#fff;border:3px solid #d5e0f2;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:900}
.humanWrap{position:absolute;width:58px;height:76px;z-index:5;transform:translate(-50%,-100%)}.humanWrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 7px rgba(0,0,0,.2))}.humanWrap.kid{transform:translate(-50%,-100%) scale(.88)}
.partnerSprite,.enemySprite{position:absolute;z-index:5;transform:translate(-50%,-100%)}.partnerSprite img,.enemySprite img{width:44px;height:58px;object-fit:cover;border-radius:8px;box-shadow:0 3px 10px #0004;background:#fff8}.enemyLabel{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2px solid #b54747;color:#6e2323;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}
.boardWrap{position:absolute;left:12px;right:158px;top:54px;bottom:132px;background:#3e6137;border:4px solid #d5e0f2;border-radius:18px;padding:8px;overflow:hidden;z-index:3}.board{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:1fr;height:100%;border-radius:12px;overflow:hidden;background:#35572f}.tile{position:relative}.tile.floor{background:#a8c67c}.tile.gather{background:#b7d492}.tile.stairs{background:#c7ae70}.tile.wall{background:#456742}.tile.floor:after,.tile.gather:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#ffffff18 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,#00000008 0 10%,transparent 11%)}.tile.wall:after{content:"";position:absolute;inset:2px;background:radial-gradient(circle at 25% 25%,#52784f 0 18%,transparent 19%),radial-gradient(circle at 75% 75%,#335132 0 18%,transparent 19%)}.leaf{position:absolute;left:50%;top:50%;width:16px;height:9px;background:#68a359;border-radius:10px 10px 10px 0;transform:translate(-50%,-50%) rotate(-25deg);box-shadow:8px 5px 0 #79b96c}.stairsIcon{position:absolute;left:50%;top:50%;width:28px;height:18px;transform:translate(-50%,-50%);border:3px solid #7f5e35;border-top:none;background:repeating-linear-gradient(0deg,#ddc47e 0 4px,#c28c4a 4px 8px)}.tapHint{position:absolute;right:12px;top:12px;z-index:5;background:#102544cc;color:#fff;border:3px solid #d5e0f2;border-radius:12px;padding:6px 9px;font-size:10px;font-weight:900}.dirPad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}.dirPad button{height:34px;border-radius:8px;border:1px solid #8fa7d1;background:#214374;color:#fff;font-weight:900}.dirPad .up{grid-column:2}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#153b2de8;color:#fff;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:900;box-shadow:0 8px 28px #0005;pointer-events:none;opacity:0;transition:opacity .2s}.toast.on{opacity:1}.modal{position:fixed;inset:0;z-index:90;background:#07160fbd;display:grid;place-items:center;padding:16px}.modalPanel{width:min(520px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 25px 70px #0008}.modalPanel h2{margin:0 0 8px}.modalActions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}.partnerGrid,.choiceGrid{display:grid;grid-template-columns:1fr;gap:8px}.partnerCard,.choiceCard{border:2px solid #d7e3d9;background:#fff;border-radius:14px;padding:8px;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}.partnerCard.on{border-color:#2a8a59;background:#edf9f1}.partnerCard img,.choiceCard img{width:52px;height:72px;object-fit:cover;border-radius:7px;background:#eef}.badge{display:inline-block;border-radius:999px;background:#eaf1ec;padding:2px 6px;font-size:9px;font-weight:900;margin:2px 2px 0 0}
@media (max-width:640px){main{padding:8px}.brand b{font-size:18px}.gameScene{height:min(72vh,700px);min-height:520px}.dialogBox{right:118px;min-height:94px;padding:10px}.dialogBox h3{font-size:12px}.dialogBox p{font-size:12px}.commandBox{width:98px;padding:8px}.cmdBtn{padding:6px 6px;font-size:11px}.boardWrap{right:114px;bottom:118px}.tag,.hudPill{font-size:10px;padding:5px 8px}.humanWrap{width:45px;height:60px}.partnerSprite img,.enemySprite img{width:34px;height:46px}.notice{font-size:10px}}
</style>
</head>
<body>
<header><div class="head"><div id="frontierUserHost"></div><div class="brand"><b>Frenda Frontier</b><small id="appVerLabel">Ver0.10 / TEST</small></div><div class="headStats" id="headStats"></div></div></header>
<main>
  <div class="notice">🧪 Ver0.10：町の生活感、家の生活小物、店の来客と商品表現を追加しました。人物の密度と店内の賑わいを上げ、見ているだけでも町と商売の様子が分かる方向へ強化したTEST版です。既存Simulator／Dungeon／Expeditionのデータは変更しません。</div>
  <div class="topNav" id="mainNav">
    <button class="on" data-view="home">🏠 拠点</button>
    <button data-view="adventure">🗺️ 冒険</button>
    <button data-view="store">🏪 お店</button>
  </div>
  <section class="gameFrame">
    <div class="gameHeader"><div><h2 id="viewTitle">拠点</h2><div class="sub" id="viewSubtitle"></div></div><div class="sub" id="viewMeta"></div></div>
    <div class="sceneHolder"><div id="sceneMount" class="gameScene"></div></div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script>
(()=>{const v=document.documentElement.dataset.appVersion||"0";document.write(`<script src="../frenda-test.js?app=${v}"><\/script>`);document.write(`<script src="../frenda-user.js?app=${v}"><\/script>`);for(const f of ["frenda-master.js","frenda-data.js"])document.write(`<script src="../../${f}?app=${v}"><\/script>`);})();
</script>
<script>(()=>{const v=document.documentElement.dataset.appVersion||"0";for(const f of ["frontier-data.js","frontier-save.js","frontier-core.js","frontier-ui.js"])document.write(`<script src="${f}?v=${encodeURIComponent(v)}"><\/script>`);})();</script>
</body>
</html>
