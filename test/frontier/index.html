<body>
<header><div class="head"><div id="frontierUserHost"></div><div class="brand"><b>Frenda Frontier</b><small id="appVerLabel">Ver0.06 / TEST</small></div><div class="headStats" id="headStats"></div></div></header>
<main>
  <div class="notice">🧪 Ver0.06：家・建物・人の見た目を、参考イメージに近づけて強化しました。コマンド選択中心の1画面完結型TESTです。既存Simulator／Dungeon／Expeditionのデータは変更しません。</div>
  <div class="topNav" id="mainNav">

  </section>
</main>
