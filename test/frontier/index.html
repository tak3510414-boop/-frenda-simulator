<!doctype html>
<html lang="ja" data-app-version="0.14">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frenda Frontier Ver0.14</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#e7eee8;color:#173126}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--green:#1b6b43;--line:#c9d8cc;--navy:#0d203b;--navy2:#18365f}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#164f35,#277c50);color:#fff;padding:8px 12px;box-shadow:0 2px 10px #0003}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px}.brand{display:flex;flex-direction:column}.brand b{font-size:20px;line-height:1.05}.brand small{font-size:10px;opacity:.85}.headStats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#ffffff1d;border:1px solid #ffffff32;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
main{max-width:920px;margin:auto;padding:9px}.notice{background:#fff7d6;border:1px solid #ddc65f;border-radius:12px;padding:8px 10px;font-size:10px;font-weight:800;margin-bottom:8px}.topNav{display:flex;gap:7px;padding:2px 0 8px}.topNav button{border:1px solid #bfd2c3;background:#fff;color:#244c36;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900}.topNav button.on{background:#1e6c45;color:#fff;border-color:#1e6c45}
.gameFrame{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 28px #143c2618}.gameHeader{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:linear-gradient(#f9fbf9,#eef4ef);border-bottom:1px solid #d7e2d9}.gameHeader h2{margin:0;font-size:15px}.sub{font-size:10px;color:#617469}.sceneHolder{position:relative;background:#111}.gameScene{position:relative;width:min(100%,570px);aspect-ratio:3/4;margin:0 auto;overflow:hidden;background:#20372a}.sceneCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#20372a}
.sceneHud{position:absolute;z-index:6;left:9px;right:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap}.tag,.hudPill{background:#10283ddd;color:#fff;border:2px solid #d8e3ee;border-radius:9px;padding:4px 7px;font-size:9px;font-weight:900;box-shadow:0 3px 8px #0003}.hudPill{border-radius:8px}
.dialogBox,.commandBox{position:absolute;z-index:12;background:var(--navy);color:#fff;border:3px solid #e0e8f2;border-radius:12px;box-shadow:0 6px 18px #0006}.dialogBox{left:9px;right:116px;bottom:9px;min-height:96px;padding:10px}.dialogBox h3{margin:0 0 6px;font-size:12px}.dialogBox p{margin:0;font-size:11px;line-height:1.65;white-space:pre-line}.commandBox{right:9px;bottom:9px;width:100px;padding:8px}.commandTitle{font-size:11px;font-weight:900;margin:0 0 6px}.cmdList{display:grid;gap:5px}.cmdBtn{width:100%;text-align:left;padding:6px 7px;border-radius:8px;border:1px solid #8199c2;background:linear-gradient(#244a7d,#17345b);color:#fff;font-weight:900;font-size:10px}.cmdBtn.primary{background:linear-gradient(#2f7d5f,#1e6248);border-color:#72b295}.cmdBtn.warn{background:linear-gradient(#a76b41,#824a2c);border-color:#d49c74}.cmdBtn:disabled{opacity:.45;cursor:not-allowed}
#tokenLayer{position:absolute;inset:0;z-index:8;pointer-events:none}.pokemonToken{position:absolute;z-index:9;width:34px;height:34px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 10px #0007;background:#dfe8e2;transform:translate(-50%,-50%)}.pokemonToken img{width:100%;height:100%;object-fit:cover;object-position:center 27%;transform:scale(1.35)}.enemyToken{border-color:#f0b5b5}.partnerToken{border-color:#b9e7c9}.tokenLabel{position:absolute;z-index:10;transform:translate(-50%,0);background:#fff;border:2px solid #b44;color:#722;border-radius:999px;padding:1px 5px;font-size:8px;font-weight:900;white-space:nowrap}
.dirPad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px}.dirPad button{height:28px;border-radius:7px;border:1px solid #8199c2;background:#244a7d;color:#fff;font-weight:900;font-size:11px}.dirPad .up{grid-column:2}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#153b2de8;color:#fff;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:900;box-shadow:0 8px 28px #0005;pointer-events:none;opacity:0;transition:.2s}.toast.on{opacity:1}.modal{position:fixed;inset:0;z-index:90;background:#07160fbd;display:grid;place-items:center;padding:16px}.modalPanel{width:min(520px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 25px 70px #0008}.modalPanel h2{margin:0 0 8px}.modalActions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}.partnerGrid,.choiceGrid{display:grid;grid-template-columns:1fr;gap:8px}.partnerCard,.choiceCard{border:2px solid #d7e3d9;background:#fff;border-radius:14px;padding:8px;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}.partnerCard.on{border-color:#2a8a59;background:#edf9f1}.partnerCard img,.choiceCard img{width:52px;height:72px;object-fit:cover;border-radius:7px;background:#eef}.badge{display:inline-block;border-radius:999px;background:#eaf1ec;padding:2px 6px;font-size:9px;font-weight:900;margin:2px 2px 0 0}
@media(min-width:700px){.gameScene{width:min(100%,570px)}.dialogBox{right:155px;min-height:112px}.commandBox{width:136px}.dialogBox h3{font-size:14px}.dialogBox p{font-size:13px}.cmdBtn{font-size:12px}.commandTitle{font-size:12px}.pokemonToken{width:44px;height:44px}}
@media(max-width:640px){.notice{display:none}main{padding:7px}.topNav{padding-top:1px}.gameHeader{padding:7px 10px}}
</style>
</head>
<body>
<header><div class="head"><div id="frontierUserHost"></div><div class="brand"><b>Frenda Frontier</b><small>Ver0.14 / TEST</small></div><div class="headStats" id="headStats"></div></div></header>
<main>
 <div class="notice">🧪 Ver0.14：町1画面をさらに重点改修。建物を屋根・壁・窓・扉・看板まで再描画し、樹木・植栽・石畳・噴水・露店・街灯・ベンチ・箱・樽・NPCの密度と陰影を強化しました。家・店・冒険はVer0.13の動作を維持しています。既存Simulator／Dungeon／Expeditionのデータは変更しません。</div>
 <div class="topNav" id="mainNav"><button class="on" data-view="home">🏠 拠点</button><button data-view="adventure">🗺️ 冒険</button><button data-view="store">🏪 お店</button></div>
 <section class="gameFrame"><div class="gameHeader"><div><h2 id="viewTitle">拠点</h2><div class="sub" id="viewSubtitle"></div></div><div class="sub" id="viewMeta"></div></div><div class="sceneHolder"><div id="sceneMount" class="gameScene"></div></div></section>
</main>
<div id="toast" class="toast"></div>
<script>
(()=>{const v=document.documentElement.dataset.appVersion||"0";document.write(`<script src="../frenda-test.js?app=${v}"><\/script>`);document.write(`<script src="../frenda-user.js?app=${v}"><\/script>`);for(const f of ["frenda-master.js","frenda-data.js"])document.write(`<script src="../../${f}?app=${v}"><\/script>`);})();
</script>
<script>(()=>{const v=document.documentElement.dataset.appVersion||"0";for(const f of ["frontier-data.js","frontier-save.js","frontier-core.js","frontier-render.js","frontier-ui.js"])document.write(`<script src="${f}?v=${encodeURIComponent(v)}"><\/script>`);})();</script>
</body>
</html>
