<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Frenda Frontier 町の発展確認 Ver1.63</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eee7;color:#153c2a;font-family:system-ui,sans-serif}header{background:#1d704b;color:white;padding:16px}h1{font-size:22px;margin:0}small{font-size:12px}.controls{max-width:1000px;margin:12px auto;padding:0 12px;display:flex;gap:8px;flex-wrap:wrap}select{flex:1;min-width:220px;padding:10px;border-radius:12px;font-size:16px}button{background:#234f80;color:#fff;border:1px solid #a9bdd2;border-radius:10px;padding:10px 14px;font-weight:bold;font-size:14px}main{max-width:1000px;margin:10px auto;border-radius:14px;background:#f8fbf8;overflow:hidden}#viewTitle{font-size:15px;margin:8px 12px}#viewSubtitle,#viewMeta{font-size:12px;margin:4px 12px}canvas{image-rendering:pixelated}.note{max-width:1000px;margin:10px auto;padding:0 12px;font-size:13px;line-height:1.6}</style>
<header><h1>Frenda Frontier</h1><small>町の発展確認 Ver1.63</small></header><div class="controls"><button id="prev">◀ 前の段階</button><select id="stage" aria-label="町の発展段階"></select><button id="next">次の段階 ▶</button></div><main><h2 id="viewTitle"></h2><div id="viewSubtitle"></div><div id="viewMeta"></div><div id="map"></div></main><p class="note">全9段階を順番に確認できます。道をタップすると移動し、施設をタップすると入口へ向かいます。施設の名称・外観を確認する専用画面です。この画面では通常のプレーデータを読み書きしません。</p>
<script>window.FRENDA_FRONTIER={WILDERNESS:{overview:true}};</script><script src="frontier-town-progress.js?v=1.63"></script><script>
(()=>{const F=window.FRENDA_FRONTIER,P=F.TOWN_PROGRESS,select=document.getElementById('stage');let current=0;F.readSave=()=>({story:{opening:{townPreviewStage:current}},development:{town:{facilities:{shop:P.stages[current].lv}}}});select.innerHTML=P.stages.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');const draw=()=>{select.value=String(current);P.position={x:500,y:155};document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===8;P.mount(document.getElementById('map'),draw,{shop:()=>{document.getElementById('progressMessage').textContent='この画面では外観と移動を確認できます。店内は本体のお店画面から確認してください。'}})};select.onchange=()=>{current=Number(select.value);draw()};document.getElementById('prev').onclick=()=>{current=Math.max(0,current-1);draw()};document.getElementById('next').onclick=()=>{current=Math.min(8,current+1);draw()};draw();})();
</script><!-- Updated: 2026-10-25 JST / Ver1.63 --></html>
