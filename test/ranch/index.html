<style>

padding:8px;border-radius:11px;border:1px solid #d7e7da;background:#f7faf7;font-size:11px}.facilityCard.locked{opacity:.55;filter:grayscale(.4)}.facilityCard b{display:block;font-size:12px;margin-bottom:2px}.diary{margin-top:10px;background:#fff;border:1px solid #cfe1d3;border-radius:14px;padding:10px 12px}.diary h3{margin:0 0 8px;font-size:13px}.diaryList{display:grid;gap:7px}.diaryEntry{background:#f7faf7;border:1px solid #dfeae1;border-radius:11px;padding:8px 10px;font-size:11px;line-height:1.5}.diaryEntry.important{background:#fff9df;border-color:#e8d88a}.diaryHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.diaryHead small{color:#708176;white-space:nowrap}.diaryEmpty{font-size:11px;color:#708176}.foot{margin-top:10px;font-size:11px;color:#607468;line-height:1.6}@media(max-width:700px){main{padding:8px}.status{grid-template-columns:1fr 1fr}.pasture{min-height:520px;border-radius:16px}.mon{width:74px}.mon img{width:58px;height:82px}.title{font-size:17px}}

.profileCard{background:#fff;border:1px solid #d6e5d8;border-radius:16px;padding:12px;margin:8px 0}
.profileHead{display:flex;gap:12px;align-items:center}.profileHead img{width:72px;height:96px;object-fit:contain;border-radius:10px}
.profileMeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.profileChip{background:#eef7ef;border:1px solid #d1e3d4;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}
.memoryList{margin-top:9px;display:grid;gap:6px}.memoryItem{background:#f7faf7;border:1px solid #dce8de;border-radius:10px;padding:8px;font-size:12px}.memoryItem.important{background:#fff9df;border-color:#ead27a}.memoryItem small{float:right;color:#718078}

<body>
<header><div class="head"><div><span class="title">🌿 フレンダ牧場</span> <span class="ver">Ver0.30 / プロフィール・思い出アルバム</span></div><div class="userHost headerTop" id="userHost"></div></div></header>
<main>
<div class="notice">🧪 独立テスト版です。本編データは読み取り専用で、Dungeon / Expedition / Simulator へ書き込みません。</div>
<section class="status"><div class="stat"><small>本編所持</small><b id="ownedCount">-</b></div><div class="stat"><small>牧場登録</small><b id="registryCount">-</b></div><div class="stat"><small>表示中</small><b id="residentCount">-</b></div><div class="stat"><small>保存</small><b id="saveState">-</b></div></section>
<section class="pasture" id="pasture"><div id="facilityLayer"></div><div class="socialLayer" id="socialLayer"></div><div class="empty" id="empty">本編データを確認しています…</div></section>
<section class="relations"><h3>🕒 牧場環境</h3><div class="relationList" id="environmentList">読み込み中…</div></section>
<section class="relations" id="offlineBox" style="display:none"><h3>🏡 留守中のようす</h3><div class="relationList" id="offlineList"></div></section>
<section class="relations"><h3>🌱 牧場の発展</h3><div class="relationList" id="developmentList">読み込み中…</div><div class="facilityGrid" id="facilityList"></div></section>
<section class="diary"><h3>📖 牧場日記</h3><div class="diaryList" id="diaryList"></div></section>
<section class="relations"><h3>🐾 ポケモンの個性・生活経験</h3><div class="groupList" id="individualList">読み込み中…</div></section><section class="relations"><h3>📚 プロフィール・思い出アルバム</h3><div class="groupList" id="profileList">読み込み中…</div></section>
<section class="relations"><h3>👥 いつもの仲間</h3><div class="groupList" id="groupList">まだグループはできていません。</div></section>
<section class="relations"><h3>🤝 なかま関係</h3><div class="relationList" id="relationList">まだ交流記録はありません。</div></section>
<div class="foot" id="detail"></div>
</main>
<script>
(()=>{const v=document.documentElement.dataset.appVersion||"0";document.write(`<script src="../frenda-test.js?app=${v}"><\/script>`);document.write(`<script src="../frenda-user.js?app=${v}"><\/script>`);document.write(`<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>`);document.write(`<script src="../frenda-cloud-test.js?app=${v}"><\/script>`);for(const f of ["frenda-master.js","frenda-data.js"])document.write(`<script src="../../${f}?app=${v}"><\/script>`);})();

<script>
window.RANCH_CLOUD_READY=(async()=>{
  try{
    if(window.FrendaCloud) await window.FrendaCloud.init({app:"ranch",label:"フレンダ牧場",accountOnly:true,unifiedEntryOnly:true,column:"dungeon_data",getData:()=>window.FRENDA_USER?.readCloudCache?.()??null});
  }catch(e){console.warn("RANCH_USER_INIT",e)}
})();
</script>
