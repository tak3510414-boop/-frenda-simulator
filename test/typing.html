/* Ver03 ― narrative staging, exploration and animated UI. Pure CSS: no extra files. */
:root{--glow:rgba(255,221,130,.35)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 13%,#84d8f00c,transparent 34%);z-index:0}
.wrap{position:relative;z-index:1}
.btn:focus-visible,.navbtn:focus-visible,.soundButton:focus-visible{outline:3px solid #fee38f;outline-offset:2px}
.soundButton{border:1px solid #556e86;background:#213953;color:#eff8ff;border-radius:99px;padding:8px 11px;min-height:34px;font-size:12px;cursor:pointer;white-space:nowrap}
.soundButton:hover{background:#2c4b6e}
.eyebrow{color:#ffd77e;font-size:11px;font-weight:900;letter-spacing:.14em}
.questBanner{border:1px solid #758b83;border-radius:18px;padding:18px 20px;margin-bottom:15px;background:linear-gradient(105deg,#274e4f,#233b56 60%,#1d344f);box-shadow:inset 0 0 38px #a4e8be0c}
.questBanner h3{margin:5px 0;font-size:21px}.questBanner p{font-size:13px;color:#c6dadd;margin:0 0 10px}
.mapGrid .zone{border-color:#455c70;background:linear-gradient(130deg,#254261,#1d304b)}
.zoneTop{display:flex;align-items:start;justify-content:space-between}
.zoneStyle0{background:linear-gradient(132deg,#244c41,#1c324d)!important}
.zoneStyle1{background:linear-gradient(132deg,#204f43,#1b3149)!important}
.zoneStyle2{background:linear-gradient(132deg,#544a4a,#24354b)!important}
.zoneStyle3{background:linear-gradient(132deg,#575041,#263a54)!important}
.zoneStyle4{background:linear-gradient(132deg,#1d526b,#20394d)!important}
.zoneStyle5{background:linear-gradient(132deg,#1d5877,#223d54)!important}
.zoneStyle6{background:linear-gradient(132deg,#302e66,#213651)!important}
.zoneStyle7{background:linear-gradient(132deg,#514073,#293658)!important;border-color:#9680d0!important}
.zone.locked{filter:saturate(.64)}
.zone:before{right:0}
.zone:not(.locked):hover{border-color:#aaccc5!important;box-shadow:0 10px 30px #0002}
.zone .tag{font-size:10px;letter-spacing:.08em}
.immersive{margin-top:22px}
.cinema{position:relative;max-width:1020px;margin:0 auto;min-height:620px;border:1px solid #7a92ab55;border-radius:24px;overflow:hidden;text-align:center;padding:36px 28px 42px;background:radial-gradient(ellipse at 50% 40%,#36587699,transparent 55%),linear-gradient(150deg,#122540,#10243d 60%,#18243d);box-shadow:0 24px 80px #0005}
.cinema:before{content:"";position:absolute;width:410px;height:410px;border-radius:50%;left:50%;top:120px;transform:translateX(-50%);background:radial-gradient(circle,#ffd98b18,transparent 68%);pointer-events:none}
.cinemaTop{position:relative;color:#ffdb8a;letter-spacing:.15em;font-size:14px;font-weight:800}
.cinemaTop span{color:#bddbe7;display:block;margin-top:9px;letter-spacing:.16em;font-size:12px}
.cinemaEmblem{position:relative;display:grid;place-items:center;width:170px;height:170px;margin:45px auto 26px;border:2px solid #ffe8a955;border-radius:50%;color:#ffe4a3;font-size:75px;background:radial-gradient(circle,#f1d0812a,#31486444);animation:gentleFloat 3.8s ease-in-out infinite;box-shadow:0 0 60px #ffd68029}
.cinemaChapter{font-size:24px;font-weight:900;margin-bottom:24px;text-shadow:0 4px 16px #0008}
.starfield span{position:absolute;color:#ffdfb9;opacity:.5;font-size:22px;animation:twinkle 3s ease-in-out infinite;pointer-events:none}
.starfield span:nth-child(1){left:13%;top:19%}.starfield span:nth-child(2){right:18%;top:25%;animation-delay:1.2s}.starfield span:nth-child(3){left:26%;top:52%;animation-delay:.6s}.starfield span:nth-child(4){right:24%;top:58%;animation-delay:1.8s}
.dialogBox{position:relative;max-width:680px;margin:auto;background:#0b1e35dd;border:1px solid #6f98af;border-radius:16px;padding:24px 26px;text-align:left;box-shadow:0 12px 36px #0004}
.dialogBox .speaker,.sceneSpeaker{font-size:13px;font-weight:900;color:#ffe4a3;margin-bottom:8px;letter-spacing:.04em}
.dialogBox p,.sceneText{font-size:18px;line-height:2.05;min-height:75px;color:#f0f7ff;margin:8px 0 14px}
.sceneBottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cutscene{position:fixed;inset:0;background:#030a16d9;backdrop-filter:blur(6px);z-index:80;display:flex;align-items:center;justify-content:center;padding:22px}
.sceneCard{width:min(760px,100%);background:radial-gradient(ellipse at 50% 0,#35536d,#152b46 70%);border:1px solid #9cb5bf;border-radius:25px;text-align:center;padding:32px;box-shadow:0 26px 80px #0008;animation:sceneAppear .36s ease-out}
.sceneStars{color:#ffda85;opacity:.6;letter-spacing:1.1em}.sceneIcon{font-size:76px;margin:25px 0 18px;filter:drop-shadow(0 0 30px #e7c16866);animation:gentleFloat 3.5s ease-in-out infinite}
.sceneEpisode{font-size:12px;color:#c5dcdf;letter-spacing:.13em;text-transform:uppercase;margin-bottom:20px}
.sceneSpeaker{text-align:left}.sceneText{text-align:left;min-height:100px}
.journalCard h3{font-size:16px;min-height:41px;margin:5px 0}.journalCard p{min-height:48px}.journalCard.locked{opacity:.58}
.endingPage{min-height:740px;background:radial-gradient(ellipse at 50% 25%,#71678566,transparent 55%),linear-gradient(170deg,#1b2e53,#101f35 62%,#202a46)}
.endingGlow{color:#ffe2a3;font-size:25px;letter-spacing:1em;animation:twinkle 2.4s ease-in-out infinite}
.finalCrest{font-size:95px;color:#fff2c1;margin:20px auto 4px;text-shadow:0 0 45px #ffc06d,0 0 95px #ffc06d;animation:gentleFloat 4s ease-in-out infinite}
.endingPage h2{font-size:28px;margin:28px 0 14px}.endingPage>p{color:#c4dae9;line-height:1.8}
.endingLine{width:80px;height:2px;background:#ffdf9e;margin:26px auto}
.endingCredits{font-size:13px;line-height:2.1;color:#b7d1df;letter-spacing:.08em}
.endingCredits b{color:#fff2c0;font-size:22px}.endingStats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.endingStats span{padding:8px 14px;border:1px solid #817c9c;border-radius:99px;background:#ffffff09;font-size:12px}
.finalBattle{background:radial-gradient(ellipse at 55% 90%,#62457c 0%,#343d74 50%,#1b2746 100%);border-color:#937db2}
.finalBattle .creature.enemy img{animation:bossFloat 3s ease-in-out infinite}
.battleground .creature img{animation:gentleFloat 3.7s ease-in-out infinite}
.battleground .creature.enemy img{animation:bossFloat 3.5s ease-in-out infinite}
.battleLog{border-left:4px solid #edcb80}
.typing:focus-within{box-shadow:0 0 30px #71c6f01f}
@keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bossFloat{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-8px)}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes sceneAppear{from{opacity:0;transform:translateY(13px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:850px){.sidebar .sidecard:first-child{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.sceneCard{padding:22px}}
@media(max-width:540px){.hero .creature{min-width:70px}.hero .creature img{max-width:110px}.cinema{min-height:600px;padding:24px 14px}.cinemaEmblem{margin:30px auto 20px;width:120px;height:120px;font-size:59px}.cinemaChapter{font-size:20px}.dialogBox{padding:16px}.dialogBox p,.sceneText{font-size:15px}.sceneCard{padding:17px}.sceneIcon{font-size:52px;margin:18px 0}.sceneBottom{flex-direction:column;align-items:stretch}.sceneBottom .buttonrow{justify-content:flex-end}.endingPage h2{font-size:21px}.navbtn{font-size:11px}.battleground .creature img{width:100px;height:100px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

function selectPhrase(pool){
 const uniq=[...new Set(pool)].filter(Boolean);
 if(!uniq.length)throw new Error('出題候補がありません');
 const recent=S.recentPrompts||[];
 const fresh=uniq.filter(t=>!recent.slice(0,Math.min(12,Math.max(0,uniq.length-2))).includes(t));
 const candidates=fresh.length?fresh:uniq;
 return candidates[Math.floor(Math.random()*candidates.length)];
}

function toHira(s){
 return [...String(s).normalize('NFKC')].map(c=>{const n=c.charCodeAt(0);return n>=0x30a1&&n<=0x30f6?String.fromCharCode(n-0x60):c}).join('');
}
// 先頭かな（または拗音ペア）の候補と消費するかな文字数。
function romanToken(s,i){
 const pair=s.slice(i,i+2),combined=DIG[pair];
 if(combined){
   const split=(ROMA[s[i]]||[]).flatMap(a=>(ROMA[s[i+1]]||[]).map(b=>a+b));
   return {len:2,forms:[...new Set([...combined,...split])]};
 }
 const c=s[i],forms=ROMA[c]||(/^[a-z0-9!?,.\-/:;\[\]()']$/.test(c)?[c]:null);
 if(!forms)throw new Error('対応していない出題文字: '+c+' (位置 '+i+')');
 return {len:1,forms};
}
function segments(source){
 const s=toHira(source).replace(/[\s　]+/g,'').toLowerCase();
 const out=[];
 for(let i=0;i<s.length;){
   if(s[i]==='っ'&&i+1<s.length){
     const next=romanToken(s,i+1),forms=[];
     for(const r of next.forms){
       if(/^[bcdfghjklmpqrstvwxyz]/.test(r)){
         forms.push(r[0]+r); // っ + ちゃ => ccha / ttya / ccya など、同じ方式で連動
         if(r.startsWith('ch'))forms.push('t'+r); // tcha などIMEで一般的な入力
       }
       for(const small of ROMA['っ'])forms.push(small+r);
     }
     out.push([...new Set(forms)]);i+=next.len+1;continue;
   }
   if(s[i]==='ん'){
     const next=s[i+1];
     // ん+母音/や行は「na→な」「nya→にゃ」などとの混同を防ぐ。
     // 「んな」は nna を許容するため、後続の「な行」では単独の n も認める。
     const ambiguous=!!next&&('あいうえおやゆよゃゅょぁぃぅぇぉ'.includes(next));
     out.push(ambiguous?['nn',"n'",'xn']:['n','nn',"n'",'xn']);i++;continue;
   }
   const tok=romanToken(s,i);out.push(tok.forms);i+=tok.len;
 }
 return out;
}
// 入力済みのキー列に適合する経路を探索。メモ化で長い文章でも安定動作。
// guide はその時点の入力に合う正解候補全文なので、途中で si→shi 等を変更しても追従。
function typingStatus(value,parts){
 const entered=String(value).toLowerCase(),memo=new Map();
 function go(i,pos){
   const key=i+':'+pos;
   if(memo.has(key))return memo.get(key);
   if(i===parts.length)return pos===entered.length?'':null;
   const rest=entered.slice(pos);
   for(const alternative of parts[i]){
     if(rest.startsWith(alternative)){
       const tail=go(i+1,pos+alternative.length);
       if(tail!==null){memo.set(key,alternative+tail);return alternative+tail;}
     }else if(alternative.startsWith(rest)){
       const guide=alternative+parts.slice(i+1).map(a=>a[0]).join('');
       memo.set(key,guide);return guide;
     }
   }
   memo.set(key,null);return null;
 }
 const guide=go(0,0);
 return {valid:guide!==null,complete:guide!==null&&guide===entered,guide};
}

function revealField(zone,x,y){
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
  const a=x+dx,b=y+dy;
  if(Math.abs(dx)+Math.abs(dy)>1||a<0||a>8||b<0||b>6)continue;
  S.visitedTiles[fieldKey(zone,a,b)]=true;
 }
}
function fieldSurvey(zone){const n=MAPS[zone].join('').split('').filter(x=>x!=='#').length;
 const seen=Object.keys(S.visitedTiles).filter(k=>k.startsWith(zone+':')&&fieldAt(...k.split(':').map(Number))!=='#').length;
 return Math.round(seen/Math.max(n,1)*100);
}

function beginFieldTyping(kind,key,phrase){
 if(challenge||battle)return;
 const parts=segments(phrase),romaji=parts.map(p=>p[0]).join(''),lev=difficulty();
 const duration=adjustedDuration(Math.max(8,(lev==='easy'?8:lev==='normal'?6:4.5)+romaji.length*(lev==='easy'?.63:lev==='normal'?.55:.46)));
 rememberPrompt(phrase);challenge={mode:'field',fieldKind:kind,fieldKey:key,phrase,parts,romaji,duration,started:performance.now(),input:'',mistakes:0,localCombo:0,pausedAt:null};
 save();render();tickId=setInterval(updateTimer,80);
}
function finishFieldTyping(ch,success,rank){

  S.stats.fieldClears++;
  if(ch.fieldKind==='C'&&!S.fieldCleared[ch.fieldKey]){markCleared(...ch.fieldKey.split(':').map(Number));S.chests++;S.coins+=20;S.balls+=2;soundFx('catch');fieldNotice={kind:'done',title:'🎁 宝箱を開けた！',text:'20コインとモンスターボール2個を手に入れた！'};}
  else if(ch.fieldKind==='R'&&!S.fieldCleared[ch.fieldKey]){markCleared(...ch.fieldKey.split(':').map(Number));S.runes++;S.coins+=30;soundFx('badge');fieldNotice={kind:'done',title:'🔮 石碑が輝いた！',text:'ことばのかけらを集めた！ 30コインを手に入れた。'};}
  else if(ch.fieldKind==='H'){S.roster.forEach(m=>m.hp=Math.min(maxHp(m),m.hp+Math.round(maxHp(m)*.35)));soundFx('heal');fieldNotice={kind:'done',title:'💧 回復成功',text:'仲間たちのHPが35%回復した！'};}
  else if(ch.fieldKind==='N'){const zone=Number(ch.fieldKey.split(':')[0]),m=NPC_MISSIONS[zone];if(m&&!S.npcHelped.includes(zone)){S.npcHelped.push(zone);S.coins+=m.coins;S.balls+=m.balls;S.potions+=m.potions;soundFx('badge');fieldNotice={kind:'done',title:'💬 '+m.name+'を達成！',text:m.who+'から '+m.coins+'コイン'+(m.balls?'、ボール'+m.balls+'個':'')+(m.potions?'、キズぐすり'+m.potions+'個':'')+'を受け取った。'};}}
  else if(ch.fieldKind==='practice'){S.coins+=Math.min(15,5+(rank==='S'?10:rank==='A'?6:0));soundFx('victory');fieldNotice={kind:'done',title:'🎯 練習終了',text:`評価${rank}！ 練習報酬としてコインを受け取った。`};}
 }else{soundFx('mistake');fieldNotice={kind:'failed',title:'⌨️ あと少し！',text:'時間内に完成しなかった。失敗してもペナルティはありません。',fieldKind:ch.fieldKind,fieldKey:ch.fieldKey,phrase:ch.phrase};}
 save();render();
}
function choosePractice(mode){
 const sets=mode==='long'?[...LONG,...MORE_LONG,...EXTRA_LONG]:mode==='basic'?[...SHORT,...MORE_SHORT,...EXTRA_SHORT]:[...FIELD_WORDS.practice,...MIDDLE,...MORE_MIDDLE,...EXTRA_MIDDLE];
 if(mode==='weak'){
   const weak=Object.entries(S.weakKeys).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
   if(weak.length){const candidates=[...SHORT,...EXTRA_SHORT,...MIDDLE,...EXTRA_MIDDLE,...LONG,...EXTRA_LONG,...FIELD_WORDS.practice].filter(w=>weak.some(k=>segments(w).map(x=>x[0]).join('').includes(k)));if(candidates.length)return selectPhrase(candidates);}
 }

 return `<section class="trialPanel"><h3>🏆 クリア後：記憶の試練</h3><p>イワーク → ギャラドス → ミュウツーとの3連戦。HPは引き継ぎ、途中で町へ戻ると最初から。タイピング技と防御を組み合わせて勝ち抜こう。</p><div class="trialStages"><span>第1戦 いわ Lv16</span><span>第2戦 みず Lv20</span><span>第3戦 エスパー Lv24</span></div><div class="small">突破 ${S.trialClears}回 ／ 最高到達 ${S.trialBest}/3 ／ 初回突破報酬 200コイン（依頼掲示板で受取）</div><div class="buttonrow" style="margin-top:12px"><button class="btn gold" data-action="trialStart" ${!active()||active().hp<=0?'disabled':''}>⚔️ 3連戦に挑戦</button></div></section>`;
}
function researchPanel(){if(!S.endingUnlocked)return '';
 const got=Object.keys(S.caught).length,total=Object.keys(P).length;
 return `<section class="researchPanel"><div class="pageHeading"><h3>🔬 カナデ博士の調査ロッジ</h3><span class="chip gold">図鑑 ${got}/${total}</span></div>
 <p>エンディング後に開く特別な調査。4つの生態域には、通常の冒険で出会えなかったポケモンも登場します。<b>まだ入手していない種類が優先的に現れます。</b></p>
 <div class="researchGrid">${RESEARCH_AREAS.map(a=>{const pool=RESEARCH_POOL(a),owned=pool.filter(id=>S.caught[id]).length;
 return `<div class="miniPanel"><h4>${a.icon} ${a.name}</h4><p class="small">${a.desc}</p><p class="tiny">この生態域：入手 ${owned}/${pool.length} 種</p>
 <button class="btn green" data-action="research" data-id="${a.key}" ${active()?.hp>0?'':'disabled'}>🔎 調査で遭遇する</button></div>`}).join('')}</div>
 <div class="miniPanel" style="margin-top:12px"><h4>🌟 特別調査：ことばの灯の守り手</h4><p class="small">3連戦「記憶の試練」を制覇すると、ミュウツーを捕獲できる特別な遭遇が解放されます。結界を破り、HPを減らしてボールを投げましょう。</p>
 <button class="btn gold" data-action="research" data-id="legend" ${S.trialClears<1||active()?.hp<=0?'disabled':''}>${S.trialClears<1?'🔒 3連戦の制覇が必要':'✨ ミュウツーの調査へ'}</button></div>
 <div class="tiny" style="margin-top:12px">調査での遭遇 ${S.researchEncounters} 回。各生態域に出現対象を用意しているため、図鑑の全種類を入手可能です。</div></section>`;
}
function adventure(){if(!S.starter)return welcome();if(battle)return battleView();const a=active(),q=questInfo();if(challenge?.mode==='field')return `<div class="pageHeading"><h2>⌨️ タイピング練習所</h2></div>${fieldTypingUI()}`;if(S.field)return fieldView();return `<div class="pageHeading"><h2>🗺️ アカリ地方の冒険</h2><button class="btn ghost sm" data-action="rest">🏠 町で休む（HP全回復）</button></div>
 <div class="questBanner"><div class="eyebrow">NEXT OBJECTIVE</div><h3>${q.title}</h3><p>${q.detail}</p><div class="meter gold" style="max-width:460px"><i style="width:${q.percent}%"></i></div></div>
 <div class="hero"><div><div class="small">先頭のパートナー</div><h2 style="margin:3px 0 6px">${P[a.id].name} <span style="font-size:14px">Lv.${a.lv}</span></h2><div class="soft" style="font-size:13px">HP ${a.hp}/${maxHp(a)}　経験値 ${a.xp}/${xpFor(a)}</div><div style="width:240px;max-width:100%;margin-top:10px">${hpbar(a.hp,maxHp(a))}</div></div>${creature(a.id)}</div>
 <div class="grid2 mapGrid">${ZONES.map((z,i)=>{const locked=zoneLocked(z),done=z.boss?S.endingUnlocked:z.gym&&S.badges>=(i===3?1:2);return `<div class="miniPanel zone ${locked?'locked':''} zoneStyle${i}"><div class="zoneTop"><div class="zoneIcon">${z.emoji}</div><span class="tag">${i===7?'FINAL':z.gym?'GYM':'ROUTE '+(i+1)}</span></div><h3>${z.name} ${done?'✅':''}</h3><div class="small">${z.desc}</div><div class="tiny">${locked?'🔒 条件：'+zoneCondition(z):done?'クリア済み・再挑戦可':'進入可能'}</div><button class="btn ${z.gym?'gold':'green'}" ${locked||a.hp<=0?'disabled':''} data-action="explore" data-id="${i}">${locked?'まだ行けない':a.hp<=0?'回復が必要':'フィールドを探索'}</button></div>`}).join('')}</div>
 ${fieldNotice?'<div class="fieldMessage"><h3>'+fieldNotice.title+'</h3><p>'+fieldNotice.text+'</p>'+(fieldNotice.kind==='failed'?'<button class="btn gold" data-action="fieldRetry">⌨️ もう一度挑戦</button> ':'')+'<button class="btn flat" data-action="fieldClose">閉じる</button></div>':''}${trialPanel()}${researchPanel()}${shopPanel()}${questsPanel()}
 ${S.endingUnlocked?'<div class="note" style="margin-top:18px">🎉 メインストーリークリア！ 「物語」からエンディングを再生できます。冒険も続行可能です。</div>':'<div class="note" style="margin-top:18px">⌨️ 戦いに勝ち、バッジを集めながら塔を目指そう。途中で全滅しても、町で無料で全回復できる。</div>'}`}

function battleView(){const a=active(),foe=battle.foe,fa=P[foe.id],pa=P[a.id];return `<div class="pageHeading"><h2>${battle.trial?'🏆 記憶の試練 '+(battle.trialStage+1)+'/3':battle.research?(battle.legend?'🌟 特別調査：ミュウツー':'🔬 調査ロッジでの遭遇'):battle.trainer?'🥊 トレーナーとの勝負':battle.gym?'🏅 ジムチャレンジ':'⚔️ 野生ポケモンとのバトル'}</h2><span class="chip">${ZONES[battle.zone].name}</span></div><div class="battleground ${battle.effect?"effect"+battle.effect:""} ${battle.boss?'finalBattle':''}"><div class="battler"><div class="hpbox"><div class="nameLine"><span>${pa.name} ${tagType(pa.type)}</span><span>Lv.${a.lv}</span></div><div class="tiny">HP ${Math.max(0,a.hp)} / ${maxHp(a)}</div><div style="margin-top:5px">${hpbar(a.hp,maxHp(a))}</div>${battle.heroStatus?'<span class="statusPill">'+statusName(battle.heroStatus)+'　残り'+battle.heroStatus.left+'T</span>':''}</div>${creature(a.id,true)}</div><div class="battler"><div class="hpbox"><div class="nameLine"><span>${fa.name} ${tagType(fa.type)}</span><span>Lv.${foe.lv}</span></div><div class="tiny">HP ${Math.max(0,foe.hp)} / ${maxHp(foe)}</div><div style="margin-top:5px">${hpbar(foe.hp,maxHp(foe))}</div>${battle.foeStatus?'<span class="statusPill">'+statusName(battle.foeStatus)+'　残り'+battle.foeStatus.left+'T</span>':''}</div>${creature(foe.id,true,true)}</div></div><div class="focusBand"><span>🌟 集中 ${S.focus}/100</span><div class="meter gold"><i style="width:${S.focus}%"></i></div></div><div class="battleLog" role="status">${escapeHtml(battle.msg)}</div>${battle.shield>0?'<div class="fieldNotice">🔮 強敵の結界が '+battle.shield+' 段階残っています。攻撃ダメージが低下中。「ことばをつむぐ」で解除できます。</div>':''}${battle.feedback?`<div class="combatFeedback" role="status"><strong>${battle.feedback.rank} RANK</strong>　${battle.feedback.speed} WPM　正確率 ${battle.feedback.accuracy}%　${battle.feedback.bonus||''}</div>`:''}${bossMechanic()&&battle.phase==='defend'?`<div class="battleIntent">⚠️ ${bossMechanic().title}！ 通常防御か、特殊タイピングで阻止するか選ぼう。</div>`:''}${battleControls()}`}
function tacticHint(){
 const foeType=P[battle.foe.id].type,types=[...new Set((MOVES[P[active().id].type]||MOVES.normal).slice(0,active().lv>=18?3:2).map(m=>m[1]))];
 const pairs=types.map(t=>({name:LABEL[t],v:typeMultiplier(t,foeType)}));
 return '<div class="tacticHint"><b>🔎 相性のヒント：</b> '+pairs.map(p=>p.name+' '+(p.v>=2?'◎ ばつぐん':p.v<1?'△ いまひとつ':'○ ふつう')).join('　／　')+'</div>';
}
function battleControls(){if(challenge&&battle.phase==='typing')return `<div class="typing"><div class="flex" style="justify-content:center"><span class="tag">${challenge.mode==='attack'?'⚔️ 攻撃タイピング':challenge.mode==='focus'?'🌟 集中攻撃タイピング':challenge.mode==='defend'?'🛡️ 防御タイピング':challenge.mode==='counter'?'⚡ 必殺技を阻止':challenge.mode==='break'?'🔮 結界解除タイピング':'🔴 捕獲タイピング'}</span><span class="small" id="timeLeft">残り ${challenge.duration.toFixed(1)} 秒</span><span class="tag">${difficultyLabel()}</span><span class="tag comboLabel" id="comboValue">COMBO 0</span></div><h3>${challenge.phrase}</h3><div class="roman" id="romanGuide">${challenge.romaji}</div><input type="text" id="typeInput" class="typeInput" readonly autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここにローマ字を入力" aria-label="タイピング入力"><div class="typingPauseBar"><button class="btn flat sm" type="button" data-action="typingPause" id="typingPauseBtn">⏸ 一時停止 (Esc)</button><span id="typingPauseState" class="tiny">ウィンドウを離れた場合も自動停止します</span></div><div class="typingMeta"><span class="small" id="typeProgress">0 / ${challenge.romaji.length} 文字</span><span class="small" id="typeMistakes">ミス 0回</span></div><div class="timeFill"><i id="timeFillInner"></i></div><p class="hint">ローマ字は複数方式に対応し、表示ガイドも入力に追従します。日本語入力はOFFにしてください。Backspace・貼り付けによる書き換えはできません。</p></div>`;
if(battle.phase==='action'){const a=active();const moves=(MOVES[P[a.id].type]||MOVES.normal).slice(0,a.lv>=18?3:2);return `<div class="panel"><h3 class="sectionTitle">どうする？</h3>${tacticHint()}<p class="small">技はLv.18で3つ目が解放されます。強敵の予告とタイプ相性を見ながら選ぼう。</p><div class="actiongrid">${moves.map((m,i)=>`<button class="btn" data-action="attack" data-id="${i}">⌨️ ${m[0]}　<span class="tiny">威力${m[2]}</span></button>`).join('')}${battle.shield>0?'<button class="btn gold" data-action="breakShield">🔮 ことばをつむぐ（結界を解除）</button>':''}<button class="btn gold" data-action="focusAttack" ${S.focus<80?'disabled':''}>🌟 集中攻撃（80消費・威力1.75倍）</button><button class="btn flat" data-action="catch" ${battle.gym||S.balls<=0||(S.roster.length>=6&&S.box.length>=500)?'disabled':''}>🔴 ボールを投げる (${S.balls})</button><button class="btn flat" data-action="switch">🔄 ポケモン交代</button><button class="btn green" data-action="battlePotion" ${S.potions<=0||a.hp>=maxHp(a)?'disabled':''}>🧴 キズぐすりで回復 (${S.potions})</button><button class="btn ghost" data-action="run" ${battle.gym?'disabled':''}>🏃 にげる</button></div></div>`}
if(battle.phase==='defend')return `<div class="panel"><h3 class="sectionTitle">敵の攻撃が来る！</h3><p class="intro">防御タイピングに成功すると、受けるダメージを減らせます。強敵の必殺技には専用の阻止チャレンジもあります。</p><div class="buttonrow">${bossMechanic()?`<button class="btn gold" data-action="counter" ${S.focus<20?'disabled':''}>⚡ ${bossMechanic().title}を阻止（集中20消費）</button>`:''}<button class="btn green" data-action="defend">⌨️ 防御タイピング</button><button class="btn flat" data-action="skipdef">そのまま攻撃を受ける</button></div></div>`;
if(battle.phase==='switch')return `<div class="panel"><h3 class="sectionTitle">交代するポケモンを選択</h3><div class="grid2">${S.roster.map((a,i)=>`<button class="partycard ${i===S.active?'selected':''}" data-action="switcho" data-id="${i}" ${i===S.active||a.hp<=0?'disabled':''}>${creature(a.id)}<div><b>${P[a.id].name} Lv.${a.lv}</b><div class="small">HP ${a.hp}/${maxHp(a)}</div></div></button>`).join('')}</div><div class="buttonrow" style="margin-top:12px"><button class="btn ghost" data-action="cancelSwitch">戻る</button></div></div>`;
if(battle.phase==='result')return `<div class="panel" style="text-align:center"><div class="resultRank">${battle.captured?'GET!':battle.victory?'WIN!':'LOSE'}</div><h2>${escapeHtml(battle.msg)}</h2><p class="intro">${battle.trial?'連戦では残りHPを引き継ぎます。続ける前に手持ちの状態を確認してください。':battle.captured?'捕まえたポケモンは「仲間・育成」で確認できます。':battle.victory?'経験値を獲得しました。冒険を続けよう！':'町へ戻って回復しましょう。'}</p>${battle.trial?`<div class="buttonrow" style="justify-content:center">${battle.victory&&battle.trialStage<2?'<button class="btn gold" data-action="trialNext">次の試練へ ▶</button>':''}<button class="btn flat" data-action="trialBack">町へ戻る</button></div>`:`<button class="btn gold" data-action="${battle.boss&&battle.victory?'ending':'backMap'}">${battle.boss&&battle.victory?'✨ エンディングを見る':'冒険マップへ戻る'}</button>`}</div>`;
return ''}
function party(){if(!S.starter)return welcome();return `<div class="pageHeading"><h2>👥 仲間・育成</h2><span class="chip">手持ち ${S.roster.length}/6　ボックス ${S.box.length}匹</span></div><p class="intro">同時に連れて歩けるのは最大6匹。残りはボックスで管理できます。町にいるときに入れ替え可能です。</p><div class="grid2">${S.roster.map((a,i)=>`<div class="miniPanel"><div class="flex">${creature(a.id)}<div style="flex:1;min-width:110px"><b>${P[a.id].name}　Lv.${a.lv}</b><div style="margin:5px 0">${tagType(P[a.id].type)} ${i===S.active?'<span class="tag">先頭</span>':''}</div><div class="small">HP ${a.hp}/${maxHp(a)}</div>${hpbar(a.hp,maxHp(a))}<div class="tiny" style="margin-top:8px">EXP ${a.xp}/${xpFor(a)}</div></div></div><div class="buttonrow" style="margin-top:11px"><button class="btn sm" ${i===S.active||a.hp<=0||!!battle?'disabled':''} data-action="lead" data-id="${i}">先頭にする</button><button class="btn sm flat" ${S.potions<=0||a.hp>=maxHp(a)||!!battle?'disabled':''} data-action="potion" data-id="${i}">回復 (${S.potions})</button><button class="btn sm ghost" ${battle||S.field||S.roster.length<=1?'disabled':''} data-action="boxDeposit" data-id="${i}">ボックスへ</button></div></div>`).join('')}</div><div class="panel" style="margin-top:16px"><h3 class="sectionTitle">📦 ボックス　${S.box.length}匹</h3>${S.box.length?`<div class="boxGrid">${S.box.map((a,i)=>`<div class="boxPokemon">${creature(a.id)}<div><b>${P[a.id].name}</b><div class="tiny">Lv.${a.lv}　HP ${a.hp}/${maxHp(a)}</div><button class="btn sm green" data-action="boxWithdraw" data-id="${i}" ${S.roster.length>=6||S.field||battle?'disabled':''}>手持ちに戻す</button></div></div>`).join('')}</div>`:'<p class="small">まだ預けたポケモンはいません。</p>'}<p class="tiny">※預ける・引き出す操作は町で行えます。捕獲時に手持ち6匹なら自動的にボックスへ送られます。</p></div><div class="note">先頭以外の手持ちにも経験値が半分配られます。ゴース・ケーシィなどもゲーム独自のレベル進化に対応します。</div>`}

let dexFilter='all';
function dex(){if(!S.starter)return welcome();const ids=Object.keys(P).map(Number).sort((a,b)=>a-b),got=ids.filter(id=>S.caught[id]).length;
 const shown=ids.filter(id=>dexFilter==='owned'?!!S.caught[id]:dexFilter==='missing'?!S.caught[id]:dexFilter==='seen'?S.seen.includes(id):true);
 return `<div class="pageHeading"><h2>📖 ポケモン図鑑</h2><span class="chip">発見 ${S.seen.length}/${ids.length}・入手 ${got}/${ids.length}</span></div>
 <div class="miniPanel" style="margin-bottom:16px"><b>図鑑完成率　${Math.round(got/ids.length*100)}%</b><div class="meter gold" style="margin-top:8px"><i style="width:${got/ids.length*100}%"></i></div>
 <p class="small">通常の冒険と進化で集め、クリア後に開く「調査ロッジ」で未入手の種類を探そう。ミュウツーは3連戦突破後の特別調査に登場します。</p>
 <label class="small" for="dexFilter">表示するポケモン</label> <select id="dexFilter" class="dexFilter"><option value="all" ${dexFilter==='all'?'selected':''}>すべて (${ids.length})</option><option value="missing" ${dexFilter==='missing'?'selected':''}>未入手 (${ids.length-got})</option><option value="seen" ${dexFilter==='seen'?'selected':''}>発見済み</option><option value="owned" ${dexFilter==='owned'?'selected':''}>入手済み</option></select></div>
 ${got===ids.length?'<div class="completeBanner">🌟 図鑑コンプリート！ すべての仲間との絆を記録しました。</div>':''}
 <div class="grid3">${shown.map(id=>{const seen=S.seen.includes(id),caught=!!S.caught[id];return `<div class="dexcard ${seen?'':'locked'}">${seen?creature(id):'<div class="creature" style="width:66px;min-height:66px;font-size:30px">?</div>'}<div style="min-width:0"><div class="tiny">No.${String(id).padStart(3,'0')}</div><b style="font-size:13px">${seen?P[id].name:'？？？？'}</b><div style="margin-top:3px">${caught?'<span class="tag type-grass">GET</span>':seen?'<span class="tiny">発見済み</span>':''}</div></div></div>`}).join('')}</div>`;
}


function learningPanel(){
 const p=learningProfile(),recent=S.history.slice(0,12).reverse();
 const max=Math.max(30,...recent.map(h=>h.speed||0));
 const bars=recent.map((h,i)=>`<div class="learnBar" title="${escapeHtml(h.phrase)}：${h.speed} WPM／正確率${h.accuracy}%"><span style="height:${Math.max(5,Math.min(100,h.speed/max*100))}%;background:${h.success?'#6dbbd4':'#ab7485'}"></span><small>${i+1}</small></div>`).join('');
 const weak=Object.entries(S.weakKeys).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const current=recent.slice(-5),previous=recent.slice(-10,-5);
 const avg=(arr)=>arr.length?Math.round(arr.reduce((a,h)=>a+h.speed,0)/arr.length):0;
 const trend=previous.length>=3&&current.length>=3?avg(current)-avg(previous):null;
 const hint=p.n<5?'数回タイピングすると、入力成績からお題と制限時間が自動調整されます。':p.accuracy<85?'速さよりも正確さを優先しましょう。ミスが減ると次の段階へ進みます。':p.successRate<.7?'制限時間が厳しければ「やさしい」に設定して練習しましょう。':p.median>=35?'安定しています。長めの文章にも挑戦してみましょう。':'丁寧に入力できています。このまま少しずつ速度を上げてみましょう。';
 return `<div class="panel"><h3>📈 成長ダッシュボード</h3><div class="grid3"><div class="miniPanel"><span class="small">最近の中央値</span><h3>${p.median} WPM</h3></div><div class="miniPanel"><span class="small">最近の成功率</span><h3>${p.n?Math.round(p.successRate*100)+'%':'—'}</h3></div><div class="miniPanel"><span class="small">現在の自動レベル</span><h3>${difficultyLabel()}</h3></div></div>
 <p class="small">${escapeHtml(hint)} ${trend===null?'':`直近5回の平均速度は前の5回に比べて ${trend>=0?'+':''}${trend} WPM。`}</p>
 <h4>最近の入力速度（WPM）</h4>${recent.length?`<div class="learnChart" role="img" aria-label="最近のタイピング速度を時系列で表示。詳しい数値は下の履歴を参照">${bars}</div>`:'<p class="small">まだ計測データがありません。</p>'}
 <h4>苦手キー Top 6</h4>${weak.length?`<div class="weakChart">${weak.map(([k,n])=>`<div class="weakRow"><kbd>${escapeHtml(k)}</kbd><div class="meter"><i style="width:${Math.max(5,n/weak[0][1]*100)}%;background:#db956e"></i></div><small>${n}回</small></div>`).join('')}</div>`:'<p class="small">まだミスタイプ記録がありません。</p>'}
 <button class="btn green" data-action="recordPractice">⌨️ 苦手キーを重点練習</button><p class="tiny">自動難易度は最近12件の成功率・正確率・速度から決定。手動難易度では自動調整を適用しません。</p></div>`;

// Ver12: A–Zタイムアタック。ゲストはS/localStorageを一切変更しない。
const AZ_LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const AZ_TIERS=[{ms:30000,name:'ブロンズ',coins:10},{ms:20000,name:'シルバー',coins:15},{ms:15000,name:'ゴールド',coins:25},{ms:10000,name:'プラチナ',coins:40},{ms:7000,name:'マスター',coins:60}];
function azClockText(ms){return (Math.max(0,ms)/1000).toFixed(2)+' 秒';}
function azClear(){if(azTimer!==null){clearInterval(azTimer);azTimer=null;}azSession=null;}
function azStop(text){azClear();azNotice=text||'';render();}
function azStart(mode){
  if(!['record','guest'].includes(mode)||!S.starter)return;
  azClear();azNotice='';azSession={mode,phase:'ready',index:0,errors:0,start:0,elapsed:0,personalBest:false,reward:0,earned:[],message:''};
  render();
}
function azKeyInput(e,key){
  if(!azSession||!['ready','running'].includes(azSession.phase))return false;
  if(key==='Escape'){e.preventDefault();azStop('挑戦を中止しました。記録や報酬には影響しません。');return true;}
  if(key==='Backspace'){e.preventDefault();return true;}
  if(key.length!==1||!/^[a-z]$/i.test(key))return false;
  e.preventDefault();
  const now=performance.now(),letter=key.toUpperCase(),correct=AZ_LETTERS[azSession.index];
  if(letter!==correct){azSession.errors++;soundFx('mistake');azUpdateDisplay();return true;}
  if(azSession.phase==='ready'){
    azSession.phase='running';azSession.start=now;
    azTimer=setInterval(azUpdateDisplay,40);
  }
  azSession.index++;
  if(azSession.index===26){azSession.elapsed=Math.max(1,Math.round(now-azSession.start));azFinish();}
  else {if(azSession.index%4===0)soundFx('tap');azUpdateDisplay();}
  return true;
}
function azFinish(){
  if(!azSession||azSession.phase!=='running')return;
  const t=azSession;clearInterval(azTimer);azTimer=null;t.phase='finished';
  if(t.mode==='record'){
    const oldBest=S.azBestMs;
    t.personalBest=!oldBest||t.elapsed<oldBest;
    S.azRuns.unshift({ms:t.elapsed,errors:t.errors,date:new Date().toISOString()});
    S.azRuns=S.azRuns.slice(0,20);
    if(t.personalBest){
      S.azBestMs=t.elapsed;
      if(S.azPbRewards<10){S.azPbRewards++;t.reward+=5;t.earned.push('自己ベスト更新 +5コイン');}
      for(const tier of AZ_TIERS){
        if(t.elapsed<=tier.ms&&!S.azMilestones.includes(tier.ms)){
          S.azMilestones.push(tier.ms);t.reward+=tier.coins;t.earned.push(tier.name+'達成 +'+tier.coins+'コイン');
        }
      }
    }
    S.coins+=t.reward;save();
  }
  soundFx(t.personalBest?'victory':'catch');
  render();
}
function azUpdateDisplay(){
  const t=azSession;if(!t||!['ready','running'].includes(t.phase)||tab!=='aztime')return;
  const now=t.phase==='running'?performance.now()-t.start:0;
  const timeEl=document.getElementById('azClock');if(timeEl)timeEl.textContent=azClockText(now);
  const nextEl=document.getElementById('azNext');if(nextEl)nextEl.textContent=AZ_LETTERS[t.index]||'FINISH';
  const countEl=document.getElementById('azCount');if(countEl)countEl.textContent=t.index+' / 26';
  const mistakes=document.getElementById('azErrors');if(mistakes)mistakes.textContent='ミス '+t.errors+'回';
  const progress=document.getElementById('azProgress');if(progress)progress.style.width=(t.index/26*100)+'%';
  document.querySelectorAll('.azLetter').forEach((el,i)=>{el.classList.toggle('done',i<t.index);el.classList.toggle('next',i===t.index);el.setAttribute('aria-current',i===t.index?'true':'false');});
}

    ${t.mode==='guest'?'<p class="note">このタイムは保存していません。ゲーム本編にも影響しません。</p>':t.reward?`<p class="note">🪙 今回の獲得：<b>${t.reward}コイン</b><span class="small" style="display:block">${t.earned.map(escapeHtml).join(' ／ ')}</span></p>`:'<p class="small">新しい記録が出たら本編に報酬が加算されます。</p>'}
    <div class="buttonrow" style="justify-content:center"><button class="btn gold" data-action="azRetry">同じモードで再挑戦</button><button class="btn flat" data-action="azCancel">モード選択に戻る</button></div></div>`;

  const list=S.azRuns.length?`<div class="azHistory">${S.azRuns.slice(0,8).map((r,i)=>`<div class="historyRow"><span>${i+1}回前：${azClockText(r.ms)}</span><span>ミス${r.errors}回 <span class="tiny">${escapeHtml(r.date.slice(0,10))}</span></span></div>`).join('')}</div>`:'<p class="small">まだ本人の記録はありません。</p>';
  return `<div class="pageHeading"><h2>⏱️ A–Z タイムアタック</h2><button class="btn ghost sm" data-action="azBack">冒険へ戻る</button></div>
  <div class="grid2" style="margin-bottom:15px"><div class="miniPanel"><div class="small">🏆 自己ベスト（本人用）</div><h2 class="num">${best}</h2></div><div class="miniPanel"><div class="small">記録した挑戦（直近${attempts}件）</div><h2 class="num">${attempts} 件</h2></div></div>

function record(){return `<div class="pageHeading"><h2>⌨️ タイピング記録</h2><button class="btn gold sm" data-action="tab" data-id="aztime">⏱️ A–Z タイムアタック</button></div><div class="grid2"><div class="miniPanel"><div class="small">最高速度</div><h2>${S.stats.bestWpm} <small style="font-size:13px">WPM</small></h2></div><div class="miniPanel"><div class="small">成功したお題</div><h2>${S.stats.clears} <small style="font-size:13px">回</small></h2></div><div class="miniPanel"><div class="small">正しく入力したキー数</div><h2>${S.stats.letters} <small style="font-size:13px">打</small></h2></div><div class="miniPanel"><div class="small">ミスタイプ</div><h2>${S.stats.misses} <small style="font-size:13px">回</small></h2></div></div>${learningPanel()}<div class="panel"><h3 class="sectionTitle">分析・練習のヒント</h3><div class="statRow"><span>総合正確率</span><b>${Math.round(100*S.stats.letters/Math.max(1,S.stats.letters+S.stats.misses))}%</b></div><div class="statRow"><span>連続入力の最高記録</span><b>${S.stats.bestCombo}キー</b></div><p class="small">苦手になりやすいキー：${Object.entries(S.weakKeys).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>k+' ('+v+'回)').join('、')||'まだ記録がありません'}</p><p class="small">町の練習所に「苦手キー練習」を追加しています。</p><p class="small">NPC依頼 ${S.npcHelped.length}/8件 ／ トレーナー勝利 ${S.trainerWins.length}/4件 ／ 踏破 ${Object.keys(S.visitedTiles).length}マス ／ クリア後3連戦 ${S.trialClears}回突破</p><h3 class="sectionTitle" style="margin-top:18px">最近のタイピング</h3>${S.history.length?`<div class="historyList">${S.history.slice(0,10).map(h=>`<div class="historyRow"><span>${h.success?'✅':'◻️'} ${escapeHtml(h.phrase)}</span><span>${h.rank} / ${h.speed} WPM / ${h.accuracy}%</span></div>`).join('')}</div>`:'<p class="small">まだ結果はありません。</p>'}</div><div class="panel"><div class="statRow"><span>仕掛けタイピングのクリア</span><b>${S.stats.fieldClears||0}回</b></div><div class="statRow"><span>探索した歩数</span><b>${S.steps}歩</b></div><div class="statRow"><span>石碑 / 宝箱</span><b>${S.runes} / ${S.chests}</b></div></div><div class="panel"><h3 class="sectionTitle">出題レベル</h3><select id="difficulty" style="padding:10px;background:#1e334e;color:white;border:1px solid #65829e;border-radius:10px;width:100%;max-width:300px"><option value="auto" ${S.difficulty==='auto'?'selected':''}>おまかせ（おすすめ）</option><option value="easy" ${S.difficulty==='easy'?'selected':''}>やさしい（短い単語中心）</option><option value="normal" ${S.difficulty==='normal'?'selected':''}>ふつう（短文中心）</option><option value="hard" ${S.difficulty==='hard'?'selected':''}>むずかしい（長文中心）</option></select><p class="intro" style="margin-top:12px">WPMは正しく入力したキー数÷5を1分換算した参考値です。おまかせでは直近の速度・正確率・成功率からお題と制限時間を調整します。</p></div>`}
function help(){return `<div class="pageHeading"><h2>❔ 遊び方・設定</h2></div><div class="panel"><h3>キーボードだけで遊ぶ</h3><p class="intro"><b>Tab</b>：選択項目を移動　<b>Shift+Tab</b>：前の項目　<b>Enter/Space</b>：決定　<b>数字1～9</b>：画面内のコマンドを即決定　<b>↑↓/WASD</b>：フィールド移動　<b>Esc</b>：戻る（タイピング中は一時停止）　<b>G</b>：冒険　<b>P</b>：仲間　<b>D</b>：図鑑　<b>R</b>：記録　<b>T</b>：A–Zタイムアタック　<b>J</b>：物語　<b>K</b>：実績　<b>H</b>：遊び方　<b>M</b>：音ON/OFF。入力欄とリスト選択中は、文字キーのショートカットを無効にします。</p><div class="buttonrow" style="margin-bottom:15px"><button class="btn gold" data-action="tutorialReplay">⌨️ 操作チュートリアルをもう一度</button></div><h3>物語</h3><p class="intro">カナデ博士に導かれ、ことばの灯を取り戻す旅に出ます。草原 → 森 → 岩山 → いわのジム → 湖 → みずのジム → 星の回廊 → ことばの塔の順に進みます。各エリアには9×7の歩けるマップがあり、未踏破の道は探索で明らかになります。草むらは野生バトル、石碑と宝箱はタイピング、NPCはヒントです。最後の相手に勝利するとエンディングが流れます。</p><h3>タイピングバトル</h3><p class="intro">攻撃は時間制限付きのタイピングです。速さと正確さで威力が上がります。Escキーで制限時間を一時停止できます。敵の攻撃時は防御タイピングに挑戦するか、そのまま受けるか選べます。<b>し：shi／si、ち：chi／ti</b> など複数ローマ字に対応しています。</p><h3>捕獲・育成</h3><p class="intro">ボールで野生のポケモンを捕獲できます。減らしたHPとタイピング成績で捕獲率が上がります。勝利で経験値を得て、先頭以外の手持ちにも50％分が配られます。条件を満たすと進化する種類もいます。町での回復は無料です。</p><h3>探索操作・強敵攻略</h3><p class="intro">探索マップでは矢印キーまたはWASDで移動します。画面の移動ボタンや隣接マスのクリックも使用できます。ジムの強敵には結界があり、攻撃ダメージが低下します。バトル画面の「ことばをつむぐ」で結界を解除してから攻撃すると効果的です。</p><h3>依頼・ボックス・集中攻撃</h3><p class="intro">町の依頼掲示板の条件を満たすと報酬がもらえます。仲間は手持ち6匹までで、それ以上はボックスに自動保存されます。タイピングを正確に成功させると集中ゲージがたまり、80消費することで強力な集中攻撃が使えます。石碑4つごとに強敵の初期結界が1段階減ります。</p><h3>NPC依頼・戦術・クリア後</h3><p class="intro">各エリアのNPCには1度だけ受けられるタイピング依頼があります。Lv.18で3つ目の上位技が解放されます。どく・やけど状態はバトル中の残りターンだけ継続し、交代や終了で解除されます。強敵は3ターンごとに強力な攻撃を予告します。森・山道・湖・星の回廊ではトレーナーと戦え、初勝利で特別報酬を受け取れます。戦闘中のキズぐすり使用には1ターンかかります。エンディング後は町で3連戦「記憶の試練」に挑戦できます。さらに調査ロッジで図鑑完成に挑戦できます。</p><h3>コンボ・ボス阻止・成長記録</h3><p class="intro">入力中は連続正解コンボが表示され、8キーごとに効果音が鳴ります。コンボを維持すると攻撃が最大12％強くなります。強敵が3ターンごとに見せる構えでは、集中20を消費して専用のお題に挑戦できます。成功すれば敵の攻撃を止めますが、失敗すると被害が増えます。「タイピング記録」では最近の成績推移と苦手キー、習熟度に応じた難易度が確認できます。</p><h3>A–Z タイムアタック</h3><p class="intro">AからZまで順番にキーを打つタイム競争です。Aを押した瞬間に計測開始、Zで終了。記録するモードなら自己ベストを保存し、更新に応じて本編コインを獲得できます。ゲスト（記録しない）モードでは自己ベスト・プレイ履歴・本編報酬を一切変更しません。競技中は英字入力（IME OFF）、Escで中止。ほかのタブへ切り替えたり画面を離れたりした挑戦は無効です。Tキーで開けます。</p><h3>道具屋・練習所</h3><p class="intro">町で無料回復できます。野生バトルや宝箱からコインを集めて、モンスターボールやキズぐすりを買えます。練習所では戦闘をせずにタイピングを練習できます。</p><h3>音について</h3><p class="intro">BGM・効果音は外部ファイルを使用しないWeb Audio合成音です。画面右上のボタンでON/OFFを切り替えられます。音は最初に画面を操作した後で鳴ります。</p><div class="flex"><label for="volume" class="small">音量</label><input id="volume" type="range" min="0" max="100" step="5" value="${S.volume}" aria-label="音量"><span class="small" id="volumeLabel">${S.volume}%</span></div><h3 style="margin-top:19px">画像とセーブ</h3><p class="intro">画像は必要なときだけ外部の軽量スプライトを取得します。画像を読み込めなくても代替アイコンで遊べます。セーブデータはブラウザのlocalStorageに保存され、サーバには送信されません。ブラウザやPCを変えると自動では引き継がれません。</p><div class="note">キーボードは英字入力（IME OFF）にしてください。タイピング中はBackspaceや貼り付けでの成績改変はできません。通信制限がある環境では画像表示を確認してください。</div><div class="divider"></div><h3>セーブデータのバックアップ</h3><p class="intro">別PCや別URLで続きを遊ぶ場合は、Ver12内で作成したセーブだけを書き出して読み込めます。旧版セーブは読み込みません。読み込みすると現在の進行は上書きされます。</p><div class="buttonrow"><button class="btn green" data-action="exportSave">💾 セーブを書き出す</button><button class="btn flat" data-action="importSave">📂 セーブを読み込む</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><div class="divider"></div><button class="btn red sm" data-action="reset">⚠️ セーブデータを初期化</button></div>`}

}

function pickWeighted(pool,weights){let total=weights.reduce((x,y)=>x+y,0),r=Math.random()*total;for(let i=0;i<pool.length;i++){r-=weights[i];if(r<0)return pool[i]}return pool[pool.length-1]}
function newBattle(i,opts={}){
  const z=ZONES[i],a=active(),trial=Number.isInteger(opts.trialStage)&&opts.trialStage>=0&&opts.trialStage<3,trainer=!!opts.trainer&&!!TRAINERS[i];

function typeMultiplier(from,to){
  const chart={
    grass:{water:2,rock:2,fire:.5,grass:.5,poison:.5},
    water:{fire:2,rock:2,grass:.5,water:.5},
    fire:{grass:2,water:.5,fire:.5,rock:.5},
    electric:{water:2,grass:.5,electric:.5},
    rock:{fire:2,poison:1.5},
    psychic:{poison:2,psychic:.5},
    poison:{grass:2,rock:.5,poison:.5},
    normal:{rock:.5}
  };
  return (chart[from]&&chart[from][to])||1;
}
function damage(at,df,move,modifier){const stab=P[at.id].type===move[1]?1.2:1,eff=typeMultiplier(move[1],P[df.id].type);const raw=((2*at.lv/5+2)*move[2]*(attackStat(at)/Math.max(1,defenseStat(df)))/50+2)*stab*eff*modifier*2.5;return Math.max(1,Math.round(raw))}
function learningProfile(){

 const successes=entries.filter(h=>h.success),n=entries.length;
 const rates=successes.map(h=>h.speed).filter(x=>x>0).sort((a,b)=>a-b);
 const median=rates.length?rates[Math.floor(rates.length/2)]:0;
 const accuracy=n?Math.round(entries.reduce((a,h)=>a+h.accuracy,0)/n):100;

 return {n,median,accuracy,successRate};
}
function difficulty(){

 const p=learningProfile();
 if(p.n<5)return 'easy';
 if(p.successRate<.6||p.accuracy<80)return 'easy';
 if(p.n>=7&&p.successRate>=.85&&p.accuracy>=92&&p.median>=34)return 'hard';
 if(p.successRate>=.7&&p.accuracy>=86&&p.median>=19)return 'normal';

function difficultyLabel(){return {easy:'やさしい',normal:'ふつう',hard:'むずかしい'}[difficulty()];}
function timingFactor(){
 if(S.difficulty!=='auto')return 1;
 const p=learningProfile();if(p.n<4)return 1;

 if(p.successRate<.7)factor+=.19;
 else if(p.successRate>=.9&&p.median>=35)factor-=.08;

 if(battle.trial){
   S.trialBest=Math.max(S.trialBest,battle.trialStage+1);
   if(battle.trialStage===2){S.trialClears++;S.coins+=75;}
   battle.victory=true;battle.phase='result';
   battle.msg=`第${battle.trialStage+1}戦勝利！ ${P[battle.foe.id].name}を突破した。 経験値${xp}獲得。${battle.trialStage===2?' 3連戦制覇！ 追加75コイン！':''}${msg}`;
   save();render();soundFx('victory');return;
 }
 const finale=!!battle.boss;
 if(finale)S.endingUnlocked=true;
 battle.victory=true;battle.phase='result';
 battle.msg=`${P[battle.foe.id].name}に勝った！ 経験値${xp}を獲得。${wasRock?' 🏅 勇気のバッジを手に入れた！':''}${wasWater?' 🏅 思いやりのバッジを手に入れた！':''}${finale?' ✨ ことばの灯が輝き始めた！':''}${msg}`;
 save();render();soundFx(finale?'ending':wasRock||wasWater?'badge':'victory');
}

function catchPokemon(){if(S.roster.length>=6&&S.box.length>=500){battle.phase='defend';battle.msg='ボックスがいっぱい！';save();render();return;}const f=battle.foe;S.caught[f.id]=(S.caught[f.id]||0)+1;const caught={id:f.id,lv:f.lv,hp:Math.max(1,f.hp),xp:0};const toBox=S.roster.length>=6;if(toBox)S.box.push(caught);else S.roster.push(caught);battle.victory=true;battle.captured=true;battle.phase='result';battle.msg=`やった！ ${P[f.id].name}を つかまえた！ ${toBox?'手持ちが6匹のため、ボックスへ送った！':'仲間が増えた！'}`;save();render();soundFx('catch')}
function exportSave(){
 try{
  save();const data=localStorage.getItem(SAVE_KEY);
  if(!data)throw new Error('セーブがありません');
  const url=URL.createObjectURL(new Blob([JSON.stringify(JSON.parse(data),null,2)],{type:'application/json'})),a=document.createElement('a');
  a.href=url;a.download='typing_quest_ver12_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  notify('Ver12のセーブを書き出しました');
 }catch(e){notify('書き出しに失敗しました。ブラウザの保存設定をご確認ください。');}
}
async function importSaveFile(file){
 if(!file||file.size>1024*1024){notify('1MB以内のJSONファイルを選択してください');return;}
 let data;
 try{data=JSON.parse(await file.text());}catch(e){notify('JSON形式のファイルではありません。');return;}
 if(!data||data.schema!==SAVE_SCHEMA){notify('Ver12専用のセーブファイルだけを読み込めます。');return;}
 if(!confirm('現在のセーブを上書きします。よろしいですか？'))return;
 // 不正なファイルでも現在の進行を保護するため、読込前にスナップショットを確保する。
 const previous=S,previousBattle=battle,previousScene=scene,previousFieldNotice=fieldNotice;
 clearInterval(tickId);tickId=null;challenge=null;battle=null;scene=null;fieldNotice=null;
 if(!loadSaveData(data)){
  S=previous;battle=previousBattle;scene=previousScene;fieldNotice=previousFieldNotice;
  save();render();notify('セーブデータの内容が不正です。');return;
 }
 tab='adventure';openingIndex=S.openingIndex;tutorialReplay=false;tutorialInput='';save();render();if(!battle&&S.starter&&S.openingDone)maybeScene();
 notify('Ver12のセーブを読み込みました');
}
function handle(action,id){
 if(action==='azStart'&&S.starter&&!battle&&!challenge&&!scene&&!tutorialActive()&&tab==='aztime'&&['record','guest'].includes(id)){azStart(id);return;}
  if(action==='azRetry'&&S.starter&&!battle&&!challenge&&!scene&&!tutorialActive()&&tab==='aztime'&&azSession?.phase==='finished'){azStart(azSession.mode);return;}
  if(action==='azCancel'&&tab==='aztime'){azStop('挑戦を取り消しました。記録には残りません。');return;}
  if(action==='azBack'&&tab==='aztime'){azClear();tab='adventure';render();return;}
  if(action==='tutorialStart'&&tutorialActive()&&S.tutorialStep===0){tutorialAdvance();return;}
 if(action==='tutorialSkip'&&tutorialActive()){tutorialSkip();return;}
 if(action==='tutorialFinish'&&tutorialActive()&&S.tutorialStep===7){tutorialComplete();return;}
 if(action==='recordPractice'&&!battle&&!challenge&&!S.field){tab='adventure';fieldNotice=null;beginFieldTyping('practice','',choosePractice('weak'));return;}
 if(action==='tutorialReplay'&&!battle&&!challenge&&!S.field&&!scene){tutorialReplay=true;S.tutorialStep=0;tutorialInput='';tutorialMoves=0;tutorialMistakes=0;render();return;}
 if(action==='typingPause'&&challenge){toggleTypingPause();return;}
 if(action==='research'&&!battle&&!challenge&&!S.field&&S.endingUnlocked&&active()?.hp>0){const key=String(id||'');if(key==='legend'?(S.trialClears>=1):RESEARCH_AREAS.some(a=>a.key===key))newBattle(6,{researchArea:key});return;}
 if(action==='sound'){toggleMusic();return;}
 if(action==='exportSave'){exportSave();return;}
 if(action==='importSave'){document.getElementById('importFile')?.click();return;}
 if(action==='fieldRetry'&&fieldNotice?.kind==='failed'){const f=fieldNotice;fieldNotice=null;beginFieldTyping(f.fieldKind,f.fieldKey,f.phrase);return;}
 if(action==='fieldClose'&&fieldNotice){fieldNotice=null;render();return;}
 if(action==='fieldSolve'&&fieldNotice){fieldPuzzle(id);return;}
 if(action==='trainerFight'&&fieldNotice?.kind==='T'&&active()?.hp>0){const z=fieldNotice.zone;fieldNotice=null;newBattle(z,{trainer:true});return;}
 if(action==='npcHelp'&&fieldNotice?.kind==='N'&&!S.npcHelped.includes(fieldNotice.zone)){const zone=fieldNotice.zone;fieldNotice=null;beginFieldTyping('N',fieldKey(zone,S.field.x,S.field.y),NPC_MISSIONS[zone].word);return;}
 if(action==='leaveField'&&!battle&&!challenge){leaveField();return;}
 if(action==='fieldMove'&&!battle&&!challenge&&!fieldNotice&&S.field){const [dx,dy]=String(id).split(',').map(Number);fieldWalk(dx,dy);return;}
 if(action==='fieldStep'&&!battle&&!challenge&&!fieldNotice&&S.field){const [x,y]=String(id).split(',').map(Number);fieldGoTo(x,y);return;}
 if(action==='trialStart'&&!battle&&!challenge&&!S.field&&S.endingUnlocked&&active()?.hp>0){newBattle(7,{trialStage:0});return;}
 if(action==='trialNext'&&battle?.trial&&battle.phase==='result'&&battle.victory&&battle.trialStage<2){const next=battle.trialStage+1;battle=null;newBattle(7,{trialStage:next});return;}
 if(action==='trialBack'&&battle?.trial&&battle.phase==='result'){battle=null;challenge=null;tab='adventure';save();render();return;}
 if(action==='buy'&&!battle&&!challenge&&!S.field){const cost=id==='balls'?30:id==='potions'?25:Infinity;if(S.coins<cost)return;S.coins-=cost;if(id==='balls')S.balls+=3;else S.potions+=2;S.shopVisits++;save();render();soundFx('catch');notify('道具を買いました！');return;}
 if(action==='practice'&&!battle&&!challenge&&!S.field){fieldNotice=null;beginFieldTyping('practice','',choosePractice(id));return;}
 if(action==='openingNext'||action==='openingSkip'){
   if(action==='openingSkip'||openingIndex>=OPENING.length-1){S.openingDone=true;openingIndex=0;S.openingIndex=0;save();render();soundFx('story');}
   else{openingIndex++;S.openingIndex=openingIndex;save();render();soundFx('story');}
   return;
 }
 if(action==='sceneNext'||action==='sceneSkip'){
   if(!scene)return;
   if(action==='sceneSkip'||sceneIndex>=STORY[scene].frames.length-1)finishScene();
   else{sceneIndex++;render();soundFx('story');}
   return;
 }
 if(scene||tutorialActive())return;
 if(action==='replayScene'&&STORY[id]&&(S.storySeen.includes(id)||(id==='ending'&&S.endingUnlocked))){showScene(id);return;}
 if(action==='ending'&&battle&&battle.phase==='result'&&battle.boss&&battle.victory){
   battle=null;challenge=null;save();showScene('ending');return;
 }
 if(action==='endingContinue'){tab='adventure';render();maybeScene();return;}
 if(action==='endingReplay'&&S.endingUnlocked){showScene('ending');return;}
 if(action==='tab'){if(challenge){notify('タイピング中は移動できません');return;}if(battle){if(id!=='adventure')notify('バトルを終えてから移動してください');return;}if(tab==='aztime'&&id!=='aztime')azClear();tab=id;render();if(id==='adventure')maybeScene();return}
if(action==='starter'&&!S.starter&&[1,4,7].includes(+id)){const num=+id;S.starter=num;const mon={id:num,lv:5,xp:0,hp:1};mon.hp=maxHp(mon);S.roster=[mon];S.seen=[num];S.caught[num]=1;save();render();soundFx('victory');showScene('partner');return}
if(action==='reset'){if(confirm('セーブデータを完全に消去して最初から始めますか？')){clearInterval(tickId);S=initial();battle=null;challenge=null;scene=null;fieldNotice=null;azClear();openingIndex=0;tutorialReplay=false;tutorialInput='';tutorialMoves=0;tab='adventure';save();render()}return}
if(!S.starter)return;
if(action==='explore'&&!battle&&!challenge){enterField(+id);return}
if(action==='questClaim'&&!battle&&!S.field){const q=QUESTS.find(x=>x.id===id);if(!q||!q.unlock()||!q.condition()||S.questClaims.includes(q.id))return;S.questClaims.push(q.id);for(const [k,v] of Object.entries(q.reward))S[k]+=v;save();render();soundFx('badge');notify(q.name+'：報酬を受け取りました！');return;}
if(action==='boxDeposit'&&!battle&&!S.field){const i=Number(id);if(!Number.isInteger(i)||i<0||i>=S.roster.length||S.roster.length<=1)return;const mon=S.roster.splice(i,1)[0];S.box.push(mon);if(S.active===i)S.active=0;else if(i<S.active)S.active--;save();render();notify(P[mon.id].name+'をボックスに預けました');return;}
if(action==='boxWithdraw'&&!battle&&!S.field){const i=Number(id);if(!Number.isInteger(i)||i<0||i>=S.box.length||S.roster.length>=6)return;const mon=S.box.splice(i,1)[0];S.roster.push(mon);save();render();notify(P[mon.id].name+'を手持ちに加えました');return;}
if(action==='rest'&&!battle){S.roster.forEach(x=>x.hp=maxHp(x));save();render();soundFx('heal');notify('町で休んで全員のHPが回復しました');return}
if(action==='lead'&&!battle){const i=+id;if(S.roster[i]&&S.roster[i].hp>0){S.active=i;save();render()}return}
if(action==='potion'&&!battle&&S.potions>0){const a=S.roster[+id];if(a&&a.hp<maxHp(a)){S.potions--;a.hp=Math.min(maxHp(a),a.hp+20);save();render()}return}
if(!battle||challenge)return;
if(action==='breakShield'&&battle.phase==='action'&&battle.shield>0){startTyping('break');return;}
if(action==='focusAttack'&&battle.phase==='action'&&S.focus>=80){S.focus-=80;save();const move=(MOVES[P[active().id].type]||MOVES.normal)[1];startTyping('focus',move);return;}
if(action==='attack'&&battle.phase==='action'){const n=+id;const move=(MOVES[P[active().id].type]||MOVES.normal)[n];if(move&&(n<2||active().lv>=18))startTyping('attack',move);return}
if(action==='catch'&&battle.phase==='action'&&!battle.gym&&S.balls>0&&(S.roster.length<6||S.box.length<500)){S.balls--;save();startTyping('catch');return}
if(action==='battlePotion'&&battle.phase==='action'&&S.potions>0&&active()?.hp<maxHp(active())){S.potions--;const a=active();a.hp=Math.min(maxHp(a),a.hp+30);battle.msg=P[a.id].name+'のHPが30回復した！ 敵の反撃に備えよう。';battle.phase='defend';save();render();soundFx('heal');return;}
if(action==='switch'&&battle.phase==='action'){battle.phase='switch';save();render();return}
if(action==='switcho'&&battle.phase==='switch'){const i=+id;if(S.roster[i]&&i!==S.active&&S.roster[i].hp>0){S.active=i;save();battle.heroStatus=null;battle.msg=P[active().id].name+'に こうたいした！';battle.phase='defend';save();render()}return}
if(action==='cancelSwitch'&&battle.phase==='switch'){battle.phase='action';save();render();return}
if(action==='defend'&&battle.phase==='defend'){startTyping('defend');return}
if(action==='counter'&&battle.phase==='defend'&&bossMechanic()&&S.focus>=20){S.focus-=20;startTyping('counter');return}
if(action==='skipdef'&&battle.phase==='defend'){enemyAttack();return}
if(action==='run'&&battle.phase==='action'&&!battle.gym){battle=null;challenge=null;save();render();notify('無事に逃げられた！');return}
if(action==='backMap'&&battle.phase==='result'){battle=null;challenge=null;fieldNotice=null;tab='adventure';save();render();maybeScene();return}}
// キーボードUI：即時実行コマンド／Tab＋Enter／ショートカットの三経路。
let keyboardActions=[];
function prepareKeyboard(oldFocus){
 const root=document.querySelector('main');if(!root)return;
 let candidates=[];
 if(!scene&&!tutorialActive()&&!challenge){
  const notice=root.querySelector('.fieldMessage');
  if(notice){candidates=[...notice.querySelectorAll('button[data-action]:not(:disabled)')];}
  else if(battle){candidates=[...root.querySelectorAll('button[data-action]:not(:disabled)')].filter(b=>!['typingPause'].includes(b.dataset.action));}
  else if(S.field){candidates=[];}
  else{candidates=[...root.querySelectorAll('button[data-action]:not(:disabled)')].filter(b=>!['fieldMove','fieldStep','fieldClose'].includes(b.dataset.action));}
 }
 keyboardActions=candidates.slice(0,9);
 keyboardActions.forEach((b,i)=>{b.dataset.hotkey=String(i+1);const mark=document.createElement('span');mark.className='hotkeyBadge';mark.setAttribute('aria-hidden','true');mark.textContent=String(i+1);b.prepend(mark);});
 if(oldFocus&&!scene&&!tutorialActive()&&!challenge){const target=[...document.querySelectorAll('button[data-action]')].find(b=>!b.disabled&&b.dataset.action===oldFocus.action&&(b.dataset.id||'')===(oldFocus.id||''));
 if(target)target.focus({preventScroll:true});}
 if(scene){document.querySelector('[data-action="sceneNext"]')?.focus({preventScroll:true});}
 else if(!S.openingDone){document.querySelector('[data-action="openingNext"]')?.focus({preventScroll:true});}
 else if(tutorialActive()){if(S.tutorialStep===0)document.querySelector('[data-action="tutorialStart"]')?.focus({preventScroll:true});if(S.tutorialStep===7)document.querySelector('[data-action="tutorialFinish"]')?.focus({preventScroll:true});}
}
function isTypingTarget(e){return !!e.target.closest('input,select,textarea,[contenteditable="true"]');}
function navAction(key){return {g:'adventure',p:'party',d:'dex',r:'record',t:'aztime',j:'journal',k:'achievements',h:'help'}[key];}
function keyboardControl(e){
 if(e.repeat||e.isComposing||e.ctrlKey||e.altKey||e.metaKey)return;
 const key=e.key,lower=key.length===1?key.toLowerCase():key;
 if(tab==='aztime'&&azSession&&['ready','running'].includes(azSession.phase)&&azKeyInput(e,key))return;
  if(challenge)return; // タイピング専用ハンドラが入力とEscを処理する
 if(scene){if((key==='Enter'||key===' ')&&!e.target.closest('button[data-action]')){e.preventDefault();if(S.musicOn)soundReady();handle('sceneNext');}else if(lower==='s'&& !isTypingTarget(e)){e.preventDefault();handle('sceneSkip');}return;}
 if(!S.openingDone){if((key==='Enter'||key===' ')&&!e.target.closest('button[data-action]')){e.preventDefault();if(S.musicOn)soundReady();handle('openingNext');}else if(lower==='s'){e.preventDefault();handle('openingSkip');}return;}
 if(tutorialActive()){
  if(key==='Tab')return;
  if(isTypingTarget(e)&&e.target.id!=='tutorialTypingInput')return;
  if((key==='Enter'||key===' ')&&e.target.closest('button[data-action]'))return;
  if(tutorialKey(key)){e.preventDefault();return;}
  return;
 }
 if(isTypingTarget(e))return;
 if(S.field&&!battle){
  if(fieldNotice){if(key==='Escape'){e.preventDefault();handle('fieldClose');return;}if((key==='Enter'&&!e.target.closest('button[data-action]'))||lower==='e'){e.preventDefault();const b=document.querySelector('.fieldMessage button[data-action]:not(:disabled)');if(b)b.click();return;}}
  else {
   const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
   if(dirs[lower]){e.preventDefault();fieldWalk(...dirs[lower]);return;}
   if(key==='Escape'){e.preventDefault();handle('leaveField');return;}
  }
 }
 if(lower==='m'){e.preventDefault();if(S.musicOn)soundReady();handle('sound');return;}
 if(key==='Escape'){
  if(tab==='aztime'){e.preventDefault();handle('azBack');return;}
  if(battle?.phase==='switch'){e.preventDefault();handle('cancelSwitch');return;}
  if(battle?.phase==='result'){e.preventDefault();handle(battle.trial?'trialBack':battle.boss&&battle.victory?'ending':'backMap');return;}
  if(battle){notify('バトル中です。画面のコマンドを選んでください。');return;}
  if(tab==='ending'){e.preventDefault();handle('endingContinue');return;}
  if(tab!=='adventure'){e.preventDefault();handle('tab','adventure');return;}
 }
 if(S.field&&!battle){if(lower==='t'){e.preventDefault();handle('tab','aztime');}return;}
 if(key>='1'&&key<='9'&&key.length===1){const b=keyboardActions[Number(key)-1];if(b){e.preventDefault();if(S.musicOn)soundReady();b.click();return;}}
 if(battle)return;
 if(key==='ArrowDown'||key==='ArrowUp'){
  const items=[...document.querySelectorAll('main button:not(:disabled),main select,main input:not([type="hidden"]):not([readonly])')].filter(el=>el.getClientRects().length>0);
  const i=items.indexOf(document.activeElement);
  if(i>=0&&items.length>1){e.preventDefault();items[(i+(key==='ArrowDown'?1:-1)+items.length)%items.length].focus();return;}
 }
 if(key==='Enter'||key===' '){if(e.target.closest('button,select'))return;
  const b=keyboardActions[0];if(b){e.preventDefault();b.click();return;}}
 const dest=navAction(lower);
 if(dest){e.preventDefault();handle('tab',dest);return;}
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;
 if(S.musicOn)soundReady();handle(btn.dataset.action,btn.dataset.id)});
document.addEventListener('keydown',keyboardControl);

document.addEventListener('change',e=>{if(e.target.id==='importFile'){const f=e.target.files?.[0];if(f)importSaveFile(f);e.target.value='';return;}if(e.target.id==='dexFilter'){dexFilter=e.target.value;render();return;}if(e.target.id==='difficulty'){S.difficulty=e.target.value;save();notify('出題レベルを変更しました')}if(e.target.id==='volume'){S.volume=Math.max(0,Math.min(100,Number(e.target.value)));save()}});
document.addEventListener('input',e=>{if(e.target.id==='volume'){S.volume=Math.max(0,Math.min(100,Number(e.target.value)));document.querySelector('#volumeLabel').textContent=S.volume+'%';if(S.musicOn)soundReady();}});
openingIndex=S.openingIndex||0;
render();
if(resumeRecovered)save();
// 再読み込み後、まだ読んでいない物語があれば再開する。
if(!battle&&S.starter&&S.openingDone)maybeScene();
</script>
