function examSettings(){const m=EXAM_MODES[examKind],minutes=examLength==='full'?m.minutes:examKind==='number'?1:2;

function examSeed(i){let x=(i+1)*719+41;x=(Math.imul(x^x>>>13,1664525)+1013904223)>>>0;return x;}
function examPrompt(kind,i){if(kind==='english')return EXAM_ENGLISH[(i*7+Math.floor(i/EXAM_ENGLISH.length))%EXAM_ENGLISH.length];
 if(kind==='number')return EXAM_NUMBERS[(i*5+Math.floor(i/EXAM_NUMBERS.length))%EXAM_NUMBERS.length];
 if(kind==='japanese')return EXAM_JAPANESE[(i*5+Math.floor(i/EXAM_JAPANESE.length))%EXAM_JAPANESE.length];
 const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?@#$%&()+-*/=.,:;';
 const n=examSeed(i),len=45+(n%15);let x=n,raw='';
 for(let j=0;j<len;j++){x=(Math.imul(x,1664525)+1013904223)>>>0;raw+=j&&j%9===0?' ':chars[x%chars.length];}
 return raw;
}
function examJapaneseCount(s){return [...s].filter(ch=>ch!==' '&&ch!=='　').length;}
function examPartialCount(value,parts){let pos=0,count=0;
 for(let i=0;i<parts.length;i++){
  const rest=value.slice(pos);let found=null;
  for(const alt of parts[i])if(rest.startsWith(alt)&&typingStatus(rest.slice(alt.length),parts.slice(i+1)).valid){found=alt;break;}
  if(found===null)break;pos+=found.length;if(!parts[i].includes(' '))count++;
 }return count;
}
function examCurrentChars(e){return e.completed+(e.kind==='japanese'?examPartialCount(e.entry,e.parts):e.entry.length);}
function examTimeMs(e){return Math.max(0,(e.minutes*60000)-(performance.now()-e.started));}
function startExam(){if(!menuOpen('exam')){tabTo('exam');return;}const missing=missingExamPrep(examKind);if(missing.length){notify('🔒 この模擬検定には事前のキー練習が必要です。数字・記号・大文字コースを先に練習してください。');return;}if(challenge)return;clearInterval(examTimer);const cfg=examSettings();
 exam={...cfg,phase:'running',started:performance.now(),pausedAt:0,index:0,prompt:examPrompt(cfg.kind,0),entry:'',typed:0,completed:0,errors:0,streak:0,bestStreak:0,wrongKeys:{},keyHits:{},keyMisses:{},elapsed:0};

}
function examCount(e){return Math.max(0,Math.min(e.quota,examCurrentChars(e)-e.errors));}

function examPress(ev){const e=exam;if(!e||e.phase!=='running')return false;

 if(e.kind==='japanese'){

   expected=before.guide?.[e.entry.length]||'';valid=test.valid;
   if(valid){e.entry+=lower;e.typed++;e.streak++;e.bestStreak=Math.max(e.bestStreak,e.streak);if(test.complete){e.completed+=examJapaneseCount(e.prompt);e.index++;e.prompt=examPrompt(e.kind,e.index);e.entry='';e.parts=segments(e.prompt);render();}}

 }

 else{e.errors++;e.streak=0;if(/^[a-z]$/i.test(expected))e.keyMisses[expected.toLowerCase()]=(e.keyMisses[expected.toLowerCase()]||0)+1;if(/^[a-z]$/i.test(lower))e.wrongKeys[lower]=(e.wrongKeys[lower]||0)+1;sound(160,.07);}

function page(){if(S.rewards?.pending?.length)return rewardView();if(challenge)return challengeView();if(screen==='home')return homeView();if(screen==='dex')return dexView();if(screen==='practice')return practiceView();if(screen==='practiceModes')return practiceModesView();if(screen==='finger')return fingerLearningView();if(screen==='analysis')return analysisView();if(screen==='achievements')return achievementView();if(screen==='benchmark')return benchmarkView();if(screen==='exam')return examView();if(screen==='aztime')return azView();return helpView();}
function render(){document.body.classList.toggle('fxReduced',S.fxMode==='off');const old=document.activeElement,act=old?.dataset?.act,id=old?.dataset?.id;document.getElementById('root').innerHTML=draw();if(challenge&&challenge.phase==='typing'){document.getElementById('typeInput')?.focus({preventScroll:true});setGuide();updateChallengeDisplay();}else if(benchmark&&screen==='benchmark'&&(benchmark.phase==='ready'||benchmark.phase==='running')){document.getElementById('benchInput')?.focus({preventScroll:true});updateBenchmarkDisplay();}else if(exam&&screen==='exam'&&exam.phase==='running'){document.getElementById('examInput')?.focus({preventScroll:true});updateExamDisplay();}else if(az&&screen==='aztime'&&['ready','running'].includes(az.phase)){updateAzDisplay();}else if(act){[...document.querySelectorAll('button[data-act]')].find(e=>e.dataset.act===act&&e.dataset.id===id&&!e.disabled)?.focus({preventScroll:true});}}

function keydown(e){if(S.rewards?.pending?.length){if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();handle('rewardNext');}return;}if(fingerSession&&screen==='finger'&&fingerSession.phase!=='finished'){if(fingerKey(e))return;}if(e.ctrlKey||e.altKey||e.metaKey||e.isComposing)return;if(challenge?.phase==='typing'){if(typingKey(e))return;}if(benchmark&&screen==='benchmark'&&['ready','running'].includes(benchmark.phase)){if(benchmarkPress(e))return;}if(exam&&screen==='exam'&&exam.phase==='running'){if(examPress(e))return;}if(az&&screen==='aztime'&&['ready','running'].includes(az.phase)){if(azPress(e))return;}if(e.target.matches('input,textarea,select'))return;if(e.key==='Escape'){if(screen!=='home'){tabTo('home');return;}}const key=e.key.toLowerCase(),to={g:'home',d:'dex',p:'practice',f:'finger',r:'analysis',b:'benchmark',e:'exam',t:'aztime',k:'achievements',h:'help'}[key];if(to){e.preventDefault();tabTo(to);return;}if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button,select,summary')){const btn=document.querySelector('main button[data-act]:not(:disabled)');if(btn){e.preventDefault();btn.click();}}}
