function toHira(s){
 return [...String(s).normalize('NFKC')].map(c=>{const n=c.charCodeAt(0);return n>=0x30a1&&n<=0x30f6?String.fromCharCode(n-0x60):c}).join('');
}
// 先頭かな（または拗音ペア）の候補と消費するかな文字数。
function romanToken(s,i){
 const pair=s.slice(i,i+2),combined=DIG[pair];
 if(combined){
   const split=(ROMA[s[i]]||[]).flatMap(a=>(ROMA[s[i+1]]||[]).map(b=>a+b));
   return {len:2,forms:[...new Set([...combined,...split])]};
 }
 const c=s[i],forms=ROMA[c]||(/^[a-z0-9!?,.\-/:;\[\]()']$/.test(c)?[c]:null);
 if(!forms)throw new Error('対応していない出題文字: '+c+' (位置 '+i+')');
 return {len:1,forms};
}
function segments(source){
 const s=toHira(source).replace(/[\s　]+/g,'').toLowerCase();
 const out=[];
 for(let i=0;i<s.length;){
   if(s[i]==='っ'&&i+1<s.length){
     const next=romanToken(s,i+1),forms=[];
     for(const r of next.forms){
       if(/^[bcdfghjklmpqrstvwxyz]/.test(r)){
         forms.push(r[0]+r); // っ + ちゃ => ccha / ttya / ccya など、同じ方式で連動
         if(r.startsWith('ch'))forms.push('t'+r); // tcha などIMEで一般的な入力
       }
       for(const small of ROMA['っ'])forms.push(small+r);
     }
     out.push([...new Set(forms)]);i+=next.len+1;continue;
   }
   if(s[i]==='ん'){
     const next=s[i+1];
     // ん+母音/や行は「na→な」「nya→にゃ」などとの混同を防ぐ。
     // 「んな」は nna を許容するため、後続の「な行」では単独の n も認める。
     const ambiguous=!!next&&('あいうえおやゆよゃゅょぁぃぅぇぉ'.includes(next));
     out.push(ambiguous?['nn',"n'",'xn']:['n','nn',"n'",'xn']);i++;continue;
   }
   const tok=romanToken(s,i);out.push(tok.forms);i+=tok.len;
 }
 return out;
}
// 入力済みのキー列に適合する経路を探索。メモ化で長い文章でも安定動作。
// guide はその時点の入力に合う正解候補全文なので、途中で si→shi 等を変更しても追従。
function typingStatus(value,parts){
 const entered=String(value).toLowerCase(),memo=new Map();
 function go(i,pos){
   const key=i+':'+pos;
   if(memo.has(key))return memo.get(key);
   if(i===parts.length)return pos===entered.length?'':null;
   const rest=entered.slice(pos);
   for(const alternative of parts[i]){
     if(rest.startsWith(alternative)){
       const tail=go(i+1,pos+alternative.length);
       if(tail!==null){memo.set(key,alternative+tail);return alternative+tail;}
     }else if(alternative.startsWith(rest)){
       const guide=alternative+parts.slice(i+1).map(a=>a[0]).join('');
       memo.set(key,guide);return guide;
     }
   }
   memo.set(key,null);return null;
 }
 const guide=go(0,0);
 return {valid:guide!==null,complete:guide!==null&&guide===entered,guide};
}

function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const o=JSON.parse(raw);if(!o||o.schema!==SAVE_SCHEMA||typeof o!=='object')return;const d=newSave();for(const k of Object.keys(d)){if(Object.prototype.hasOwnProperty.call(o,k))d[k]=o[k];}if(!d.rescued||typeof d.rescued!=='object'||Array.isArray(d.rescued))d.rescued={};if(!d.seen||typeof d.seen!=='object'||Array.isArray(d.seen))d.seen={};if(!Array.isArray(d.stones))d.stones=[];if(!Array.isArray(d.foundStones))d.foundStones=[];d.stones=[...new Set(d.stones.filter(x=>Number.isInteger(x)&&x>=0&&x<8))];if(!d.stats||typeof d.stats!=='object')d.stats=newSave().stats;if(!Array.isArray(d.stats.history))d.stats.history=[];if(!Number.isFinite(d.stats.bestCombo))d.stats.bestCombo=0;if(!Array.isArray(d.azRuns))d.azRuns=[];if(!Array.isArray(d.azMilestones))d.azMilestones=[];if(!Array.isArray(d.recent))d.recent=[];d.opening=Math.max(0,Math.min(7,Number(d.opening)||0));d.tutorialStep=Math.max(0,Math.min(7,Number(d.tutorialStep)||0));d.zone=Math.max(0,Math.min(7,Number(d.zone)||0));if(d.field&&(!Number.isInteger(d.field.zone)||!Number.isInteger(d.field.x)||!Number.isInteger(d.field.y)))d.field=null;S=d;}catch(e){console.warn('save parse failed',e);}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));return true;}catch(e){notify('保存できません。ブラウザの保存領域・プライベートモードを確認してください。');return false;}}
function notify(s){notice=String(s);document.querySelector('.fixedMsg')?.remove();const e=document.createElement('div');e.className='fixedMsg';e.textContent=notice;document.body.appendChild(e);setTimeout(()=>{if(e.isConnected)e.remove();},3300);}
function sound(freq=660,duration=.065){if(!S.music)return;try{toneContext??=new (window.AudioContext||window.webkitAudioContext)();const o=toneContext.createOscillator(),v=toneContext.createGain();o.type='sine';o.frequency.value=freq;v.gain.setValueAtTime(.045,toneContext.currentTime);v.gain.exponentialRampToValueAtTime(.001,toneContext.currentTime+duration);o.connect(v);v.connect(toneContext.destination);o.start();o.stop(toneContext.currentTime+duration);}catch(e){}}
function rescuedCount(zone){return Object.keys(S.rescued).filter(id=>pickIndex.has(id)&&pickIndex.get(id).zone===zone).length;}
function rescuedTotal(){return PICKS.filter(p=>!!S.rescued[p.id]).length;}
function seenTotal(){return PICKS.filter(p=>!!S.seen[p.id]).length;}
function unlocked(zone){return zone===0||S.stones.includes(zone-1);}
function canStone(zone){return rescuedCount(zone)>=ZONES[zone].goal;}
function progressHeader(){return `<div class="hud"><span class="chip green">📖 ${rescuedTotal()} / ${PICKS.length}枚</span><span class="chip gold">🔮 ${S.stones.length} / 8</span><button class="btn ghost tiny" data-act="sound">音 ${S.music?'ON':'OFF'}</button></div>`;}
function navigation(){const tabs=[['adventure','🗺️','冒険','G'],['dex','📖','救出図鑑','D'],['journal','🔮','石碑と物語','J'],['record','⌨️','タイピング記録','R'],['aztime','⏱️','A～Z','T'],['help','❔','遊び方・設定','H']];return `<nav class="side" aria-label="画面メニュー">${tabs.map(([id,i,t,k])=>`<button class="navbutton ${screen===id?'active':''}" data-act="tab" data-id="${id}">${i} ${t} <small style="margin-left:auto;color:#9bb4cb">${k}</small></button>`).join('')}<div class="sideInfo"><b>救出：${rescuedTotal()}枚</b><br>未救出：${PICKS.length-rescuedTotal()}枚<br>発見：${seenTotal()}枚<br>石碑：${S.stones.length} / 8<br>歩数：${S.walked||0}<br>${S.ending?'🌟 ことばの灯 復活済み':'🔮 石碑を解いて次へ'}</div></nav>`;}
function draw(){return `<div class="app"><header class="top"><div class="brand"><div class="logo">T</div><div><small>POKÉMON × TYPING</small><h1>ポケモン・タイピングクエスト <span class="caption">Ver14</span></h1></div></div>${progressHeader()}</header><div class="shell">${navigation()}<div class="main"><main class="view" id="view">${page()}</main><footer class="foot">タイピング：英字入力（IME OFF）／ 矢印・WASD：移動 ／ Tab：選択 ／ Enter：決定</footer></div></div></div>`;}
function page(){if(!S.openingDone)return openingView();if(!S.partner)return partnerView();if(!S.tutorialDone)return challenge?.kind==='tutorial'?challengeView():tutorialView();if(challenge)return challengeView();if(screen==='adventure')return rescueLast?resultView():S.field?fieldView():adventureView();if(screen==='dex')return dexView();if(screen==='journal')return journalView();if(screen==='record')return recordView();if(screen==='aztime')return azView();if(screen==='ending')return endingView();return helpView();}
function render(){const prev=document.activeElement;const act=prev?.dataset?.act||null,id=prev?.dataset?.id||null;document.getElementById('root').innerHTML=draw();if(challenge&&challenge.phase==='typing'){document.getElementById('typeInput')?.focus({preventScroll:true});updateChallengeDisplay();}else if(az&&['ready','running'].includes(az.phase)&&screen==='aztime'){updateAzDisplay();}else if(act){const cand=[...document.querySelectorAll('[data-act]')].find(e=>e.dataset.act===act&&(e.dataset.id||'')===(id||'')&&!e.disabled);cand?.focus({preventScroll:true});}else if(!S.openingDone){document.querySelector('[data-act="openingNext"]')?.focus({preventScroll:true});}}
function openingView(){const f=OPENING[S.opening];return `<div class="heading"><h2>物語のはじまり</h2><span class="chip">${S.opening+1} / ${OPENING.length}</span></div><div class="opening"><div class="openingInner"><div class="openingIcon">${f.icon}</div><div class="sub">${f.speaker}</div><h2 class="openingTitle">${f.title}</h2><p class="openingQuote">${htm(f.text)}</p><div class="openSteps">Enterキーで次へ進めます</div><div class="buttons" style="justify-content:center;margin-top:18px"><button class="btn gold" data-act="openingNext">${S.opening===OPENING.length-1?'冒険を始める':'次へ進む ▶'}</button><button class="btn ghost" data-act="openingSkip">物語をスキップ</button></div></div></div>`;}
function partnerView(){return `<div class="heading"><h2>旅の案内役を選ぼう</h2></div><p class="intro" style="margin-bottom:10px">ここで選ぶポケモンは育成・戦闘をしない案内役です。ゲームの難易度に違いはありません。</p><div class="grid3">${[['🌱','フシギダネ'],['🔥','ヒトカゲ'],['💧','ゼニガメ']].map(([i,n])=>`<div class="panel center"><div style="font-size:72px">${i}</div><h3>${n}</h3><button class="btn gold full" data-act="partner" data-id="${n}">一緒に冒険する</button></div>`).join('')}</div>`;}
function tutorialView(){const st=TUTORIAL[S.tutorialStep],isType=st[2]==='typing';return `<div class="heading"><h2>⌨️ 冒険チュートリアル</h2><span class="chip">${S.tutorialStep+1} / 8</span></div><div class="panel narrow"><h3>${st[0]}</h3><p class="intro">${st[1]}</p>${isType?`<div class="notice" style="margin:14px 0">練習問題： <b>${EXERCISES[S.tutorialStep===2?0:1]}</b></div><button class="btn gold" data-act="tutorialType">練習タイピングを開始</button>`:`<div style="height:16px"></div><button class="btn gold" data-act="tutorialNext">${S.tutorialStep===7?'冒険へ出発':'理解した・次へ進む ▶'}</button>`}<p class="caption" style="margin-top:16px">チュートリアルは8段階。文字入力では複数のローマ字表記を使用できます。</p></div>`;}
function adventureView(){const n=S.stones.length;return `<div class="heading"><h2>🗺️ 冒険マップ</h2><span class="chip gold">石碑 ${n}/8</span></div><div class="panel banner"><div><h3>ことばの灯を取り戻そう</h3><p class="sub">各地域でピックを助け、石碑を解読すると次へ進めます。クリア後は全ピック収集へ。</p></div><span class="chip green">救出 ${rescuedTotal()}枚</span></div><div class="zones">${ZONES.map((z,i)=>{const locked=!unlocked(i),done=S.stones.includes(i),count=rescuedCount(i);return `<div class="zoneCard ${locked?'locked':''}"><h3>${z.emoji} ${i+1}. ${z.name}</h3><div class="hint">${z.subtitle}</div><div class="sub">救出 ${count}/${z.goal}枚　${done?'✅石碑解読済み':locked?'🔒未開放':'🔮石碑を探す'}</div><button class="btn ${!locked?'gold':'ghost'} tiny" data-act="enterZone" data-id="${i}" ${locked?'disabled':''}>${locked?'前の石碑を解読':'探索する'}</button></div>`;}).join('')}</div>${S.ending?`<div class="notice" style="margin-top:10px">🌟 世界に声が戻りました！ エンディング後も残り${PICKS.length-rescuedTotal()}枚を探せます。 <button class="btn tiny ghost" data-act="ending">エンディングを見る</button></div>`:''}`;}
function startPos(zone){const m=MAPS[zone];const y=m.findIndex(s=>s.includes('S'));return {zone,x:m[y].indexOf('S'),y};}
function enterZone(i){const z=Number(i);if(!Number.isInteger(z)||z<0||z>=8||!unlocked(z))return;S.zone=z;S.field=startPos(z);S.visited[`${z}:${S.field.x}:${S.field.y}`]=1;rescueLast=null;save();render();}
function tileName(c){return {S:'🏠',M:'🌿',R:'🔮',E:'🚪',N:'💬',C:'🎁',T:'✏️',B:'🏅',H:'💧','.' :''}[c]||'';}
function fieldView(){const z=S.field.zone,m=MAPS[z],done=S.stones.includes(z),count=rescuedCount(z),goal=ZONES[z].goal;const cells=m.map((line,y)=>[...line].map((c,x)=>{const own=S.field.x===x&&S.field.y===y,unlockedTile=S.visited[`${z}:${x}:${y}`],sym=own?'🧑':tileName(c),aria=own?'主人公':c==='R'?'石碑':c==='M'?'ピックを探す':c==='E'?'出口':c==='N'?'案内人':'地形';return `<button class="tile ${own?'player':c==='#'?'wall':c==='R'?'stone':c==='M'?'find':c==='E'?'exit':'path'} ${unlockedTile&&!own?'revealed':''}" data-act="tileStep" data-id="${x},${y}" ${c==='#'?'disabled':''} aria-label="${aria} ${x+1}列${y+1}行" title="${aria}">${sym||'·'}</button>`;}).join('')).join('');const remaining=ZONE_PICKS[z].filter(p=>!S.rescued[p.id]).length;return `<div class="heading"><h2>${ZONES[z].emoji} ${ZONES[z].name}</h2><button class="btn tiny ghost" data-act="leaveZone">← 冒険マップ</button></div><div class="fieldGrid"><div class="panel fieldPanel"><div class="sub">${ZONES[z].story}</div><div class="map" role="group" aria-label="探索マップ">${cells}</div><div class="movement"><span></span><button class="btn tiny" data-act="move" data-id="0,-1">↑</button><span></span><button class="btn tiny" data-act="move" data-id="-1,0">←</button><button class="btn tiny" data-act="move" data-id="0,1">↓</button><button class="btn tiny" data-act="move" data-id="1,0">→</button></div></div><div class="fieldSide"><div class="panel"><h3>📖 このエリアの救出</h3><div class="stat"><span>石碑に必要</span><b>${Math.min(count,goal)} / ${goal}枚</b></div><div class="bar"><i style="width:${Math.min(100,count/goal*100)}%"></i></div><div class="stat"><span>未救出</span><b>${remaining}枚</b></div><div class="stat"><span>石碑</span><b>${done?'解読済み':canStone(z)?'挑戦可能':'準備中'}</b></div><button class="btn gold full" data-act="searchPick" ${remaining?'':'disabled'}>🔍 未救出ピックを探す</button></div><div class="panel"><h3>🔮 次の目標</h3><p class="sub" style="margin-bottom:9px">${done?z===7?'ことばの灯が復活！ 図鑑完成を目指そう。':'次のエリアが開放されています。':canStone(z)?S.foundStones.includes(z)?'発見した石碑を下のボタンから解読できます。':'マップの🔮まで歩いて、石碑を発見しましょう。':`あと${Math.max(0,goal-count)}枚助けてから石碑に挑戦しよう。`}</p><button class="btn green full" data-act="stone" ${done||!canStone(z)||!S.foundStones.includes(z)?'disabled':''}>${done?'✅ 石碑解読済み':'石碑を解読する'}</button>${done&&z<7?`<button class="btn ghost full" style="margin-top:6px" data-act="nextZone">次のエリアへ ▶</button>`:''}</div><div class="panel"><h3>💬 案内役：${htm(S.partner)}</h3><p class="sub">地図の🌿は探索地点。石碑は🔮、出口は🚪。救出したピックはもう出ません。</p></div></div></div>`;}
function moveField(dx,dy){if(!S.field||challenge||rescueLast)return;const f=S.field,nx=f.x+dx,ny=f.y+dy;const c=MAPS[f.zone]?.[ny]?.[nx];if(!c||c==='#')return;f.x=nx;f.y=ny;S.walked++;S.visited[`${f.zone}:${nx}:${ny}`]=1;save();if(c==='M'){searchPick();return;}if(c==='R'){if(!S.foundStones.includes(f.zone)){S.foundStones.push(f.zone);save();}if(S.stones.includes(f.zone)){notify('解読済みの石碑です。');}else if(!canStone(f.zone)){notify(`この地域であと${ZONES[f.zone].goal-rescuedCount(f.zone)}枚のピックを救出してください。`);}else{startStone();return;}}if(c==='E'){if(S.stones.includes(f.zone)&&f.zone<7){enterZone(f.zone+1);return;}notify(f.zone===7?'最後の石碑を解読するとエンディングです。':'まずこの地域の石碑を解読しよう。');}if(c==='N'){notify('案内人：「未救出のピックを探そう。石碑は救出のあとで！」');}if(c==='C'){const t=`${f.zone}:${nx}:${ny}`;if(!S.treasures.includes(t)){S.treasures.push(t);save();notify('古い宝箱を発見！ 救出に役立つ言葉を見つけた。');}else notify('開けた宝箱です。');}render();}
function pickRandom(arr){if(!arr.length)return null;return arr[Math.floor(Math.random()*arr.length)];}
function searchPick(){if(!S.field||challenge)return;const z=S.field.zone,pool=ZONE_PICKS[z].filter(p=>!S.rescued[p.id]);if(!pool.length){notify('この地域のピックはすべて救出済みです。');return;}const p=pickRandom(pool);S.seen[p.id]=1;save();startChallenge('rescue',p);}
function image(p){if(!p||!/^https:\/\/pokemonfrienda\.com\//.test(p.img))return `<div class="pickPicture"><div class="pickNoImg">🎴</div></div>`;return `<div class="pickPicture"><div class="pickNoImg">🎴</div><img class="pickImg" src="${htm(p.img)}" loading="eager" alt="${htm(p.name)} のフレンダピック" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"></div>`;}
const CATEGORY_LABEL={star2_star3:'ノーマルピック',treasure:'トレジャーピック',super_treasure:'スーパートレジャーピック',parallel_art:'パラレルピック',shiny:'色違いピック'};
function pickHero(p){return `<div class="pickHero"><div>${image(p)}</div><div class="pickInfo"><div class="pickTitle">${htm(p.series)} ／ ${htm(p.no)}</div><h2>${htm(p.name)}</h2><div class="grade">${p.grade?'★'.repeat(p.grade):'🌟 スペシャル'}</div><div class="sub">${htm(CATEGORY_LABEL[p.category]||p.category)}${p.poke_ene?' ／ ポケエネ '+p.poke_ene:''}</div><p class="intro" style="margin-top:8px">このピックに宿るポケモンの声を取り戻そう！</p></div></div>`;}
function difficultyFor(p){const g=gradeOf(p);return {grade:g,label:p.grade?`★${g}`:'特別',count:g===2?1:g===3?2:g===4?2:3,mult:g===2?1.15:g===3?1:g===4?0.95:0.9};}
function pickPrompt(g){if(g>=5&&Math.random()<.58){const a=pickRandom(WORDS_MIDDLE),b=pickRandom(WORDS_MIDDLE.filter(t=>t!==a));const c=a+' '+b;if(!S.recent.includes(c))return c;}const pool=g<=2?WORDS_SHORT:g===3?WORDS_MIDDLE:g===4?[...WORDS_MIDDLE,...WORDS_LONG]:WORDS_LONG;const fresh=pool.filter(x=>!S.recent.includes(x));return pickRandom(fresh.length?fresh:pool);}
function startChallenge(kind,p=null){cancelTimers();const z=S.field?.zone??0,config=p?difficultyFor(p):{grade:kind==='final'?5:kind==='stone'?4:2,label:'石碑',count:kind==='final'?3:kind==='stone'&&(z===3||z===5)?2:1,mult:1.15};challenge={kind,pickId:p?.id||'',zone:z,phase:'typing',stage:0,questions:config.count,grade:config.grade,label:config.label,mult:config.mult,errors:0,typed:0,combo:0,bestCombo:0,totalMs:0,questionCounted:false,started:0,pausedAt:0,remaining:0,prompt:'',parts:[],entry:'',guide:'',duration:0,};startQuestion();}
function startStone(){if(!S.field||!S.foundStones.includes(S.field.zone)||S.stones.includes(S.field.zone)||!canStone(S.field.zone)){notify('地図の石碑🔮を見つけ、必要なピックを救出してください。');return;}startChallenge(S.field.zone===7?'final':'stone');}
function startQuestion(){if(!challenge)return;const c=challenge;const prompt=c.kind==='tutorial'?(S.tutorialStep===6?EXERCISES[1]:EXERCISES[0]):c.kind==='rescue'?pickPrompt(c.grade):c.stage===0?ZONES[c.zone].stone:(c.kind==='final'?WORDS_LONG[(c.stage+c.zone)%WORDS_LONG.length]:WORDS_MIDDLE[c.zone%WORDS_MIDDLE.length]);c.prompt=prompt;c.parts=segments(prompt);c.guide=c.parts.map(x=>x[0]).join('');c.entry='';c.questionCounted=false;c.started=performance.now();c.pausedAt=0;c.duration=Math.max(9,Math.min(85,(c.grade===2?9:c.grade===3?9:c.grade===4?10:11)+c.guide.length*(c.grade===2?.86:c.grade===3?.66:c.grade===4?.60:.54))*c.mult);c.duration=+(c.duration.toFixed(1));S.recent=[prompt,...S.recent.filter(x=>x!==prompt)].slice(0,14);render();tick=setInterval(updateChallengeDisplay,60);}
function setGuide(){const c=challenge;if(!c)return;const guide=typingStatus(c.entry,c.parts).guide||c.guide;const text=document.getElementById('romanGuide');if(text){text.innerHTML=`<span class="done">${htm(c.entry)}</span><span class="next">${htm(guide.slice(c.entry.length,c.entry.length+1))}</span>${htm(guide.slice(c.entry.length+1))}`;}const input=document.getElementById('typeInput');if(input)input.value=c.entry;const k=document.getElementById('typeKeys');if(k)k.textContent=`入力 ${c.entry.length}/${guide.length}文字`;
}
function updateChallengeDisplay(){const c=challenge;if(!c)return;setGuide();const rem=c.pausedAt?c.remaining:Math.max(0,c.duration-(performance.now()-c.started)/1000);const t=document.getElementById('timeText');if(t)t.textContent=`残り ${rem.toFixed(1)}秒`;const bar=document.getElementById('timeBar');if(bar)bar.style.width=(rem/c.duration*100)+'%';const mis=document.getElementById('mistakes');if(mis)mis.textContent=`ミス ${c.errors}回`;if(!c.pausedAt&&rem<=0){endChallenge(false);}}
function handleTypingKey(e){const c=challenge;if(!c||c.phase!=='typing')return false;if(e.key==='Escape'){e.preventDefault();pauseChallenge();return true;}if(e.key==='Tab'){return false;}if(e.key==='Enter'&&e.target.closest('button'))return false;if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.isComposing||e.key==='Process')return true;if(e.key.length!==1)return true;e.preventDefault();if(c.pausedAt)return true;const key=e.key.toLowerCase(),test=typingStatus(c.entry+key,c.parts);if(test.valid){c.entry+=key;c.typed++;c.combo++;c.bestCombo=Math.max(c.bestCombo,c.combo);if(c.entry.length%5===0)sound(730,.025);if(test.complete){c.totalMs+=Math.max(100,performance.now()-c.started);c.questionCounted=true;c.stage++;if(c.stage>=c.questions){endChallenge(true);}else{startQuestion();}return true;}}else{c.errors++;c.combo=0;sound(170,.09);}updateChallengeDisplay();return true;}
function pauseChallenge(){if(!challenge)return;const c=challenge;if(!c.pausedAt){c.remaining=Math.max(0,c.duration-(performance.now()-c.started)/1000);c.pausedAt=performance.now();}else{c.started=performance.now()-(c.duration-c.remaining)*1000;c.pausedAt=0;document.getElementById('typeInput')?.focus();}render();}
function cancelTimers(){if(tick!==null){clearInterval(tick);tick=null;}if(azTimer!==null){clearInterval(azTimer);azTimer=null;}}
function endChallenge(ok){if(!challenge)return;cancelTimers();const c=challenge;if(!c.questionCounted)c.totalMs+=Math.max(100,Math.min(c.duration*1000,performance.now()-c.started));c.phase=ok?'success':'failure';S.stats.attempts++;if(ok)S.stats.success++;S.stats.keys+=c.typed;S.stats.errors+=c.errors;S.stats.bestCombo=Math.max(S.stats.bestCombo,c.bestCombo);const wpm=Math.round(c.typed/5/Math.max(0.1,c.totalMs/60000));S.stats.history.unshift({kind:c.kind,grade:c.grade,wpm,ms:Math.round(c.totalMs),typed:c.typed,errors:c.errors,success:!!ok,date:new Date().toISOString()});S.stats.history=S.stats.history.slice(0,30);if(ok&&c.kind==='rescue'){if(!S.rescued[c.pickId])S.rescued[c.pickId]={zone:c.zone,date:new Date().toISOString(),errors:c.errors};}if(ok&&(c.kind==='stone'||c.kind==='final')){if(!S.stones.includes(c.zone))S.stones.push(c.zone);if(c.kind==='final'){S.ending=true;}}if(ok&&c.kind==='tutorial'){S.tutorialStep=Math.min(7,S.tutorialStep+1);}save();sound(ok?1000:240,.16);render();}
function exitChallenge(){if(!challenge)return;const c=challenge;cancelTimers();challenge=null;rescueLast=null;if(c.kind==='tutorial'){render();return;}if(c.phase==='failure'&&c.kind==='rescue'){rescueLast={id:c.pickId,failed:true};}else if(c.kind==='rescue'){rescueLast={id:c.pickId,success:true};}else if(c.phase==='success'&&c.kind==='final'){screen='ending';}else if(c.phase==='failure'&&(c.kind==='stone'||c.kind==='final')){notify('石碑の解読に失敗。いつでも再挑戦できます。');}render();}
function challengeView(){const c=challenge,p=pickIndex.get(c.pickId);const title=c.kind==='rescue'?`🎴 ピック救出：${p?.name||''}`:c.kind==='tutorial'?'⌨️ 練習タイピング':c.kind==='final'?'✨ ことばの塔・最終試練':'🔮 石碑の解読';const note=c.kind==='rescue'?`ピック：${htm(p?.no||'')} ／ ${htm(p?.series||'')}`:`${ZONES[c.zone]?.name||'練習'}`;return `<div class="heading"><h2>${title}</h2><span class="chip">${note}</span></div><div class="panel narrow">${p?pickHero(p):`<div class="center" style="font-size:39px;margin-bottom:7px">${c.kind==='final'?'✨':'🔮'}</div>`}${c.phase==='typing'?`<div class="typingCard"><div class="stat"><span>${c.label}：問題 ${c.stage+1} / ${c.questions}</span><b id="timeText">残り ${c.duration.toFixed(1)}秒</b></div><div class="bar" style="margin:7px 0 12px"><i id="timeBar" style="width:100%;background:linear-gradient(90deg,#e6a15f,#f9d574)"></i></div><h3>${htm(c.prompt)}</h3><div class="roman" id="romanGuide">${htm(c.guide)}</div><input id="typeInput" class="typingInput" readonly autocomplete="off" spellcheck="false" aria-label="ローマ字入力用、キーを押して答える" value="${htm(c.entry)}" placeholder="キーボードで入力"><div class="typingStats"><span id="typeKeys">入力 0/${c.guide.length}文字</span><span id="mistakes">ミス ${c.errors}回</span></div><div class="buttons" style="justify-content:center"><button class="btn ghost tiny" data-act="pause">${c.pausedAt?'▶ 再開（Esc）':'⏸ 一時停止（Esc）'}</button><button class="btn red tiny" data-act="giveup">挑戦を中止</button></div><p class="caption" style="margin-top:8px">英字入力（IME OFF）。Backspaceと貼り付けは無効。時間内に入力すると次の問題へ。</p></div>`:`<div class="center"><div style="font-size:57px">${c.phase==='success'?'🎉':'💭'}</div><h2 style="margin:10px">${c.phase==='success'?'成功！':'時間切れ・失敗'}</h2><p class="intro">${c.kind==='rescue'?(c.phase==='success'?'このピックを救出しました！ 以後、再出現しません。':'今回は救出できませんでした。再挑戦できます。'):c.phase==='success'?c.kind==='final'?'すべての石碑が光り、ことばの灯が戻りました！':'石碑を解読しました。次の地域への道が開きます。':'この石碑はもう一度挑戦できます。'}</p><p class="sub" style="margin:8px">ミス ${c.errors}回 ／ 完了 ${c.stage}/${c.questions}問</p><div class="buttons" style="justify-content:center;margin-top:10px"><button class="btn gold" data-act="finishChallenge">${c.kind==='final'&&c.phase==='success'?'エンディングへ':'探索に戻る'}</button>${c.phase==='failure'?`<button class="btn green" data-act="retryChallenge">もう一度挑戦</button>`:''}</div></div>`}</div>`;}
function resultView(){const p=pickIndex.get(rescueLast.id);return `<div class="heading"><h2>🎴 救出の結果</h2></div><div class="panel narrow">${p?pickHero(p):''}<div class="notice" style="margin:12px 0">${rescueLast.success?'✅ 救出したピックは今後の出現対象から除外されます。':'もう一度挑戦するまで、未救出ピックとして残ります。'}</div><div class="buttons"><button class="btn gold" data-act="searchAgain">次のピックを探す</button>${rescueLast.failed?`<button class="btn green" data-act="retryPick" data-id="${htm(rescueLast.id)}">同じピックに再挑戦</button>`:''}<button class="btn ghost" data-act="backField">探索マップに戻る</button></div></div>`;}
function dexView(){const total=PICKS.length,got=rescuedTotal(),pct=total?got/total*100:0;let pool=PICKS;if(dexSeries!=='all')pool=pool.filter(p=>p.series===dexSeries);if(dexFilter==='rescued')pool=pool.filter(p=>S.rescued[p.id]);if(dexFilter==='missing')pool=pool.filter(p=>!S.rescued[p.id]);if(dexFilter==='seen')pool=pool.filter(p=>S.seen[p.id]&&!S.rescued[p.id]);const search=dexSearch.trim().toLowerCase();if(search)pool=pool.filter(p=>[p.name,p.no,p.series].some(v=>v.toLowerCase().includes(search)));const pages=Math.max(1,Math.ceil(pool.length/40));dexPage=Math.max(0,Math.min(dexPage,pages-1));const arr=pool.slice(dexPage*40,dexPage*40+40);const series=[...new Set(PICKS.map(p=>p.series))];return `<div class="heading"><h2>📖 フレンダ救出図鑑</h2><span class="chip green">救出済み ${got}/${total}</span></div><div class="panel"><div class="banner"><div><div class="sub">図鑑の救出率</div><div class="meterLarge">${pct.toFixed(1)}%</div></div><div class="sub">発見 ${seenTotal()}枚 ／ 未救出 ${total-got}枚<br>同じポケモンでもピック単位で登録します。</div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="filters" style="margin-top:12px"><input id="dexSearch" type="search" placeholder="名前・番号で検索" value="${htm(dexSearch)}" aria-label="ピック検索"><select id="dexFilter" aria-label="救出状態"><option value="all" ${dexFilter==='all'?'selected':''}>すべて</option><option value="rescued" ${dexFilter==='rescued'?'selected':''}>救出済み</option><option value="missing" ${dexFilter==='missing'?'selected':''}>未救出</option><option value="seen" ${dexFilter==='seen'?'selected':''}>発見済み・未救出</option></select><select id="dexSeries" aria-label="シリーズ"><option value="all">すべての弾・シリーズ</option>${series.map(s=>`<option value="${htm(s)}" ${dexSeries===s?'selected':''}>${htm(s)}</option>`).join('')}</select><button class="btn ghost tiny" data-act="dexClear">条件クリア</button></div><p class="caption" style="margin-top:5px">検索・一覧はこの枠内でスクロール。未発見ピックの名前は「？？？」表示です。</p><div class="dexList"><div class="dexGrid">${arr.map(p=>{const yes=!!S.rescued[p.id],seen=!!S.seen[p.id],visible=yes||seen;return `<div class="dexItem">${visible&&p.img?`<img src="${htm(p.img)}" loading="lazy" alt="${htm(p.name)}" onerror="this.style.display='none'">`:`<span style="width:60px;text-align:center;font-size:29px">${yes?'✅':seen?'🎴':'❔'}</span>`}<div class="label"><b>${visible?htm(p.name):'？？？'}</b><small>${visible?htm(p.no):'未発見'} ／ ${p.grade?'★'+p.grade:'SP'}</small><small>${yes?'✅ 救出済み':seen?'🔍 発見済み':'未発見'}</small></div></div>`;}).join('')||'<p class="sub">該当ピックがありません。</p>'}</div></div><div class="stat"><span>${pool.length}枚中 ${pool.length?dexPage*40+1:0}〜${Math.min(pool.length,(dexPage+1)*40)}件を表示</span><div class="buttons"><button class="btn tiny ghost" data-act="dexPrev" ${dexPage===0?'disabled':''}>◀ 前へ</button><span class="chip">${dexPage+1}/${pages}</span><button class="btn tiny ghost" data-act="dexNext" ${dexPage>=pages-1?'disabled':''}>次へ ▶</button></div></div></div>`;}
function journalView(){return `<div class="heading"><h2>🔮 石碑と物語</h2><span class="chip">${S.stones.length} / 8 解読</span></div><div class="panel"><h3>ことばの灯の真実</h3><p class="intro">世界の声を取り戻すには8つの石碑に刻まれた言葉をつなぐ必要があります。各地域の石碑を見つけ、規定数のピックを助けて解読してください。</p></div><div class="grid2">${ZONES.map((z,i)=>`<div class="card"><h3>${S.stones.includes(i)?'✨':unlocked(i)?'🔮':'🔒'} ${i+1}. ${z.name}</h3><p class="sub">${unlocked(i)?z.story:'前の地域の石碑を解読すると開放されます。'}</p><div class="stat"><span>ピック救出</span><b>${rescuedCount(i)} / ${z.goal}</b></div><div class="sub">石碑：${S.stones.includes(i)?'解読済み':S.foundStones?.includes(i)?'発見済み・未解読':'未発見'}</div></div>`).join('')}</div>${S.ending?'<div class="panel"><h3>🌟 ことばの灯、復活</h3><p class="intro">言葉で結んだひとつひとつの救出が、世界を照らす大きな光になりました。これからは救出図鑑の完成を目指しましょう。</p></div>':''}`;}
function recordView(){const st=S.stats;const recent=st.history||[];const avgWpm=recent.length?Math.round(recent.reduce((n,x)=>n+(x.wpm||0),0)/recent.length):0;const rec=Object.entries(S.rescued).filter(([id])=>pickIndex.has(id)).sort((a,b)=>String(b[1].date).localeCompare(String(a[1].date))).slice(0,15);return `<div class="heading"><h2>⌨️ タイピング記録</h2><button class="btn gold tiny" data-act="tab" data-id="aztime">⏱️ A～Zへ</button></div><div class="grid3"><div class="card"><div class="sub">タイピング挑戦</div><h2>${st.attempts}回</h2></div><div class="card"><div class="sub">成功回数</div><h2>${st.success}回</h2></div><div class="card"><div class="sub">平均WPM / ミスタイプ</div><h2>${avgWpm} <small class="muted" style="font-size:12px">/ ${st.errors}回</small></h2></div></div><div class="panel" style="margin-top:12px"><h3>最近のタイピング速度（WPM）</h3><p class="caption">正しく入力したキー数÷5を1分換算した参考値。速さだけでなく成功数も大切です。</p>${recent.length?recent.slice(0,10).map(r=>`<div class="historyRow"><span>${r.success?'✅':'—'} ${r.kind==='rescue'?'救出':r.kind==='stone'?'石碑':r.kind==='final'?'最終試練':'練習'}　${r.wpm} WPM</span><span>ミス${r.errors}回</span></div>`).join(''):'<p class="sub">まだ記録がありません。</p>'}</div><div class="panel"><h3>最近のピック救出</h3>${rec.length?rec.map(([id,r])=>{const p=pickIndex.get(id);return `<div class="historyRow"><span>${htm(p.name)} <small class="muted">${htm(p.no)}</small></span><span>${htm((r.date||'').slice(0,10))}</span></div>`;}).join(''):'<p class="sub">まだ救出記録がありません。草原から冒険を始めよう。</p>'}</div><div class="panel"><h3>練習について</h3><p class="intro">タイピングが速くなくても、失敗したピックには何度でも挑戦できます。強いピックほど問題が長くなります。</p><button class="btn green" data-act="practice">⌨️ 自由にタイピング練習</button></div>`;}
function azText(ms){return (Math.max(0,ms)/1000).toFixed(2)+' 秒';}
function azReset(){if(azTimer!==null){clearInterval(azTimer);azTimer=null;}az=null;}
function azStart(mode){if(!['record','guest'].includes(mode))return;azReset();az={mode,phase:'ready',i:0,errors:0,start:0,ms:0,best:false};screen='aztime';render();}
function azPress(e){if(!az||!['ready','running'].includes(az.phase))return false;if(e.key==='Escape'){e.preventDefault();azReset();render();return true;}if(e.key.length!==1||!/^[a-z]$/i.test(e.key))return false;e.preventDefault();const now=performance.now(),ch=e.key.toUpperCase();if(ch!==AZ_LETTERS[az.i]){az.errors++;sound(160,.04);updateAzDisplay();return true;}if(az.phase==='ready'){az.phase='running';az.start=now;azTimer=setInterval(updateAzDisplay,40);}az.i++;if(az.i===26){az.ms=Math.max(1,Math.round(now-az.start));az.phase='finished';if(azTimer!==null){clearInterval(azTimer);azTimer=null;}if(az.mode==='record'){az.best=!S.bestMs||az.ms<S.bestMs;if(az.best)S.bestMs=az.ms;S.azRuns.unshift({ms:az.ms,errors:az.errors,date:new Date().toISOString()});S.azRuns=S.azRuns.slice(0,20);for(const n of AZ_TIERS){if(az.ms<=n&&!S.azMilestones.includes(n))S.azMilestones.push(n);}save();}sound(950,.14);render();}else{updateAzDisplay();}return true;}
function updateAzDisplay(){if(!az||!['ready','running'].includes(az.phase)||screen!=='aztime')return;const el=document.getElementById('azTime');if(el)el.textContent=azText(az.phase==='running'?performance.now()-az.start:0);const next=document.getElementById('azNext');if(next)next.textContent=AZ_LETTERS[az.i];const errs=document.getElementById('azErrors');if(errs)errs.textContent='ミス '+az.errors+'回';for(const x of document.querySelectorAll('.azLetter')){const n=Number(x.dataset.i);x.classList.toggle('done',n<az.i);x.classList.toggle('next',n===az.i);}}
function azView(){const t=az,b=S.bestMs?azText(S.bestMs):'記録なし';const intro=t===null?`<div class="grid2"><div class="card"><h3>🏆 本人モード</h3><p class="sub">自己ベストと直近20回の記録を保存します。</p><button class="btn gold full" data-act="azStart" data-id="record">記録ありで挑戦</button></div><div class="card"><h3>👤 ゲストモード</h3><p class="sub">タイム・ミス回数・本編の進行は一切保存しません。</p><button class="btn ghost full" data-act="azStart" data-id="guest">ゲストで挑戦</button></div></div>`:`<div class="azArena"><div class="chip">${t.mode==='guest'?'ゲスト（記録なし）':'本人（記録あり）'}</div><div class="azWatch" id="azTime">${azText(t.phase==='running'?performance.now()-t.start:t.ms)}</div><div class="azTarget">${t.phase==='finished'?'完走！ 次は自己ベストへ':'次のキー'} <strong id="azNext">${AZ_LETTERS[t.i]||'FINISH'}</strong></div>${t.phase==='finished'?`<h3>${t.best?'🎉 自己ベスト更新！':t.mode==='guest'?'ゲスト挑戦：保存していません':'挑戦完了！'}</h3><p class="sub">ミス ${t.errors}回</p><div class="buttons" style="justify-content:center;margin-top:8px"><button class="btn gold" data-act="azRetry">同じモードで再挑戦</button><button class="btn ghost" data-act="azStop">モード選択へ</button></div>`:`<div class="azLetters">${[...AZ_LETTERS].map((k,i)=>`<span class="azLetter ${i<t.i?'done':i===t.i?'next':''}" data-i="${i}">${k}</span>`).join('')}</div><div class="azMeta"><span>${t.i} / 26</span><span id="azErrors">ミス ${t.errors}回</span></div><p class="sub">${t.phase==='ready'?'Aキーを押すと計測開始。':'Zを正しく押すと計測終了。'}</p><button class="btn ghost tiny" data-act="azStop">中止（Esc）</button>`}</div>`;return `<div class="heading"><h2>⏱️ A～Z タイムアタック</h2><button class="btn ghost tiny" data-act="tab" data-id="adventure">冒険へ</button></div><div class="grid2" style="margin-bottom:9px"><div class="card"><div class="sub">自己ベスト</div><h2>${b}</h2></div><div class="card"><div class="sub">本人の記録</div><h2>${S.azRuns.length}件</h2></div></div><div class="panel"><p class="sub" style="margin-bottom:10px">AからZまで順番に入力。間違っても固定の時間ペナルティはなく、時計は止まりません。Aで開始、Zで終了。</p>${intro}</div>${!t||t.phase==='finished'?`<details class="panel"><summary>🏆 称号・記録履歴</summary><div class="sub">達成称号：${S.azMilestones.length?S.azMilestones.slice().sort((a,b)=>b-a).map(n=>azText(n)+'以内').join('、'):'なし'}</div>${S.azRuns.slice(0,8).map((r,i)=>`<div class="historyRow"><span>${i+1}. ${azText(r.ms)}</span><span>ミス${r.errors}回　${htm(r.date.slice(0,10))}</span></div>`).join('')}</details>`:''}`;}
function endingView(){return `<div class="heading"><h2>✨ エンディング　ことばの灯</h2></div><div class="opening"><div class="openingInner"><div class="openingIcon">🌟</div><h2 class="openingTitle">おかえり、みんなの声。</h2><p class="openingQuote">最後の石碑が輝くと、封じられていた声が世界に戻りました。<br>カナデ博士：「一文字ずつ助けてくれたから、世界はまた声を取り戻せたんだね。」<br>レン：「ありがとう！ でも、まだ救われていないピックがたくさんあるよ！」</p><div class="notice">物語クリア！　救出 ${rescuedTotal()} / ${PICKS.length}枚。図鑑完成まで冒険は続きます。</div><div style="margin-top:13px"><button class="btn gold" data-act="continueAfterEnd">図鑑収集を続ける ▶</button></div></div></div>`;}
function helpView(){return `<div class="heading"><h2>❔ 遊び方・設定</h2></div><div class="panel"><h3>新しいゲームの目的</h3><p class="intro">レベル・HP・手持ち6匹・進化・モンスターボール・通常戦闘はありません。タイピングで1枚ずつフレンダピックを救出して図鑑を完成させる冒険です。救出済みピックは二度と出現しません。同じポケモンでも異なる弾や番号なら別ピックです。</p><h3 style="margin-top:14px">冒険の進め方</h3><p class="intro">9×7の探索マップで🌿を探すか「未救出ピックを探す」から救出に挑戦してください。地域ごとの目標数を助けた後、🔮石碑を見つけて解読します。石碑を解読すると次の地域が開きます。8地域すべての石碑を解けばエンディングです。</p><h3 style="margin-top:14px">タイピング操作</h3><p class="intro">英字入力（IME OFF）、Tabで選択、Enterで決定。G＝冒険、D＝図鑑、J＝物語、R＝記録、T＝A～Z、H＝遊び方。探索中は矢印キー・WASDで移動。挑戦中はEscで一時停止できます。し＝shi/si、ち＝chi/tiなどの複数ローマ字が使えます。</p><h3 style="margin-top:14px">画像・マスタと保存</h3><p class="intro">ピック情報はフレンダマスタから必要な項目を抽出した軽量データを同梱しています。同じフォルダに共通の <code>frenda-master.js</code> があればそちらも読み込みます。画像は公式URLを参照しますが、公開利用の権利・配信可否は別途確認してください。画像を取得できなくてもゲームを続けられます。救出記録はブラウザのlocalStorageに保存され、サーバには送られません。</p><h3 style="margin-top:14px">A～Zタイムアタック</h3><p class="intro">Aを押した瞬間に計測開始、Zで終了します。ミスの固定加算はありません。本人モードは記録を保存し、ゲストモードは保存しません。育成用コインは廃止したため、新しい報酬は達成称号です。</p><div class="buttons" style="margin-top:12px"><button class="btn green" data-act="tutorialAgain">⌨️ チュートリアルを再確認</button><button class="btn ghost" data-act="sound">🔊 音 ${S.music?'ON':'OFF'}</button></div></div><div class="panel"><h3>💾 セーブデータのバックアップ</h3><p class="sub">Ver14専用の新形式です。旧Ver13の育成セーブとは互換性がありません。ブラウザを変える場合はJSONを書き出してください。</p><div class="buttons" style="margin-top:9px"><button class="btn green" data-act="export">JSONを書き出す</button><button class="btn ghost" data-act="import">JSONを読み込む</button><button class="btn red" data-act="reset">セーブを初期化する</button></div><input type="file" id="importFile" accept=".json,application/json" hidden></div><div class="panel"><h3>📊 収録データ</h3><p class="sub">利用可能 ${PICKS.length}枚（暫定データ・今後の公開日分を除外）。画像未確認ピックは代替アイコンです。マスタの更新により対象件数は変動します。</p></div>`;}
function tabTo(id){if(challenge){notify('挑戦中です。完了または中止してください。');return;}if(az&&['ready','running'].includes(az.phase)){azReset();}const allowed=['adventure','dex','journal','record','aztime','help','ending'];if(!allowed.includes(id))return;screen=id;rescueLast=null;render();}
function exportSave(){const payload={...S,schema:SAVE_SCHEMA};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='typing_rescue_save_v14.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importSave(f){if(!f)return;try{if(f.size>2*1024*1024)throw Error('2MBを超えるファイルは読み込めません');const o=JSON.parse(await f.text());if(!o||o.schema!==SAVE_SCHEMA||!o.rescued||!o.stats||!o.seen||!Array.isArray(o.stones))throw Error('Ver14形式のセーブではありません');if(!confirm('現在の進行を上書きして読み込みますか？'))return;localStorage.setItem(SAVE_KEY,JSON.stringify(o));S=newSave();load();rescueLast=null;challenge=null;screen='adventure';render();notify('セーブデータを読み込みました。');}catch(e){notify('読み込みに失敗：'+e.message);}}
function handle(action,id=''){if(!action)return;switch(action){
case 'sound':S.music=!S.music;save();render();break;
case 'tab':tabTo(id);break;
case 'openingNext':if(S.opening<OPENING.length-1)S.opening++;else S.openingDone=true;save();render();break;
case 'openingSkip':if(!confirm('物語の冒頭をスキップしますか？'))return;S.openingDone=true;save();render();break;
case 'partner':if(!['フシギダネ','ヒトカゲ','ゼニガメ'].includes(id))return;S.partner=id;save();render();break;
case 'tutorialNext':if(S.tutorialStep===7)S.tutorialDone=true;else S.tutorialStep++;save();render();break;
case 'tutorialType':startChallenge('tutorial');break;
case 'enterZone':enterZone(Number(id));break;
case 'leaveZone':S.field=null;save();render();break;
case 'tileStep':{const a=id.split(',').map(Number),f=S.field;if(f&&Math.abs(f.x-a[0])+Math.abs(f.y-a[1])===1)moveField(a[0]-f.x,a[1]-f.y);else notify('隣接するマスだけを移動できます。');break;}
case 'move':{const a=id.split(',').map(Number);moveField(a[0],a[1]);break;}
case 'searchPick':searchPick();break;
case 'stone':startStone();break;
case 'nextZone':if(S.field&&unlocked(S.field.zone+1)&&S.field.zone<7)enterZone(S.field.zone+1);break;
case 'pause':pauseChallenge();break;
case 'giveup':if(!challenge)return;if(!confirm('タイピングを中止しますか？ 途中の問題は未クリア扱いです。'))return;endChallenge(false);break;
case 'finishChallenge':exitChallenge();break;
case 'retryChallenge':{const c=challenge;if(!c)return;const pick=pickIndex.get(c.pickId);const kind=c.kind;cancelTimers();challenge=null;startChallenge(kind,pick||null);break;}
case 'retryPick':rescueLast=null;if(pickIndex.has(id)&&!S.rescued[id])startChallenge('rescue',pickIndex.get(id));else render();break;
case 'searchAgain':rescueLast=null;searchPick();break;
case 'backField':rescueLast=null;render();break;
case 'dexPrev':dexPage=Math.max(0,dexPage-1);render();break;
case 'dexNext':dexPage++;render();break;
case 'dexClear':dexFilter='all';dexSearch='';dexSeries='all';dexPage=0;render();break;
case 'practice':startChallenge('practice');break;
case 'azStart':azStart(id);break;
case 'azStop':azReset();render();break;
case 'azRetry':{const mode=az?.mode||'record';azStart(mode);break;}
case 'ending':screen='ending';render();break;
case 'continueAfterEnd':screen='adventure';S.field=null;save();render();break;
case 'tutorialAgain':if(confirm('チュートリアルをもう一度最初から始めますか？ 冒険の救出記録は維持されます。')){S.tutorialStep=0;S.tutorialDone=false;S.field=null;save();screen='adventure';render();}break;
case 'export':exportSave();break;
case 'import':document.getElementById('importFile')?.click();break;
case 'reset':if(confirm('全ての救出・石碑・タイムアタック記録を初期化しますか？')&&confirm('本当に最初から始めますか？')){localStorage.removeItem(SAVE_KEY);S=newSave();rescueLast=null;challenge=null;azReset();screen='adventure';render();}break;
}}
function keydown(e){if(e.ctrlKey||e.altKey||e.metaKey||e.isComposing)return;if(challenge?.phase==='typing'){if(handleTypingKey(e))return;}if(screen==='aztime'&&az&&['ready','running'].includes(az.phase)){if(azPress(e))return;}if(e.key==='Escape'){if(rescueLast){rescueLast=null;render();return;}if(screen!=='adventure'){tabTo('adventure');return;}if(S.field){S.field=null;save();render();return;}}
if(!S.openingDone){if(e.key==='Enter'||e.key===' '){if(e.target.closest('button'))return;e.preventDefault();handle('openingNext');}return;}
if(!S.partner||!S.tutorialDone)return;
if(e.target.matches('input,select,textarea'))return;
if(S.field&&screen==='adventure'&&!challenge&&!rescueLast){const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(dirs[e.key]){e.preventDefault();moveField(...dirs[e.key]);return;}}
if(e.key>='1'&&e.key<='9'&&e.key.length===1){const buttons=[...document.querySelectorAll('main button[data-act]:not(:disabled)')];const b=buttons[Number(e.key)-1];if(b){e.preventDefault();b.click();return;}}
const key=e.key.toLowerCase(),to={g:'adventure',d:'dex',j:'journal',r:'record',t:'aztime',h:'help'}[key];if(to){e.preventDefault();tabTo(to);return;}if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button,select,summary')){const b=document.querySelector('main button[data-act]:not(:disabled)');if(b){e.preventDefault();b.click();}}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;handle(b.dataset.act,b.dataset.id||'');});
document.addEventListener('keydown',keydown);
document.addEventListener('input',e=>{if(e.target.id==='dexSearch'){const input=e.target,dexMain=document.querySelector('.dexList'),val=input.value,sel=input.selectionStart;dexSearch=val;dexPage=0;render();const n=document.getElementById('dexSearch');n?.focus();if(n){n.setSelectionRange(sel,sel);}if(dexMain)dexMain.scrollTop=0;}});
document.addEventListener('change',e=>{if(e.target.id==='dexFilter'){dexFilter=e.target.value;dexPage=0;render();}if(e.target.id==='dexSeries'){dexSeries=e.target.value;dexPage=0;render();}if(e.target.id==='importFile'){const f=e.target.files?.[0];e.target.value='';if(f)importSave(f);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&challenge&&!challenge.pausedAt){challenge.remaining=Math.max(0,challenge.duration-(performance.now()-challenge.started)/1000);challenge.pausedAt=performance.now();}else if(!document.hidden&&challenge?.pausedAt){render();}});
loadSnapshot();load();render();
window.addEventListener('load',()=>{useSharedMaster();});
</script></body></html>
